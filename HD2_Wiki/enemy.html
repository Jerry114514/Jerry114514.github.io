<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>敌人详情 - 绝地潜兵2 中文维基</title>
  <meta name="description" content="绝地潜兵2 敌人详情页" />
  <link rel="stylesheet" href="./assets/css/wiki-base.css">
  <style>
/* 页面专属变量（核心 10 变量见 assets/css/wiki-base.css） */
    :root { --terminid: #FF4444; --automaton: #4488FF; --illuminate: #AA44FF; }


    .wiki-header { padding: 24px 20px 16px; background: linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%); border-bottom: 1px solid var(--border); }

    .breadcrumb { max-width: 1400px; margin: 0 auto; font-size: 0.8rem; color: var(--text-mute); }

    .breadcrumb a { color: var(--blue); text-decoration: none; }

    .breadcrumb a:hover { color: var(--yellow); }


    .detail-layout { flex: 1; max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 70% 30%; gap: 20px; width: 100%; align-items: start; }

    .detail-layout > * { min-width: 0; }


    .main-content { display: flex; flex-direction: column; gap: 20px; }

    .card { background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }

    .card h2 { font-size: 1rem; color: var(--text); margin-bottom: 10px; }


    .title-block .name { font-size: 1.8rem; color: var(--text); }

    .title-block .name-en { font-size: 1rem; color: var(--text-mute); margin: 2px 0 8px; }

    .title-block .tags { display: flex; gap: 8px; margin-bottom: 10px; }

    .faction-tag { padding: 3px 12px; border-radius: 10px; font-size: 12px; color: #fff; }

    .cat-tag { padding: 3px 12px; border-radius: 10px; font-size: 12px; background: rgba(255,255,255,0.08); color: var(--text-dim); }

    .title-block .desc { font-size: 0.88rem; color: var(--text-dim); line-height: 1.7; }


    .img-big { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border-radius: 8px; min-height: 220px; }

    .img-big img { max-height: 300px; max-width: 100%; object-fit: contain; }

    .img-big .placeholder { font-size: 4rem; color: var(--text-mute); }


    .info-table { width: 100%; border-collapse: collapse; }

    .info-table tr { border-bottom: 1px solid var(--border); }

    .info-table td { padding: 8px 10px; font-size: 0.85rem; }

    .info-table td:first-child { color: var(--text-mute); width: 35%; }

    .info-table td:last-child { color: var(--text); }


        .part-table { width: 100%; border-collapse: collapse; }
    .table-wrap { position: relative; overflow-x: auto; }
    .table-wrap::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 24px; pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(11,14,20,.85)); }
    .scroll-hint { font-size: .68rem; color: var(--text-mute); font-weight: 400; margin-left: 8px; }
    .part-table th:first-child, .part-table td:first-child { position: sticky; left: 0; background: #131826; z-index: 1;
      box-shadow: 2px 0 4px rgba(0,0,0,.3); }
    .info-side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 20px; align-self: start; }
    .sum-head { display: flex; align-items: center; gap: 12px; }
    .sum-head img { width: 56px; height: 56px; object-fit: contain; }
    .sum-name { font-size: 1.1rem; color: var(--text); }
    .sum-en { font-size: .76rem; color: var(--text-mute); }
    .sum-hp { margin-top: 12px; text-align: center; background: rgba(255,255,255,0.03); border-radius: 8px; padding: 12px; }
    .sum-hp-n { font-size: 1.6rem; font-family: "ZZZ-thick","SourceHanSans","Microsoft YaHei",sans-serif; color: var(--yellow); }
    .sum-hp-l { color: var(--text-mute); font-size: .72rem; }
    .side-toc { list-style: none; padding: 0; margin: 0; }
    .side-toc a { display: block; padding: 8px 10px; color: var(--text-dim); text-decoration: none; border-left: 2px solid var(--border); font-size: .85rem; }
    .side-toc a:hover { color: var(--blue); border-left-color: var(--blue); background: rgba(59,130,246,.08); }
    .side-link { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; color: var(--text-dim); text-decoration: none; font-size: .84rem; border-bottom: 1px dashed var(--border); }
    .side-link:last-child { border-bottom: none; }
    .side-link:hover { color: var(--blue); }
    .side-sub { font-size: .7rem; color: var(--text-mute); }
    .side-src { font-size: .75rem; color: var(--text-mute); word-break: break-all; margin: 0; }

    .part-table th { text-align: left; font-size: 0.75rem; color: var(--text-mute); padding: 8px; border-bottom: 1px solid var(--border); }

    .part-table td { padding: 6px 8px; font-size: 0.82rem; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text-dim); }

    .part-table td:first-child { color: var(--text); }

    .part-img { width: 60px; height: 40px; background: rgba(255,255,255,0.04); border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    .part-img img { max-width: 60px; max-height: 40px; object-fit: contain; }

    .part-img .ph { font-size: 1.2rem; color: var(--text-mute); }

    .part-count { font-size: 0.7rem; color: var(--text-mute); }

    .fatal-tag { color: #ef4444; }

    .wp-tag { color: var(--yellow); }

    .enemy-variants { display: flex; flex-wrap: wrap; gap: 6px; }

    .enemy-variant { font-size: 0.78rem; color: var(--text-dim); background: rgba(255,255,255,0.05); padding: 3px 10px; border-radius: 10px; text-decoration: none; border: 1px solid var(--border); transition: all 0.15s; }

    .enemy-variant:hover { color: var(--yellow); border-color: var(--yellow); }


    .loading, .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 0.9rem; }


    @media (max-width: 900px) { .detail-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="wiki-header">
    <div class="breadcrumb" id="breadcrumb">← <a href="enemies.html">敌人列表</a></div>
  </header>
  <div class="detail-layout" id="detail-layout"><div class="loading">正在加载敌人数据…</div></div>
  <footer class="wiki-footer"><p>绝地潜兵2 中文维基 · 社区驱动 · 数据仅供参考</p></footer>

  <script src="./assets/js/wiki-router.js"></script>
  <script>
    "use strict";
    var allEnemies = [];
    var FACTION_CN = { terminids: "终结族", automatons: "机器人", illuminate: "光能族" };
    var FACTION_COLOR = { terminids: "#f59e0b", automatons: "#ef4444", illuminate: "#AA44FF" };

    async function loadDetail() {
      var id = WikiRouter.param("id");
      var layout = document.getElementById("detail-layout");
      try {
        var r = await fetch("./data/wiki/zh/enemies.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        var d = await r.json();
        allEnemies = d.enemies || [];
        var e = (d.enemies || []).find(function(x) { return x.id === id; });
        if (!e) { layout.innerHTML = '<div class="empty">未找到该敌人</div>'; return; }
        renderDetail(e);
      } catch(err) {
        console.error("[Enemy] 加载失败:", err);
        layout.innerHTML = '<div class="empty">⚠️ 敌人数据加载失败</div>';
      }
    }

    function renderDetail(e) {
      var layout = document.getElementById("detail-layout");
      var fcn = FACTION_CN[e.faction] || e.faction_label || "未知";
      var fcolor = FACTION_COLOR[e.faction] || "#64748b";
      document.getElementById("breadcrumb").innerHTML =
        '← <a href="enemies.html">敌人列表</a> › ' + esc(fcn) + ' › ' + esc(e.name_zh || e.name);

      // 部位表格（wrapper 横滚 + sticky 首列 + 渐隐提示）
      var parts = e.body_parts || [];
      var partsHtml = parts.length ? '<div class="card" id="sec-parts"><h2>🦴 部位数据<span class="scroll-hint">表可横向滚动 →</span></h2><div class="table-wrap"><table class="part-table">' +
        '<tr><th>部位</th><th>图片</th><th>生命值</th><th>装甲</th><th>位置</th><th>耐久%</th><th>对主体%</th><th>致命</th><th>弱点</th></tr>' +
        parts.map(function(p) {
          var fatal = p.fatal === true ? '💀' : (p.fatal === false ? '' : (String(p.fatal || '').toLowerCase() === 'yes' ? '💀' : ''));
          var wp = p.is_weak_point === true || String(p.is_weak_point || '').toLowerCase() === 'true';
          return '<tr>' +
            '<td>' + esc(p.name || p.name_en) + (p.count ? ' <span class="part-count">×' + p.count + '</span>' : '') + '</td>' +
            '<td><div class="part-img">' + (p.image ? '<img src="' + esc(p.image) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<span class=ph>🔍</span>\'">' : '<span class="ph">🔍</span>') + '</div></td>' +
            '<td>' + esc(p.health != null ? p.health : '—') + '</td>' +
            '<td>' + esc(p.armor_level_zh || p.armor_level || p.armor || '—') + '</td>' +
            '<td>' + esc(p.location_zh || p.location || '—') + '</td>' +
            '<td>' + esc(p.durable || '—') + '</td>' +
            '<td>' + esc(p.percent_to_main || p.pct_to_main || '—') + '</td>' +
            '<td>' + (fatal ? '<span class="fatal-tag">💀</span>' : '') + '</td>' +
            '<td>' + (wp ? '<span class="wp-tag">⭐</span>' : '') + '</td></tr>';
        }).join("") + '</table></div></div>' : '';

      // 变种导航（siblings 去重：不再重复列出基础种自身）
      var variantNav = "";
      var baseUnit = e.base_unit || e.name;
      var siblings = allEnemies.filter(function(x) {
        return (x.base_unit || x.name) === baseUnit && x.name !== e.name && x.name !== baseUnit;
      });
      var isBase = !e.base_unit || e.base_unit === e.name;
      if (isBase && (e.variants || []).length) {
        variantNav = '<div class="card" id="sec-variants"><h2>🔄 变种</h2><div class="enemy-variants">' +
          e.variants.map(function(v) {
            var ve = allEnemies.find(function(x) { return x.name === v; });
            return '<a class="enemy-variant" href="enemy.html?id=' + encodeURIComponent(ve ? ve.id : v.toLowerCase().replace(/ /g,"_") ) + '">' + esc(v) + '</a>';
          }).join("") + '</div></div>';
      } else if (!isBase) {
        var baseId = baseUnit.toLowerCase().replace(/ /g, "_");
        var baseExists = allEnemies.some(function(x) { return x.id === baseId; });
        if (!baseExists && !siblings.length) variantNav = "";
        else variantNav = '<div class="card" id="sec-variants"><h2>🔗 所属：' + esc(baseUnit) + '</h2><div class="enemy-variants">' +
          (baseExists ? '<a class="enemy-variant" href="enemy.html?id=' + encodeURIComponent(baseId) + '">' + esc(baseUnit) + ' (基础)</a>' : '') +
          siblings.map(function(s2) {
            return '<a class="enemy-variant" href="enemy.html?id=' + encodeURIComponent(s2.id) + '">' + esc(s2.name) + '</a>';
          }).join("") + '</div></div>';
      }

      // 右栏：摘要 + 本页导航 + 同阵营 + 来源（承接原空置栏内容）
      var sameFaction = allEnemies.filter(function(x) {
        return x.faction === e.faction && x.id !== e.id && !x.is_strain_page;
      }).slice(0, 6);
      var sideHtml =
        '<div class="info-side">' +
          '<div class="card"><div class="sum-head">' +
            (e.image_thumb ? '<img src="' + esc(e.image_thumb) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : '') +
            '<div><div class="sum-name">' + esc(e.name_zh || e.name) + '</div>' +
            '<div class="sum-en">' + esc(e.name) + '</div></div>' +
          '</div>' +
          '<div class="sum-hp"><div class="sum-hp-n">' + esc(e.health_total) + '</div><div class="sum-hp-l">总生命值</div></div></div>' +
          '<div class="card"><h2>🧭 本页导航</h2><ul class="side-toc">' +
            '<li><a href="#sec-appearance">外观</a></li>' +
            '<li><a href="#sec-info">基础信息</a></li>' +
            (parts.length ? '<li><a href="#sec-parts">部位数据（' + parts.length + ' 个部位）</a></li>' : '') +
            (variantNav ? '<li><a href="#sec-variants">变种</a></li>' : '') +
          '</ul></div>' +
          '<div class="card"><h2>🔗 同阵营敌人</h2>' +
            sameFaction.map(function(x) {
              return '<a class="side-link" href="enemy.html?id=' + encodeURIComponent(x.id) + '"><span>' + esc(x.name_zh || x.name) + '</span><span class="side-sub">' + esc(x.category_zh || "") + '</span></a>';
            }).join("") +
          '</div>' +
          '<div class="card"><h2>📄 来源</h2><p class="side-src">' + esc(e.source_page || "—") + '</p></div>' +
        '</div>';

      layout.innerHTML =
        '<div class="main-content">' +
          '<div class="card title-block">' +
            '<div class="name">' + esc(e.name_zh || e.name) + '</div>' +
            '<div class="name-en">' + esc(e.name) + '</div>' +
            '<div class="tags">' +
              '<span class="faction-tag" style="background:' + fcolor + '">' + esc(fcn) + '</span>' +
              (e.category ? '<span class="cat-tag">' + esc(e.category_zh || e.category) + '</span>' : '') +
            '</div>' +
            (e.description ? '<div class="desc">' + esc(e.description_zh || e.description) + '</div>' : '') +
          '</div>' +
          variantNav +
          '<div class="card" id="sec-appearance"><h2>📷 外观</h2><div class="img-big">' + (e.image ?
            '<img src="' + esc(e.image) + '" alt="' + esc(e.name) + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<div class=placeholder>🐛</div>\'">' :
            '<div class="placeholder">🐛</div>') + '</div></div>' +
          '<div class="card" id="sec-info"><h2>📊 基础信息</h2><table class="info-table">' +
            row("阵营", fcn) + row("分类", e.category_zh || e.category) +
            row("总生命值", e.health_total) + row("伤害", e.damage_zh || e.damage) +
            row("伤害类型", e.damage_type_zh || e.damage_type) + row("火焰伤害倍率", e.fire_damage_multiplier_zh || e.fire_damage_multiplier) +
            row("踉跄阈值", e.stagger_threshold_zh || e.stagger_threshold) + row("最低难度", e.minimum_difficulty_zh || e.minimum_difficulty) +
          '</table></div>' +
          partsHtml +
        '</div>' +
        sideHtml;
    }

    function row(k, v) { return v == null || v === "" ? "" : '<tr><td>' + esc(k) + '</td><td>' + esc(v) + '</td></tr>'; }
    function esc(s) { return String(s || "").replace(/[&<>"']/g, function(c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }

    document.addEventListener("DOMContentLoaded", loadDetail);
  </script>
</body>
</html>
