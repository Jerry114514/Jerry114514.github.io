<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>战争债券总览 - 绝地潜兵2 中文维基</title>
  <meta name="description" content="绝地潜兵2 战争债券总览 - Warbonds · 标准 / 高级 / 传奇 三类债券封面一览 · 点击封面进入各债券逐页奖励" />
  <link rel="stylesheet" href="./assets/css/wiki-base.css?v=20260913e">
  <style>
    .wiki-header { text-align: center; padding: 32px 20px 20px; background: linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%); border-bottom: 1px solid var(--border); }

    .wiki-header h1 { font-size: 1.6rem; color: var(--yellow); margin-bottom: 4px; }

    .wiki-header p { color: var(--text-dim); font-size: 0.85rem; }

    .wiki-header .back { display: inline-block; margin-top: 10px; color: var(--text-dim); text-decoration: none; font-size: 0.85rem; padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; transition: all 0.2s; }


    .wb-intro { width: 100%; max-width: 1200px; margin: 0 auto; padding: 18px 20px 0; }

    .wb-intro .box { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--yellow); padding: 12px 16px; }

    .wb-intro h2 { font-size: 0.95rem; color: var(--yellow); margin-bottom: 6px; letter-spacing: 0.04em; }

    .wb-intro p { font-size: 0.83rem; color: var(--text-dim); line-height: 1.75; }

    .wb-intro .src { font-size: 0.7rem; color: var(--text-mute); }


    /* 筛选条计数（复用 wiki-base.css 的 .wiki-toolbar .filter-bar 键帽按钮） */
    .filter-bar button .c { font-family: var(--font-mono); font-size: 0.72rem; margin-left: 5px; color: var(--text-mute); }

    .filter-bar button.active .c { color: #000; }


    .wb-shell { flex: 1; max-width: 1200px; margin: 0 auto; padding: 16px 20px 40px; width: 100%; }

    /* ── 分组：一个小标题 + 封面大图卡片网格（对齐 wiki List of Warbonds 的信息序） ── */
    .wb-group { margin-bottom: 26px; }

    .wb-group:last-of-type { margin-bottom: 0; }

    .wb-group-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      font-size: 1rem; color: var(--yellow); padding: 8px 12px;
      background: var(--stripe); border: 1px solid var(--border); border-left: 4px solid var(--brass); }

    .wb-group-title .gt-en { font-size: 0.72rem; font-weight: 400; color: var(--text-mute); letter-spacing: 0.08em; }

    .wb-group-title .gt-count { margin-left: auto; font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim); font-weight: 400; }

    .wb-grid { display: grid; width: 100%; margin-top: 12px; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

    .wb-card { display: flex; flex-direction: column; min-width: 0; overflow: hidden;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      text-decoration: none; color: inherit; transition: transform 0.2s ease, border-color 0.2s ease; }

    .wb-card:hover { transform: translateY(-4px); border-color: var(--yellow); }

    .wb-card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    .wb-cover { display: flex; align-items: center; justify-content: center; width: 100%;
      aspect-ratio: 2 / 1; padding: 6px; background: rgba(255,255,255,0.04); border-bottom: 1px solid var(--border); }

    .wb-cover img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .wb-cover .ph { font-size: 2.4rem; color: var(--text-mute); }

    .wb-body { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 10px 12px; text-align: center; }

    .wb-name { font-size: 0.92rem; color: var(--text); font-weight: 600; line-height: 1.35; }

    .wb-card:hover .wb-name { color: var(--yellow); }

    .wb-en { font-size: 0.7rem; color: var(--text-mute); line-height: 1.35; }

    .wb-meta { margin-top: 4px; font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-dim); }

    /* 从详情页「在总览页中定位本债券」跳转进来的高亮 */
    .wb-card.is-target { border-color: var(--yellow); box-shadow: inset 0 0 0 1px var(--yellow); }


    .loading, .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 0.9rem; }


    @media (max-width: 768px) {
      .wiki-header { padding: 26px 14px 16px; }
      .wb-intro { padding: 14px 12px 0; }
      .wb-shell { padding: 12px 12px 32px; }
      .wb-group { margin-bottom: 20px; }
      .wb-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
      .wb-cover { padding: 4px; }
      .wb-body { padding: 8px 7px 10px; }
      .wb-name { font-size: 0.82rem; }
      .wb-en { font-size: 0.64rem; }
      .wb-meta { font-size: 0.62rem; }
    }
  </style>
  <link rel="stylesheet" href="./assets/css/hud-skin.css?v=20260918a">
</head>
<body>
  <header class="wiki-header">
    <h1>🎖️ 战争债券</h1>
    <p>全部 <span id="total-count">25</span> 个战争债券，按发行时间排序</p>
    <a class="back" href="wiki.html">◀ 返回维基首页</a>
  </header>

  <section class="wb-intro">
    <div class="box">
      <h2>战争债券 / Warbonds</h2>
      <p>战争债券是《绝地潜兵2》的奖励轨道，在采购中心内使用勋章逐页解锁武器、战略配备、强化资源与外观。标准债券免费开放；高级债券与传奇债券分别需要 1,000 与 1,500 超级货币解锁。战争债券不会下架，可以按自己的节奏推进。</p>
      <p class="src">资料整理自 wiki.gg 的 Warbonds 与各债券页面 · 译名以本站既有译法为准 · 逐页奖励与武器／战略配备的站内链接见各债券详情页</p>
    </div>
  </section>

  <div class="wiki-toolbar">
    <div class="filter-bar" id="type-filter" role="group" aria-label="按类型筛选战争债券">
      <button type="button" class="active" data-type="all" aria-pressed="true">全部<span class="c" data-count="all">25</span></button>
      <button type="button" data-type="Standard" aria-pressed="false">标准战争债券<span class="c" data-count="Standard">0</span></button>
      <button type="button" data-type="Premium" aria-pressed="false">尊享战争债券<span class="c" data-count="Premium">0</span></button>
      <button type="button" data-type="Legendary" aria-pressed="false">传奇战争债券<span class="c" data-count="Legendary">0</span></button>
    </div>
    <span class="wt-divider"></span>
    <label class="wt-search"><input type="text" id="search-input" placeholder="🔍 搜索战争债券名称或奖励…（支持中文/英文）" oninput="applyFilter()"></label>
    <span class="wt-count" id="result-count">25 / 25</span>
  </div>

  <div class="wb-shell" id="wb-shell">
    <div class="loading">正在加载战争债券数据…</div>
  </div>

  <footer class="wiki-footer"><p>绝地潜兵2 中文维基 · 社区驱动 · 数据仅供参考</p></footer>

  <script>
    "use strict";

    var WARBONDS = [];
    var BY_ID = {};
    var TYPE_ZH = { "Standard": "标准", "Premium": "高级", "Legendary": "传奇" };
    var TYPE_ORDER = ["Standard", "Premium", "Legendary"];
    var activeType = "all";
    var targetId = "";

    function typeLabel(t) { return TYPE_ZH[t] || t || "—"; }

    function typeTagClass(t) {
      if (t === "Standard") return "tag tag-std";
      if (t === "Legendary") return "tag tag-leg";
      return "tag tag-prem";
    }

    /* 分组小标题左侧色条（与详情页徽章同色系） */
    function typeAccent(t) {
      if (t === "Standard") return "var(--yellow)";
      if (t === "Legendary") return "var(--brass)";
      return "var(--blue)";
    }

    /* 破图兜底：把 <img> 换成同尺寸的占位符，避免出现死图 */
    function phIcon(img) {
      return '<span class="ph">' + (img.getAttribute("data-ph") || "🎖️") + '</span>';
    }

    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }

    function byDate(a, b) {
      var da = a.release_date || "9999-12-31", db = b.release_date || "9999-12-31";
      if (da === db) return 0;
      return da < db ? -1 : 1;
    }

    /* 搜索文本：名称 + 简介 + 逐页奖励名（含已加站内引用的奖励） */
    function haystack(w) {
      var parts = [w.name, w.name_en, w.intro_zh, w.overview_zh, w.price_zh];
      (w.tables || []).forEach(function(t) {
        (t.rows || []).forEach(function(r) { parts.push((r || []).join(" ")); });
      });
      return parts.join(" ").toLowerCase();
    }

    async function loadAll() {
      var shell = document.getElementById("wb-shell");
      try {
        var r = await fetch("./data/wiki/zh/warbonds.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        var d = await r.json();
        WARBONDS = (d.warbonds || []).slice().sort(byDate);
        if (!WARBONDS.length) throw new Error("空数据集");
        WARBONDS.forEach(function(w) { BY_ID[w.id] = w; });
        render();
      } catch (e) {
        console.error("[Warbonds] 加载失败:", e);
        shell.innerHTML = '<div class="empty">⚠️ 战争债券数据加载失败<br><br>' +
          '<a href="wiki.html" style="color:var(--yellow);">◀ 返回维基首页</a></div>';
        return;
      }
      var tc = document.getElementById("total-count");
      if (tc) tc.textContent = WARBONDS.length;
      applyHash();
      applyFilter();
    }

    function render() {
      var shell = document.getElementById("wb-shell");
      var counts = { all: WARBONDS.length, Standard: 0, Premium: 0, Legendary: 0 };
      WARBONDS.forEach(function(w) { if (counts[w.type] != null) counts[w.type]++; });
      Array.prototype.forEach.call(document.querySelectorAll("[data-count]"), function(el) {
        var k = el.getAttribute("data-count");
        if (counts[k] != null) el.textContent = counts[k];
      });

      var html = "";
      TYPE_ORDER.forEach(function(t) {
        var group = WARBONDS.filter(function(w) { return w.type === t; });
        if (!group.length) return;
        html += '<section class="wb-group" id="group-' + t.toLowerCase() + '" data-type="' + t + '">' +
          '<h2 class="wb-group-title" style="border-left-color:' + typeAccent(t) + '">' +
            '<span class="gt-zh">' + esc(typeLabel(t)) + '债券</span>' +
            '<span class="gt-en">' + t + '</span>' +
            '<span class="gt-count">' + group.length + ' 个</span>' +
          '</h2>' +
          '<div class="wb-grid">' + group.map(cardHtml).join("") + '</div>' +
        '</section>';
      });
      shell.innerHTML = html + '<div id="wb-empty" class="empty" hidden>没有匹配的战争债券</div>';
    }

    function cardHtml(w) {
      var unreleased = w.release_status === "unreleased";
      return '<a class="wb-card" data-id="' + esc(w.id) + '" data-type="' + esc(w.type) + '" ' +
        'href="warbond.html?id=' + encodeURIComponent(w.id) + '">' +
        '<span class="wb-cover">' +
          (w.icon
            ? '<img src="' + esc(w.icon) + '" alt="' + esc(w.name) + ' 封面" loading="lazy" decoding="async" ' +
              'referrerpolicy="no-referrer" data-ph="🎖️" onerror="this.outerHTML=phIcon(this)">'
            : '<span class="ph">🎖️</span>') +
        '</span>' +
        '<span class="wb-body">' +
          '<span class="wb-name">' + esc(w.name) + '</span>' +
          '<span class="wb-en">' + esc(w.name_en) + '</span>' +
          '<span class="wb-meta">' + esc(w.release_date || "—") + ' · ' + esc(w.price_zh || "—") +
            (unreleased ? ' · <span style="color:#FFB59E">未发布</span>' : '') + '</span>' +
        '</span>' +
      '</a>';
    }

    /* 深链：#<债券 id> 定位该债券（详情页「在总览页中定位本债券」用）；#group-<英文类型> 直接筛出该组 */
    function applyHash() {
      var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
      if (!h) return;
      if (BY_ID[h]) {
        targetId = h;
        activeType = BY_ID[h].type;
        return;
      }
      var t = TYPE_ORDER.filter(function(x) { return "group-" + x.toLowerCase() === h; })[0];
      if (t) activeType = t;
    }

    function applyFilter() {
      var q = (document.getElementById("search-input").value || "").trim().toLowerCase();
      var cards = document.querySelectorAll(".wb-card");
      var shown = 0;
      Array.prototype.forEach.call(cards, function(c) {
        var w = BY_ID[c.getAttribute("data-id")];
        var typeOk = activeType === "all" || c.getAttribute("data-type") === activeType;
        var qOk = !q || (w ? haystack(w).indexOf(q) >= 0 : false);
        var show = typeOk && qOk;
        c.style.display = show ? "" : "none";
        if (show) shown++;
      });
      Array.prototype.forEach.call(document.querySelectorAll(".wb-group"), function(g) {
        var any = Array.prototype.some.call(g.querySelectorAll(".wb-card"), function(c) { return c.style.display !== "none"; });
        g.hidden = !any;
      });
      var empty = document.getElementById("wb-empty");
      if (empty) empty.hidden = shown !== 0;
      var rc = document.getElementById("result-count");
      if (rc) rc.textContent = shown + " / " + WARBONDS.length;
      Array.prototype.forEach.call(document.querySelectorAll("#type-filter button"), function(b) {
        var on = b.getAttribute("data-type") === activeType;
        if (on) b.classList.add("active"); else b.classList.remove("active");
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      if (targetId) {
        var card = document.querySelector('.wb-card[data-id="' + targetId + '"]');
        if (card && card.style.display !== "none") {
          card.classList.add("is-target");
          if (card.scrollIntoView) card.scrollIntoView({ block: "center", behavior: "smooth" });
        }
        targetId = "";
      }
    }

    Array.prototype.forEach.call(document.querySelectorAll("#type-filter button"), function(b) {
      b.addEventListener("click", function() {
        activeType = b.getAttribute("data-type");
        applyFilter();
      });
    });

    window.addEventListener("hashchange", function() { applyHash(); applyFilter(); });

    document.addEventListener("DOMContentLoaded", loadAll);
  </script>
</body>
</html>
