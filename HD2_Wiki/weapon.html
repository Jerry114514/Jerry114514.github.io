<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>武器详情 - 绝地潜兵2 中文维基</title>
  <meta name="description" content="绝地潜兵2 武器详情页" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #0a0e1a; --bg-mid: #141b33; --bg-card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.08); --text: #e2e8f0; --text-dim: #94a3b8;
      --text-mute: #64748b; --yellow: #f5c518; --blue: #3b82f6; --radius: 12px; --amber: #f59e0b; --red: #ef4444;
    }
    @font-face { font-family: 'ChuangKeTi'; src: url('./assets/ChuangKeTieJinGangTi-2.otf') format('opentype'); }
@font-face { font-family: 'SourceHanSans'; src: url('./assets/SourceHanSansCN-Medium.otf') format('opentype'); }
    html, body { height: 100%; font-family: "SourceHanSans","Microsoft YaHei","PingFang SC",sans-serif; background: var(--bg-deep); color: var(--text); }
    body { display: flex; flex-direction: column; }

    .wiki-header { padding: 24px 20px 16px; background: linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%); border-bottom: 1px solid var(--border); }
    .breadcrumb { max-width: 1100px; margin: 0 auto; font-size: 0.8rem; color: var(--text-mute); }
    .breadcrumb a { color: var(--blue); text-decoration: none; }
    .breadcrumb a:hover { color: var(--yellow); }

    .detail-layout { flex: 1; max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 70% 30%; gap: 20px; width: 100%; }

    .main-content { display: flex; flex-direction: column; gap: 20px; }
    .info-card { display: flex; flex-direction: column; gap: 16px; }
    .info-card .card { background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .info-card .card h2 { font-size: 1rem; color: var(--text); margin-bottom: 10px; }

    .title-block .name { font-size: 1.8rem; color: var(--text); }
    .title-block .name-en { font-size: 1rem; color: var(--text-mute); margin: 2px 0 8px; }
    .detail-icon { display: flex; align-items: center; justify-content: center; height: 100px; margin: 0 auto 12px; }
    .detail-icon img { max-height: 100px; max-width: 180px; object-fit: contain; }
    .detail-icon .ph { font-size: 3rem; color: var(--text-mute); }
    .title-block .unlock { font-size: 0.8rem; color: var(--yellow); }
    .title-block .desc { margin-top: 10px; font-size: 0.88rem; color: var(--text-dim); line-height: 1.7; }
    .title-block .lore { margin-top: 6px; font-size: 0.8rem; color: var(--text-mute); line-height: 1.6; font-style: italic; }

    .stats-table { width: 100%; border-collapse: collapse; }
    .stats-table tr { border-bottom: 1px solid var(--border); }
    .stats-table td { padding: 8px 10px; font-size: 0.85rem; }
    .stats-table td:first-child { color: var(--text-mute); width: 40%; }
    .stats-table td:last-child { color: var(--text); }

    .variant-card { display: block; padding: 12px; border: 1px solid var(--border); border-radius: 8px; text-decoration: none; color: inherit; transition: all 0.2s; margin-bottom: 8px; }
    .variant-card:hover { border-color: var(--blue); background: rgba(59,130,246,0.08); }
    .variant-card .v-name { font-size: 0.88rem; color: var(--text); font-weight: 600; }
    .variant-card .v-desc { font-size: 0.78rem; color: var(--text-dim); margin: 4px 0; }
    .variant-card .v-unlock { font-size: 0.75rem; color: var(--yellow); }

    .tips-list { padding-left: 18px; }
    .tips-list li { font-size: 0.85rem; color: var(--text-dim); line-height: 1.8; }

    .info-side { display: flex; flex-direction: column; gap: 16px; }
    .side-card { background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .side-card h3 { font-size: 0.9rem; color: var(--text); margin-bottom: 12px; }
    .side-card .field { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; }
    .side-card .field:last-child { border-bottom: none; }
    .side-card .field .k { color: var(--text-mute); }
    .side-card .field .v { color: var(--text); }
    .traits { display: flex; flex-wrap: wrap; gap: 6px; }
    .trait { padding: 3px 10px; border-radius: 12px; background: rgba(59,130,246,0.12); color: var(--blue); font-size: 0.75rem; }
    .mode-tag { padding: 3px 10px; border-radius: 12px; background: rgba(245,158,11,0.12); color: var(--yellow); font-size: 0.75rem; display: inline-block; margin: 2px; }

    .loading, .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 0.9rem; }

    /* ===== detailed_stats ===== */
    .ds-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 8px; margin: 8px 0; }
    .ds-cell { display: flex; flex-direction: column; padding: 6px 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; }
    .ds-k { font-size: 12px; color: var(--text-mute); margin-bottom: 2px; }
    .ds-v { font-size: 13px; color: var(--text); font-family: 'Consolas','Menlo',monospace; }
    .ds-attack { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .ds-attack:last-child { margin-bottom: 0; }
    .ds-attack-head { font-size: 14px; color: var(--text); font-weight: 600; margin-bottom: 8px; }
    .ds-status { border-left: 3px solid var(--amber); }
    .ds-type { font-size: 11px; padding: 1px 8px; border-radius: 8px; margin-left: 6px; background: rgba(255,255,255,0.08); color: var(--text-dim); }
    .ds-type-proj { background: rgba(59,130,246,0.2); color: var(--blue); }
    .ds-type-exp { background: rgba(239,68,68,0.2); color: var(--red); }
    .ds-type-fire { background: rgba(245,158,11,0.2); color: var(--amber); }
    .ds-type-spray { background: rgba(16,185,129,0.2); color: #10b981; }
    .ds-type-beam { background: rgba(139,92,246,0.2); color: #8b5cf6; }
    .ds-type-arc { background: rgba(139,92,246,0.2); color: #a78bfa; }
    .ds-type-dmg { background: rgba(239,68,68,0.2); color: var(--red); }
    .ds-type-melee { background: rgba(239,68,68,0.2); color: var(--red); }
    @media (max-width: 1023px) { .ds-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 767px) { .ds-grid { grid-template-columns: repeat(2, 1fr); } }

    .wiki-footer { text-align: center; padding: 20px; border-top: 1px solid var(--border); color: var(--text-mute); font-size: 0.78rem; }

    @media (max-width: 900px) {
      .detail-layout { grid-template-columns: 1fr; }
      .info-side { order: 2; }
    }
  
h1, h2, h3, h4, .wiki-header h1, .wiki-header .title, .nav-item, .cat-tag, .faction-tag, .m-name, .name, .title-block .name, .card h1, .card h2, .toc-item, .breadcrumb a, .calc-container h3, .calc-results h4, .result-item.highlight .result-value {
  font-family: "ChuangKeTi","SourceHanSans","Microsoft YaHei",sans-serif;
}

</style>
</head>
<body>
  <header class="wiki-header">
    <div class="breadcrumb" id="breadcrumb">← <a href="weapons.html">武器列表</a></div>
  </header>

  <div class="detail-layout" id="detail-layout">
    <div class="loading">正在加载武器数据…</div>
  </div>

  <footer class="wiki-footer">
    <p>绝地潜兵2 中文维基 · 社区驱动 · 数据仅供参考</p>
  </footer>

  <script>
    "use strict";
    async function loadDetail() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      var layout = document.getElementById("detail-layout");
      try {
        var r = await fetch("./data/wiki/zh/weapons.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        var d = await r.json();
        var w = (d.weapons || []).find(function(x) { return x.id === id; });
        if (!w) { layout.innerHTML = '<div class="empty">未找到该武器</div>'; return; }
        renderDetail(w);
      } catch(e) {
        console.error("[Weapon] 加载失败:", e);
        layout.innerHTML = '<div class="empty">⚠️ 武器数据加载失败</div>';
      }
    }

    function renderDetail(w) {
      var layout = document.getElementById("detail-layout");
      var catNames = { primary: "主武器", secondary: "副武器", throwables: "投掷物" };
      var penNames = { light: "轻甲穿透", medium: "中甲穿透", heavy: "重甲穿透" };

      document.getElementById("breadcrumb").innerHTML =
        '← <a href="weapons.html">武器列表</a> › ' + esc(catNames[w.category] || w.category) + ' › ' + esc(w.subcategory_name || "") + ' › ' + esc(w.name);

      var sf = w.stats_full || {};
      var fireModes = (sf.fire_modes || []).map(function(m) { return '<span class="mode-tag">' + esc(m) + '</span>'; }).join("") || "—";
      var traits = (w.traits || []).map(function(t) { return '<span class="trait">' + esc(t) + '</span>'; }).join("") || "—";
      var variants = (w.variants || []).map(function(v) {
        return '<a class="variant-card" href="weapon.html?id=' + encodeURIComponent(v.id) + '">' +
          '<div class="v-name">' + esc(v.name) + (v.id === w.id ? '' : ' →') + '</div>' +
          '<div class="v-desc">' + esc(v.description || "") + '</div>' +
          '<div class="v-unlock">🔓 ' + esc(v.unlock || "") + '</div></a>';
      }).join("") || '<div class="empty" style="padding:12px;">暂无变体</div>';
      var tips = (w.tips || []).map(function(t, i) { return '<li>' + esc(t) + '</li>'; }).join("") || '<li>暂无使用策略</li>';

      layout.innerHTML =
        '<div class="main-content">' +
          '<div class="card title-block">' +
            '<div class="detail-icon">' + (w.icon ? '<img src="' + esc(w.icon) + '" alt="' + esc(w.name_en) + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<span class=ph>🎯</span>\'">' : '<span class="ph">🎯</span>') + '</div>' +
            '<div class="name">' + esc(w.name) + '</div>' +
            '<div class="name-en">' + esc(w.name_en) + '</div>' +
            '<div class="unlock">⭐ ' + esc(w.unlock || "") + '</div>' +
            '<div class="desc">' + esc(w.description || "") + '</div>' +
            (w.lore ? '<div class="lore">' + esc(w.lore) + '</div>' : '') +
          '</div>' +
          renderDetailedStats(w) +
          '<div class="card">' +
            '<h2>🔄 变体版本</h2>' + variants +
          '</div>' +
          '<div class="card">' +
            '<h2>💡 使用策略</h2>' +
            '<ol class="tips-list">' + tips + '</ol>' +
          '</div>' +
        '</div>' +
        '<div class="info-side">' +
          '<div class="side-card">' +
            '<h3>📦 武器信息</h3>' +
            field("类型", catNames[w.category] || w.category) +
            field("分类", w.subcategory_name) +
            field("伤害", sf.damage) +
            field("弹匣", sf.capacity) +
            field("射速", sf.fire_rate ? sf.fire_rate + " RPM" : "—") +
            field("后坐力", sf.recoil) +
            field("穿透", penNames[sf.penetration]) +
            field("变体", (w.variants || []).length + " 种") +
          '</div>' +
          '<div class="side-card">' +
            '<h3>🏷️ 特性</h3><div class="traits">' + traits + '</div>' +
          '</div>' +
        '</div>';
    }

    // ============ detailed_stats 渲染（分组表格/卡片） ============
    var DS_LABELS = {
      mass: "弹体质量", initial_velocity: "初速度", drag_factor: "阻力系数", gravity_factor: "重力系数",
      penetration_slowdown: "穿透减速", explosion_on_impact: "命中引爆", explode_after: "延时引爆",
      radius_inner: "内圈半径", radius_outer: "外圈半径", radius_shockwave: "冲击波半径",
      inner_durable: "内圈耐久伤害", outer_durable: "外圈耐久伤害",
      damage_standard: "标准伤害", damage_durable: "耐久伤害", damage_element: "伤害类型",
      pen_direct: "直射穿透", pen_slight_angle: "小角度穿透", pen_large_angle: "大角度穿透", pen_extreme_angle: "极端穿透", pen_aoe: "范围穿透",
      demolition_force: "拆毁值", stagger_force: "踉跄力", push_force: "推力",
      fire_rate: "射速", recoil: "后坐力", recoil_horizontal: "水平后坐力", recoil_vertical: "垂直后坐力",
      spread: "散布", sway: "晃动", ergonomics: "人体工学", capacity: "弹匣容量",
      spare_magazines: "备用弹匣", starting_magazines: "初始弹匣", mags_from_supply: "补给弹匣", mags_from_ammo_box: "弹药箱弹匣",
      cooldown: "冷却时间", uses: "使用次数", bombs: "炸弹数量", salvos: "齐射次数", bombardment_area: "炮击区域范围",
      status_strength: "状态强度", status_duration: "状态持续时间", status: "状态效果", effect_type: "状态类型",
    };
    // 值翻译（长词优先）
    var DS_VALUE_MAP = [
      ["Requisition Slips", "申购点"], ["Anti-Tank", "反坦克"],
      ["Ballistic", "实弹伤害"], ["Explosion", "爆炸伤害"], ["Arc", "电弧伤害"], ["Gas", "毒气伤害"], ["Acid", "酸液伤害"],
      ["Medals", "勋章"], ["Unarmored", "无护甲"],
      ["Light", "轻甲"], ["Medium", "中甲"], ["Heavy", "重甲"],
      ["EMS", "电磁伤害"], ["None", "无"], ["Fire", "火焰伤害"]
    ];
    function dsTranslate(s) {
      var out = String(s);
      DS_VALUE_MAP.forEach(function(pair) { out = out.split(pair[0]).join(pair[1]); });
      return out;
    }
    function dsVal(v) {
      if (v == null) return "";
      if (typeof v === "object") {
        if (v.min != null && v.max != null) return v.min + "-" + v.max;
        return JSON.stringify(v);
      }
      var s = String(v);
      if (s === "") return "";
      if (s === "∞") return "∞";
      return dsTranslate(s);
    }
    // 分组网格（属性名+属性值成对，4列）
    function dsGrid(obj, label) {
      if (!obj) return "";
      var keys = Object.keys(obj);
      if (!keys.length) return "";
      var cells = keys.map(function(k) {
        var v = dsVal(obj[k]);
        if (v === "") return "";
        var lbl = DS_LABELS[k] || k;
        return '<div class="ds-cell"><span class="ds-k">' + esc(lbl) + '</span><span class="ds-v">' + esc(v) + '</span></div>';
      }).filter(Boolean);
      if (!cells.length) return "";
      return '<div class="ds-grid">' + cells.join("") + '</div>';
    }
    function renderDetailedStats(w) {
      var ds = w.detailed_stats;
      if (!ds) return "";
      // 顶层基础参数（非 attacks/status_effects 部分）
      var topKeys = Object.keys(ds).filter(function(k) { return k !== "attacks" && k !== "status_effects"; });
      var topObj = {};
      topKeys.forEach(function(k) { topObj[k] = ds[k]; });
      var topHtml = dsGrid(topObj);
      // 攻击条目
      var attacksHtml = "";
      var attacks = ds.attacks || [];
      if (attacks.length) {
        attacksHtml = attacks.map(function(a, i) {
          var typeTag = a.type === "projectile" ? '<span class="ds-type ds-type-proj">弹丸</span>' :
                         a.type === "explosion" ? '<span class="ds-type ds-type-exp">爆炸</span>' :
                         a.type === "fire" ? '<span class="ds-type ds-type-fire">火焰</span>' :
                         a.type === "spray" ? '<span class="ds-type ds-type-spray">喷射</span>' :
                         a.type === "beam" ? '<span class="ds-type ds-type-beam">光束</span>' :
                         a.type === "arc" ? '<span class="ds-type ds-type-arc">电弧</span>' :
                         a.type === "damage" ? '<span class="ds-type ds-type-dmg">伤害</span>' :
                         a.type === "melee" ? '<span class="ds-type ds-type-melee">近战</span>' :
                         '<span class="ds-type">' + esc(a.type) + '</span>';
          return '<div class="ds-attack">' +
            '<div class="ds-attack-head">⚔️ 攻击 #' + (i+1) + ': ' + esc(a.name || "") + ' ' + typeTag + '</div>' +
            dsGrid(a.projectile) +
            dsGrid(a.area_of_effect) +
            dsGrid(a.damage) +
            dsGrid(a.penetration) +
            dsGrid(a.special_effects) +
            '</div>';
        }).join("");
      }
      // 独立状态效果区块
      var statusHtml = "";
      var se = ds.status_effects;
      if (se && Object.keys(se).length) {
        var stRaw = se.effect_type || se.status || "状态";
        var stName = stRaw.toLowerCase() === "fire" ? "火焰" :
                     stRaw.toLowerCase() === "gas" ? "毒气" :
                     stRaw.toLowerCase() === "ems" ? "电磁" :
                     stRaw.toLowerCase() === "smoke" ? "烟雾" :
                     stRaw.toLowerCase() === "acid" ? "酸液" : String(stRaw);
        var stIcon = stRaw.toLowerCase() === "fire" ? "🔥" :
                     stRaw.toLowerCase() === "gas" ? "☠️" :
                     stRaw.toLowerCase() === "ems" ? "⚡" :
                     stRaw.toLowerCase() === "smoke" ? "💨" :
                     stRaw.toLowerCase() === "acid" ? "🧪" : "🔥";
        var seHtml = "";
        // 顶层标量字段
        var seTop = {};
        Object.keys(se).forEach(function(k) {
          if (k === "effect_type" || k === "status") return;
          if (typeof se[k] === "object") { seHtml += dsGrid(se[k]); return; }
          seTop[k] = se[k];
        });
        seHtml = dsGrid(seTop) + seHtml;
        statusHtml = '<div class="ds-attack ds-status">' +
          '<div class="ds-attack-head">' + stIcon + ' 状态效果 (Status: ' + esc(stName) + ')</div>' +
          seHtml +
          '</div>';
      }
      return '<div class="card">' +
        '<h2>⚙️ 详细数据</h2>' +
        (topHtml ? topHtml : "") +
        attacksHtml +
        statusHtml +
        '</div>';
    }

    function field(k, v) { return '<div class="field"><span class="k">' + esc(k) + '</span><span class="v">' + (v == null ? "—" : v) + '</span></div>'; }
    function statRow(k, v) { return v == null ? "" : '<tr><td>' + esc(k) + '</td><td>' + (typeof v === "string" ? v : esc(v)) + '</td></tr>'; }
    function esc(s) { return String(s || "").replace(/[&<>"']/g, function(c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }

    document.addEventListener("DOMContentLoaded", loadDetail);
  </script>
</body>
</html>
