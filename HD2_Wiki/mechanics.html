<body>
  <header class="wiki-header">
    <h1>📚 游戏机制</h1>

  </header>
  <div class="wiki-toolbar">
    <label class="wt-search"><input type="text" id="search-input" placeholder="🔍 搜索机制名称或描述…" oninput="applyFilter()"></label>
    <span class="wt-count" id="result-count"></span>
  </div>
  <div class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <footer class="wiki-footer"><p>绝地潜兵2 中文维基 · 社区驱动 · 数据仅供参考</p></footer>
  <script>
    "use strict";
    var mechPages = [];
    async function load() {
      try {
        var r = await fetch("./data/wiki/zh/mechanics/index.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        var d = await r.json();
        mechPages = d.pages || [];
        applyFilter();
      } catch(e) {
        console.error("[Mechanics] 加载失败:", e);
        document.getElementById("grid").innerHTML = '<div class="loading">⚠️ 数据加载失败</div>';
      }
    }
    function applyFilter() {
      var q = (document.getElementById("search-input").value || "").trim().toLowerCase();
      var list = mechPages;
      if (q) list = list.filter(function(p) { return (p.title + " " + (p.title_en || "") + " " + (p.description || "")).toLowerCase().indexOf(q) >= 0; });
      var rc = document.getElementById("result-count"); if (rc) rc.textContent = list.length + " / " + mechPages.length;
      document.getElementById("grid").innerHTML = list.length ? list.map(function(p) {
        return '<a class="card" href="mechanic.html?id=' + encodeURIComponent(p.id) + '">' +
          '<div class="icon">' + esc(p.icon) + '</div>' +
          '<div class="name">' + esc(p.title) + '</div>' +
          '<div class="name-en">' + esc(p.title_en) + '</div>' +
          '<div class="desc">' + esc(p.description) + '</div>' +
          '</a>';
      }).join("") : '<div class="empty">没有匹配的机制</div>';
    }
    function esc(s) { return String(s || "").replace(/[&<>"']/g, function(c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
    document.addEventListener("DOMContentLoaded", load);
  </script>
