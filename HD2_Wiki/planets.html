  <style>
    .wiki-header .sub { color: var(--text-dim); font-size: 0.86rem; margin-top: 6px; line-height: 1.8; }
    .wiki-header .sub b { color: var(--text); font-variant-numeric: tabular-nums; }

    /* 星区分组标题 */

    /* 深链落点高亮（?s=<星区>，2026-09-26）：给一小段黄色底把"就是这一块"点出来 */

    td.lib.mid { color: var(--yellow); }
    .pl-act a { color: var(--blue); text-decoration: none; white-space: nowrap; margin-right: 8px; font-size: 0.76rem; }

<body>
  <header class="wiki-header">
    <h1>🪐 星球索引</h1>
    <p class="sub">共 <b id="stat-planets">—</b> 颗星球 · <b id="stat-sectors">—</b> 个星区 ·
      在线玩家 <b id="stat-players">—</b> · 数据抓取于 <b id="stat-time">—</b></p>
    <div class="hd-links">
      <a class="back" href="wiki.html">◀ 返回维基首页</a>

    </div>
  </header>

  <div class="wiki-toolbar">
    <div class="filter-bar" id="faction-filter" role="group" aria-label="按归属阵营筛选"></div>
    <span class="wt-divider"></span>
    <div class="filter-bar" id="sort-filter" role="group" aria-label="排序方式"></div>
    <span class="wt-divider"></span>
    <label class="wt-search"><input type="text" id="q" placeholder="🔍 搜索星球 / 星区（中英皆可）" autocomplete="off"></label>
    <span class="wt-count" id="count"></span>
  </div>

  <main id="list">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </main>

  <footer class="wiki-footer">
    <p>绝地潜兵2 中文维基 · 星球索引 · 数据来自官方战况 API（每 5 分钟自动更新）</p>
    <p style="font-size:.74rem;color:var(--text-mute)">
      解放度口径：己方（超级地球）持有的星球一律显示 100%（官方 API 对己方星球报满血）；
      其余按 <code>1 − health / maxHealth</code>。「区域」为该星球下属城市 / 超大型工厂数量（覆盖 84 颗星球）。
    </p>
  </footer>

  <script>
  "use strict";
  /* ============================================================================
     星球索引（2026-09-25 新增，挂在维基下）
     目的：① 给"所有星球"一个可浏览、可搜索、可被搜索引擎收录的目录页；
           ② 把 270+ 颗星球的资料页（../HD2-Galatic_war-Map/planet.html?idx=N）接进内链，
              让爬虫从维基这边就能发现它们（原来只有星图里点得到）。
     数据：全部复用主站同一份文件，不新增任何抓取管线：
       data.json（战况 + 玩家分布）· tables/starmap.json（星区/译名）· tables/planet_regions.json（区域数）
     ============================================================================ */

  var DATA = null, PL = [], SECTORS = [], REG = {}, PL_SEC = {}, SEC_EN = {};
  var OWN_COLOR = { Humans: "#5BA3D0", Terminids: "#F5C518", Automaton: "#D6806D", Illuminate: "#CF64F8" };
  var OWN_CN = { Humans: "超级地球", Terminids: "终结族", Automaton: "机器人", Illuminate: "光能者" };
  var curFaction = "all", curSort = "players";
  /* 星区深链（2026-09-26 新增）：主页「星区目录」每个星区头给出 ../HD2_Wiki/planets.html?s=<星区中文名>。
     为什么要它：主页那个板块是折叠头 + 卡片，压根没有逐星球的可浏览列表；而本页是"某星区有哪些星球"
     的完整表格。落地时滚到该星区并高亮，跳转才不像是"到了另一个无关页面"。
     ⚠ 不要把 curSort 改成 "sector"（首版就这么写的，实测踩到）：`render()` 里 `curSort === "sector"`
     走的是**扁平表**分支（按星区名排序、不分组、也没有 .sec-hd 元素）→ 既没有分组标题可滚，
     又把本页默认的「按星区分组」视图换掉了。深链只负责**定位**，视图仍由用户的排序选择决定。
     注意：s 的值是**中文星区名**，必须与 render() 里 groups 的键一致（找不到就静默不滚）。 */
  var FOCUS_SEC = (function () {
    try { return (new URLSearchParams(location.search).get("s") || "").trim(); }
    catch (e) { return ""; }
  })();

  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var fmt = function (n) { return (n == null ? "—" : Number(n).toLocaleString("en-US")); };

  function libShow(p) {
    if (String(p.currentOwner || "").toLowerCase() === "humans") return 100;
    return p.maxHealth > 0 ? Math.max(0, Math.min(100, 100 * (1 - p.health / p.maxHealth))) : null;
  }

  async function boot() {
    try {
      var base = "../HD2-Galatic_war-Map/";
      var rs = await Promise.all([
        fetch(base + "data.json?t=" + Date.now(), { cache: "no-store" }),
        fetch(base + "tables/starmap.json", { cache: "no-store" }),
        fetch(base + "tables/planet_regions.json?v=20260925b", { cache: "no-store" })
      ]);
      if (!rs[0].ok) throw new Error("HTTP " + rs[0].status + " data.json");
      DATA = await rs[0].json();
      var sm = rs[1].ok ? await rs[1].json() : { systems: [] };
      REG = rs[2].ok ? ((await rs[2].json()).planets || {}) : {};

      // 星区顺序 + 译名 + 星球→星区 映射（官方 API 的 sector 字段大量为空，必须回退 starmap）
      (sm.systems || []).forEach(function (s) {
        if (!s.name) return;
        SECTORS.push({ cn: s.name, en: s.name_en || "", planets: [] });
        (s.planets || []).forEach(function (p) {
          if (!p.en) return;
          PL_SEC[String(p.en).toUpperCase()] = s.name;
          if (p.cn) SEC_EN[String(p.en).toUpperCase()] = p.cn;
        });
      });

      var total = (DATA.player_distribution && DATA.player_distribution.total) || 0;
      PL = (DATA.planets || []).map(function (p) {
        var sec = PL_SEC[String(p.name || "").toUpperCase()] || p.sector || "未归档星区";
        return {
          index: p.index, en: p.name || "", cn: SEC_EN[String(p.name || "").toUpperCase()] || "",
          sector: sec, owner: p.currentOwner || "", players: p.players || 0,
          lib: libShow(p), regions: (REG[String(p.index)] && REG[String(p.index)].regions || []).length,
          share: total > 0 ? (p.players || 0) / total * 100 : 0,
          attacking: !!p.attacking
        };
      });

      document.getElementById("stat-planets").textContent = fmt(PL.length);
      document.getElementById("stat-sectors").textContent = fmt(
        (SECTORS.length ? SECTORS.length : new Set(PL.map(function (x) { return x.sector; })).size));
      document.getElementById("stat-players").textContent = fmt(total);
      document.getElementById("stat-time").textContent = DATA.fetchedAt
        ? new Date(DATA.fetchedAt).toLocaleString("zh-CN", { hour12: false }) : "—";

      renderFilters();
      render();
    } catch (e) {
      document.getElementById("list").innerHTML =
        '<div class="empty">⚠️ 战况数据加载失败：' + esc(e.message) + '<br>数据由 CI 每 5 分钟生成，稍后重试即可。</div>';
    }
  }

  function renderFilters() {
    var order = ["all", "Humans", "Terminids", "Automaton", "Illuminate"];
    document.getElementById("faction-filter").innerHTML = order.map(function (k) {
      var n = k === "all" ? PL.length : PL.filter(function (p) { return p.owner === k; }).length;
      var label = k === "all" ? "全部" : (OWN_CN[k] || k);
      var dot = k === "all" ? "" : '<i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' +
        OWN_COLOR[k] + ';margin-right:5px"></i>';
      return '<button type="button" data-f="' + k + '" class="' + (k === curFaction ? "active" : "") + '">' +
        dot + label + '<span class="c">' + n + '</span></button>';
    }).join("");
    var sorts = [["players", "在线玩家"], ["lib", "解放度"], ["sector", "按星区"], ["index", "星球序号"]];
    document.getElementById("sort-filter").innerHTML = sorts.map(function (s) {
      return '<button type="button" data-s="' + s[0] + '" class="' + (s[0] === curSort ? "active" : "") + '">' +
        s[1] + "</button>";
    }).join("");
    document.getElementById("faction-filter").querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () { curFaction = b.getAttribute("data-f"); renderFilters(); render(); });
    });
    document.getElementById("sort-filter").querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () { curSort = b.getAttribute("data-s"); renderFilters(); render(); });
    });
    var q = document.getElementById("q");
    if (!q.__bound) { q.__bound = true; q.addEventListener("input", render); }
  }

  function filtered() {
    var kw = (document.getElementById("q").value || "").trim().toUpperCase();
    return PL.filter(function (p) {
      if (curFaction !== "all" && p.owner !== curFaction) return false;
      if (!kw) return true;
      return (p.cn + " " + p.en + " " + p.sector).toUpperCase().indexOf(kw) >= 0;
    });
  }

  function rowHtml(p) {
    var libTxt = p.lib == null ? "—" : p.lib.toFixed(2) + "%";
    var libCls = p.lib == null ? "" : (p.lib >= 99.995 ? "ok" : (String(p.owner).toLowerCase() === "humans" ? "ok" : (p.lib >= 50 ? "mid" : "")));
    return '<tr>' +
      '<td class="pl-name"><a href="../HD2-Galatic_war-Map/planet.html?idx=' + p.index + '">' +
        esc(p.cn || p.en || ("#" + p.index)) + "</a>" +
        (p.cn && p.en ? '<span class="en">' + esc(p.en) + "</span>" : "") +
        (p.attacking ? ' <span style="color:#FF4D2E;font-size:.7rem">⚠ 遭受进攻</span>' : "") + "</td>" +
      '<td><span class="own"><i style="background:' + (OWN_COLOR[p.owner] || "#64748b") + '"></i>' +
        esc(OWN_CN[p.owner] || p.owner || "未知") + "</span></td>" +
      '<td class="lib ' + libCls + '" style="text-align:right;font-variant-numeric:tabular-nums">' + libTxt + "</td>" +
      '<td style="text-align:right;font-variant-numeric:tabular-nums">' + fmt(p.players) +
        (p.share ? ' <span style="color:var(--text-mute);font-size:.72rem">' + p.share.toFixed(1) + "%</span>" : "") + "</td>" +
      '<td style="text-align:right;font-variant-numeric:tabular-nums">' + (p.regions || "—") + "</td>" +
      '<td class="pl-act">' +
        '<a href="../HD2-Galatic_war-Map/planet.html?idx=' + p.index + '">📄 资料</a>' +
        '<a href="../HD2-Galatic_war-Map/galaxy-map-v2.html?planet=' + p.index + '">🗺️ 星图</a>' +
      "</td></tr>";
  }

  var HEAD = '<div class="table-wrap"><table class="stats-table">' +
    "<thead><tr><th>星球</th><th>归属</th><th style=\"text-align:right\">解放度</th>" +
    "<th style=\"text-align:right\">在线玩家</th><th style=\"text-align:right\">区域</th><th>操作</th></tr></thead><tbody>";

  function cmp(a, b) {
    if (curSort === "lib") return (b.lib || 0) - (a.lib || 0);
    if (curSort === "index") return a.index - b.index;
    if (curSort === "sector") return a.sector.localeCompare(b.sector, "zh") || a.index - b.index;
    return b.players - a.players;
  }

  function render() {
    var list = filtered(), host = document.getElementById("list");
    document.getElementById("count").textContent = list.length + " / " + PL.length + " 颗";
    if (!list.length) { host.innerHTML = '<div class="empty">没有匹配的星球</div>'; return; }

    if (curSort === "sector") {                       // 扁平表，按星区名排序时不再分组
      host.innerHTML = HEAD + list.slice().sort(cmp).map(rowHtml).join("") + "</tbody></table></div>";
      return;
    }
    // 按星区分组（星区顺序跟随 starmap，未知星区排在最后）
    var groups = {}, order = [];
    SECTORS.forEach(function (s) { groups[s.cn] = { cn: s.cn, en: s.en, items: [] }; order.push(s.cn); });
    list.forEach(function (p) {
      if (!groups[p.sector]) { groups[p.sector] = { cn: p.sector, en: "", items: [] }; order.push(p.sector); }
      groups[p.sector].items.push(p);
    });
    var html = "";
    order.forEach(function (key) {
      var g = groups[key];
      if (!g || !g.items.length) return;
      var players = g.items.reduce(function (a, b) { return a + b.players; }, 0);
      html += '<h2 class="sec-hd" data-sec="' + esc(key) + '">' +
        esc(g.cn) + (g.en ? ' <span class="en">' + esc(g.en) + "</span>" : "") +
        '<span class="n">' + g.items.length + " 颗 · 在线 " + fmt(players) + "</span></h2>" +
        HEAD + g.items.slice().sort(cmp).map(rowHtml).join("") + "</tbody></table></div>";
    });
    host.innerHTML = html;
    focusSector();
  }

  /* 滚动到 ?s= 指定的星区并高亮一下（找不到就静默跳过，不影响正常浏览）。
     ⚠ 不要用 querySelector('.sec-hd[data-sec="' + FOCUS_SEC + '"]')：星区名会先经 esc() 写进
     HTML（中文本身没问题，但星区名里若有引号就会把选择器拼坏），而且属性值要再走一次 CSS 转义。
     首版就是这么写的，实测**页面首次加载时匹配不到**（手动复跑才滚），改成逐个读 data-sec 比对。
     ⚠ 更关键的一条：**不要用 requestAnimationFrame 来"等布局"**（2026-09-26 实测踩到）。
     第二版用 rAF 双跳，在**隐藏/后台标签页**（rAF 被节流甚至完全挂起，本项目的共享浏览器窗口就是
     这种状态）里回调根本不执行 → 既不滚、也不加高亮，而且因为 done 已置位，之后永远不补。
     改用定时器 + 事件兜底：定时器在后台仍会跑，可见性恢复时再补一次。 */
  function focusSector() {
    if (!FOCUS_SEC || focusSector.done) return;
    var list = document.querySelectorAll(".sec-hd[data-sec]"), el = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].getAttribute("data-sec") === FOCUS_SEC) { el = list[i]; break; }
    }
    if (!el) return;

    var tries = 0, fired = false;
    var run = function () {
      if (fired) return;
      if (el.getBoundingClientRect().height <= 0 && tries++ < 6) { window.setTimeout(run, 150); return; }
      fired = true;
      focusSector.done = true;
      el.scrollIntoView({ block: "start" });
      el.classList.add("focus-hl");
      window.setTimeout(function () { el.classList.remove("focus-hl"); }, 2200);
    };
    // 首跑稍等一拍让表格布局完成；定时器不受 rAF 节流影响
    window.setTimeout(run, 120);
    // 兜底：落地时标签页在后台（当时不做滚动才自然），切回可见时再补一次
    document.addEventListener("visibilitychange", function onVis() {
      if (document.visibilityState !== "visible" || fired) return;
      document.removeEventListener("visibilitychange", onVis);
      window.setTimeout(run, 60);
    });
  }

  boot();
  </script>
</body>
