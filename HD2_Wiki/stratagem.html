<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>战略配备详情 - 绝地潜兵2 中文维基</title>
  <meta name="description" content="绝地潜兵2 战略配备详情页" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #0a0e1a; --bg-mid: #141b33; --bg-card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.08); --text: #e2e8f0; --text-dim: #94a3b8;
      --text-mute: #64748b; --yellow: #f5c518; --blue: #3b82f6; --radius: 12px;
      --red: #ef4444; --green: #22c55e; --amber: #f59e0b;
    }
    @font-face { font-family: 'ZZZ-thick'; src: url('./ZZZ-thick.ttf') format('truetype'); }
    html, body { height: 100%; font-family: "ZZZ-thick","Microsoft YaHei","PingFang SC",sans-serif; background: var(--bg-deep); color: var(--text); }
    body { display: flex; flex-direction: column; }

    .wiki-header { padding: 24px 20px 16px; background: linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%); border-bottom: 1px solid var(--border); }
    .breadcrumb { max-width: 1100px; margin: 0 auto; font-size: 0.8rem; color: var(--text-mute); }
    .breadcrumb a { color: var(--blue); text-decoration: none; }
    .breadcrumb a:hover { color: var(--yellow); }

    .detail-layout { flex: 1; max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 70% 30%; gap: 20px; width: 100%; }

    .main-content { display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .card h2 { font-size: 1rem; color: var(--text); margin-bottom: 10px; }

    .title-block { position: relative; overflow: hidden; }
    .title-block .color-bar { position: absolute; left: 0; top: 0; width: 6px; height: 100%; }
    .title-block .name { font-size: 1.8rem; color: var(--text); }
    .title-block .name-en { font-size: 1rem; color: var(--text-mute); margin: 2px 0 8px; }
    .title-block .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 8px; }
    .title-block .desc { font-size: 0.88rem; color: var(--text-dim); line-height: 1.7; }

    .code-display { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
    .code-display .arrow svg { display: block; }
    .arrow-icon { width: 20px; height: 20px; display: inline-block; vertical-align: middle; }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-item { display: flex; justify-content: space-between; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.82rem; }
    .stat-item .k { color: var(--text-mute); }
    .stat-item .v { color: var(--text); }

    .tag { padding: 2px 10px; border-radius: 10px; font-size: 12px; }
    .tag-orbital, .tag-eagle { background: rgba(239,68,68,0.2); color: var(--red); }
    .tag-support, .tag-backpack { background: rgba(59,130,246,0.2); color: var(--blue); }
    .tag-deployable { background: rgba(34,197,94,0.2); color: var(--green); }
    .tag-vehicle, .tag-ship { background: rgba(245,158,11,0.2); color: var(--amber); }

    .info-side { display: flex; flex-direction: column; gap: 16px; }
    .side-card { background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .side-card h3 { font-size: 0.9rem; color: var(--text); margin-bottom: 12px; }
    .side-card .field { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; }
    .side-card .field:last-child { border-bottom: none; }
    .side-card .field .k { color: var(--text-mute); }
    .side-card .field .v { color: var(--text); }
    .traits { display: flex; flex-wrap: wrap; gap: 6px; }
    .trait { padding: 3px 10px; border-radius: 12px; background: rgba(59,130,246,0.12); color: var(--blue); font-size: 0.75rem; }
    .img-wrap { margin-top: 8px; }
    .img-wrap img { max-width: 100%; border-radius: 8px; }

    .loading, .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 0.9rem; }

    /* ===== detailed_stats ===== */
    .ds-block { }
    .ds-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .ds-tag { background: rgba(255,255,255,0.06); color: var(--text-dim); font-size: 12px; padding: 3px 10px; border-radius: 10px; }
    .ds-attack { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .ds-attack:last-child { margin-bottom: 0; }
    .ds-attack-head { font-size: 14px; color: var(--text); margin-bottom: 8px; }
    .ds-type { font-size: 11px; padding: 1px 8px; border-radius: 8px; margin-left: 6px; background: rgba(255,255,255,0.08); color: var(--text-dim); }
    .ds-type-proj { background: rgba(59,130,246,0.2); color: var(--blue); }
    .ds-type-exp { background: rgba(239,68,68,0.2); color: var(--red); }
    .ds-group { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .ds-group:last-child { border-bottom: none; }
    .ds-group-label { font-size: 12px; color: var(--text-mute); flex-shrink: 0; min-width: 52px; }
    .ds-items { display: flex; flex-wrap: wrap; gap: 6px 14px; }
    .ds-item { font-size: 13px; color: var(--text-dim); }
    .ds-k { color: var(--text-mute); margin-right: 3px; }
    .ds-v { color: var(--text); }

    .wiki-footer { text-align: center; padding: 20px; border-top: 1px solid var(--border); color: var(--text-mute); font-size: 0.78rem; }

    @media (max-width: 900px) { .detail-layout { grid-template-columns: 1fr; } .info-side { order: 2; } }
  </style>
</head>
<body>
  <header class="wiki-header">
    <div class="breadcrumb" id="breadcrumb">← <a href="stratagems.html">战略配备列表</a></div>
  </header>

  <div class="detail-layout" id="detail-layout"><div class="loading">正在加载战略配备数据…</div></div>

  <footer class="wiki-footer"><p>绝地潜兵2 中文维基 · 社区驱动 · 数据仅供参考</p></footer>

  <script>
    "use strict";
    var ARROW = {
      "U": '<img src="assets/arrows/up.svg" alt="↑" class="arrow-icon">',
      "D": '<img src="assets/arrows/down.svg" alt="↓" class="arrow-icon">',
      "L": '<img src="assets/arrows/left.svg" alt="←" class="arrow-icon">',
      "R": '<img src="assets/arrows/right.svg" alt="→" class="arrow-icon">'
    };

    function renderCode(arrows) {
      if (!arrows) return '<span style="color:var(--text-mute)">无呼叫代码</span>';
      return '<span class="code-display">' + arrows.split("").map(function(a) { return '<span class="arrow">' + (ARROW[a] || "") + '</span>'; }).join("") + '</span>';
    }
    function colorOf(cat) { var m = { "轨道":"#ef4444","飞鹰":"#ef4444","支援武器":"#3b82f6","背包":"#3b82f6","可部署物":"#22c55e","载具":"#f59e0b","重型支援武器":"#3b82f6" }; return m[cat] || "#64748b"; }
    function tagOf(cat) { var m = { "轨道":"orbital","飞鹰":"eagle","支援武器":"support","背包":"backpack","可部署物":"deployable","载具":"vehicle","重型支援武器":"support" }; return "tag-" + (m[cat] || "support"); }
    function iconOf(cat) { var m = { "轨道":"🚀","飞鹰":"🦅","支援武器":"🔫","背包":"🎒","可部署物":"🏗️","载具":"🚗","重型支援武器":"🔫" }; return m[cat] || "📦"; }

    async function loadDetail() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      var layout = document.getElementById("detail-layout");
      try {
        var r = await fetch("./data/wiki/zh/stratagems_full.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        var d = await r.json();
        var s = (d.stratagems || []).find(function(x) { return x.id === id; });
        if (!s) { layout.innerHTML = '<div class="empty">未找到该战略配备</div>'; return; }
        renderDetail(s);
      } catch(e) {
        console.error("[Strat] 加载失败:", e);
        layout.innerHTML = '<div class="empty">⚠️ 战略配备数据加载失败</div>';
      }
    }

    function renderDetail(s) {
      var layout = document.getElementById("detail-layout");
      var cat = s.category;
      var catLabel = s.category_label || cat;
      document.getElementById("breadcrumb").innerHTML =
        '← <a href="stratagems.html">战略配备列表</a> › ' + esc(catLabel) + ' › ' + esc(s.name);

      var code = typeof s.code === "string" ? s.code : "";
      var sf = s.stats || [];
      var statItems = [
        ["伤害", sf[0], "⚔️"], ["射速", sf[1], "🎯"], ["实用性", sf[2], "🛠️"], ["机动性", sf[3], "🏃"]
      ];

      layout.innerHTML =
        '<div class="main-content">' +
          '<div class="card title-block">' +
            '<div class="color-bar" style="background:' + colorOf(catLabel) + '"></div>' +
            '<div class="name">' + esc(s.name) + '</div>' +
            '<div class="name-en">' + esc(s.name_en || s.id) + '</div>' +
            '<div class="meta"><span class="tag ' + tagOf(catLabel) + '">' + esc(catLabel) + '</span>' +
              (s.source ? '<span>📦 ' + esc(s.source) + '</span>' : '') + '</div>' +
            '<div class="meta">呼叫代码：' + renderCode(code) + '</div>' +
            (s.description ? '<div class="desc">' + esc(s.description) + '</div>' : '') +
          '</div>' +
          '<div class="card">' +
            '<h2>📊 详细属性</h2>' +
            '<div class="stat-grid">' + (statItems.length && statItems[0][1] != null ?
              statItems.map(function(x) {
                return '<div class="stat-item"><span class="k">' + x[2] + ' ' + esc(x[0]) + '</span><span class="v">' + (x[1] == null ? "—" : x[1]) + '</span></div>';
              }).join("") : '<p style="font-size:0.85rem;color:var(--text-dim)">—</p>') + '</div>' +
          '</div>' +
          '<div class="card"><h2>📖 获取方式</h2><p style="font-size:0.85rem;color:var(--text-dim);line-height:1.7">' +
            (s.unlock && s.unlock !== "初始解锁" ? '解锁条件：' + esc(s.unlock) + '<br>' : '来源：' + esc(s.source || "初始解锁")) +
          '</p></div>' +
          renderDetailedStats(s) +
        '</div>' +
        '<div class="info-side">' +
          '<div class="side-card">' +
            '<h3>📦 战略配备信息</h3>' +
            field("分类", catLabel) +
            field("呼叫时间", s.call_in_time || "—") +
            field("冷却时间", s.cooldown || "—") +
            field("使用次数", s.uses || "无限") +
            field("解锁条件", s.unlock || "初始解锁") +
          '</div>' +
        '</div>';
    }

    // ============ detailed_stats 渲染 ============
    var DS_LABELS = {
      mass: "质量", initial_velocity: "初速", drag_factor: "阻力", gravity_factor: "重力",
      penetration_slowdown: "穿透减速", explosion_on_impact: "命中引爆", explode_after: "延时引爆",
      inner_radius: "内圈", outer_radius: "外圈", shockwave_radius: "冲击波",
      standard: "标准", durable: "耐久", element: "属性",
      direct: "直射", slight_angle: "小角度", large_angle: "大角度", extreme_angle: "极端", aoe_effect: "范围穿透",
      pen_direct: "直射", pen_slight_angle: "小角度", pen_large_angle: "大角度", pen_extreme_angle: "极端", pen_aoe: "范围穿透",
      demolition_force: "拆毁值", stagger_force: "踉跄力", push_force: "推力",
      damage_standard: "标准", damage_durable: "耐久", damage_element: "属性"
    };
    function dsVal(v) {
      if (v == null) return "";
      if (typeof v === "object") {
        if (v.min != null && v.max != null) return v.min + "-" + v.max;
        return JSON.stringify(v);
      }
      var s = String(v);
      if (s === "") return "";
      if (s === "None") return "无";
      if (s === "∞") return "∞";
      return s;
    }
    function dsGroup(label, obj) {
      if (!obj) return "";
      var keys = Object.keys(obj);
      if (!keys.length) return "";
      var items = keys.map(function(k) {
        var v = dsVal(obj[k]);
        if (v === "") return "";
        var lbl = DS_LABELS[k] || k;
        return '<span class="ds-item"><span class="ds-k">' + esc(lbl) + '</span><span class="ds-v">' + esc(v) + '</span></span>';
      }).filter(Boolean);
      if (!items.length) return "";
      return '<div class="ds-group"><span class="ds-group-label">' + esc(label) + '</span><span class="ds-items">' + items.join("") + '</span></div>';
    }
    function renderDetailedStats(s) {
      var ds = s.detailed_stats;
      if (!ds) return "";
      // 顶层基础信息
      var topFields = [
        ["冷却", ds.cooldown], ["使用", ds.uses], ["炸弹", ds.bombs], ["齐射", ds.salvos],
        ["范围", ds.bombardment_area], ["生命", ds.main_health], ["护甲", ds.main_armor]
      ].filter(function(x) { return x[1] != null && x[1] !== ""; });
      var topHtml = topFields.length ? topFields.map(function(x) {
        return '<span class="ds-tag">' + esc(x[0]) + ': ' + esc(dsVal(x[1])) + '</span>';
      }).join("") : "";
      // 攻击条目
      var attacksHtml = "";
      var attacks = ds.attacks || [];
      if (attacks.length) {
        attacksHtml = attacks.map(function(a, i) {
          var typeTag = a.type === "projectile" ? '<span class="ds-type ds-type-proj">弹丸</span>' :
                         a.type === "explosion" ? '<span class="ds-type ds-type-exp">爆炸</span>' :
                         '<span class="ds-type">' + esc(a.type) + '</span>';
          return '<div class="ds-attack">' +
            '<div class="ds-attack-head">攻击 #' + (i+1) + ': ' + esc(a.name || "") + ' ' + typeTag + '</div>' +
            dsGroup("弹丸参数", a.projectile) +
            dsGroup("范围参数", a.area_of_effect) +
            dsGroup("伤害参数", a.damage) +
            dsGroup("穿透参数", a.penetration) +
            dsGroup("特殊效果", a.special_effects) +
            '</div>';
        }).join("");
      } else {
        attacksHtml = '<p style="font-size:0.8rem;color:var(--text-dim)">暂无详细攻击数据</p>';
      }
      return '<div class="card ds-block">' +
        '<h2>⚙️ 详细数据</h2>' +
        (topHtml ? '<div class="ds-tags">' + topHtml + '</div>' : "") +
        attacksHtml +
        '</div>';
    }

    function field(k, v) { return '<div class="field"><span class="k">' + esc(k) + '</span><span class="v">' + (v == null || v === "" ? "—" : v) + '</span></div>'; }
    function esc(s) { return String(s || "").replace(/[&<>"']/g, function(c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }

    document.addEventListener("DOMContentLoaded", loadDetail);
  </script>
</body>
</html>
