<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务总览 - 绝地潜兵2 中文维基</title>
  <meta name="description" content="绝地潜兵2 任务图鉴 - 主要目标、阵营特殊任务、战术目标" />
  <link rel="stylesheet" href="./assets/css/wiki-base.css">
  <style>
.wiki-header { text-align: center; padding: 32px 20px 20px; background: linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%); border-bottom: 1px solid var(--border); }

    .wiki-header h1 { font-size: 1.6rem; color: var(--yellow); margin-bottom: 4px; }

    .wiki-header .sub { color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; }

    .wiki-header .back { display: inline-block; margin-top: 10px; color: var(--text-dim); text-decoration: none; font-size: 0.85rem; padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; transition: all 0.2s; }

    .m-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.04); border-radius: 8px; overflow: hidden; }

    .m-icon img { max-width: 36px; max-height: 36px; object-fit: contain; }

    .m-icon .ph { font-size: 1.3rem; color: var(--text-mute); }

    .m-name { color: var(--text); font-size: 0.92rem; }

    .m-name-en { color: var(--text-mute); font-size: 0.72rem; margin-top: 2px; }

    .m-diff { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; }

    .m-faction { font-size: 0.72rem; padding: 2px 10px; border-radius: 10px; color: #fff; white-space: nowrap; }

    .fa-any { background: rgba(100,116,139,0.3); color: var(--text-dim); }

    .fa-terminids { background: rgba(245,158,11,0.25); color: #f59e0b; }

    .fa-automatons { background: rgba(239,68,68,0.25); color: #ef4444; }

    .fa-illuminate { background: rgba(170,68,255,0.25); color: #c084fc; }

    .fa-super_earth { background: rgba(59,130,246,0.25); color: #60a5fa; }


    .mission-grid { flex: 1; max-width: 1200px; margin: 0 auto; padding: 10px 20px 40px; width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }

    .m-card { background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; cursor: pointer; text-decoration: none; color: inherit; display: flex; gap: 12px; align-items: center; transition: transform 0.2s, box-shadow 0.2s; }

    .m-card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(245,197,24,0.08); }


    .loading { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 0.9rem; }

    .empty { text-align: center; padding: 60px 20px; color: var(--text-mute); font-size: 0.85rem; }



  </style>
</head>
<body>
  <header class="wiki-header">
    <h1>🎯 任务总览</h1>
    <p class="sub">Mission Objectives · 主要目标 / 阵营特殊任务 / 战术目标</p>
    <a class="back" href="wiki.html">◀ 返回维基首页</a>
  </header>

  <div class="wiki-toolbar">
    <div class="filter-bar" id="filter-bar"></div>
    <span class="wt-divider"></span>
    <label class="wt-search"><input type="text" id="search-input" placeholder="🔍 搜索任务名称…" oninput="curSearch = this.value.trim().toLowerCase(); renderList();"></label>
    <div class="meta" id="cat-meta"></div>
  </div>

  <div class="mission-grid" id="mission-grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>

  <footer class="wiki-footer"><p>绝地潜兵2 中文维基 · 社区驱动 · 数据仅供参考</p></footer>

  <script src="./assets/js/wiki-router.js"></script>
  <script>
    "use strict";
    var data = null;
    var currentCat = "main";
    var curSearch = "";

    var CATS = [
      { id: "main", label: "主要目标" },
      { id: "terminid", label: "终结族特殊" },
      { id: "automaton", label: "机器人特殊" },
      { id: "illuminate", label: "光能族特殊" },
      { id: "tactical", label: "战术目标" }
    ];
    var FACTION_CN = { any: "通用", terminids: "终结族", automatons: "机器人", illuminate: "光能族", super_earth: "超级地球" };

    async function load() {
      try {
        var r = await fetch("./data/wiki/zh/missions.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        data = await r.json();
        var p = WikiRouter.param("category");
        if (p && CATS.some(function(c) { return c.id === p; })) currentCat = p;
        renderFilters();
        renderList();
      } catch (e) {
        console.error("[Missions] 加载失败:", e);
        document.getElementById("mission-grid").innerHTML = '<div class="empty">⚠️ 任务数据加载失败</div>';
      }
    }

    function renderFilters() {
      document.getElementById("filter-bar").innerHTML = CATS.map(function(c) {
        var n = data.categories.find(function(x) { return x.id === c.id; });
        var cnt = n ? n.tasks.length : 0;
        return '<button class="' + (c.id === currentCat ? "active" : "") + '" onclick="setCat(\'' + c.id + '\')">' + c.label + ' (' + cnt + ')</button>';
      }).join("");
    }

    function setCat(id) {
      currentCat = id;
      renderFilters();
      renderList();
      history.replaceState(null, "", "?category=" + id);
    }

    function renderList() {
      var cat = data.categories.find(function(x) { return x.id === currentCat; });
      if (!cat) return;
      var meta = document.getElementById("cat-meta");
      var tasks = cat.tasks;
      if (curSearch) tasks = tasks.filter(function(t) { return (t.name + " " + (t.name_zh || "")).toLowerCase().indexOf(curSearch) >= 0; });
      meta.innerHTML = '<span style="color:var(--text-dim)">' + esc(cat.name) + '（' + esc(cat.name_zh) + '）· ' + tasks.length + '/' + cat.tasks.length + ' 个任务</span>';
      var grid = document.getElementById("mission-grid");
      grid.innerHTML = tasks.length ? tasks.map(function(t) {
        return '<a class="m-card" href="mission.html?id=' + encodeURIComponent(t.id) + '&category=' + currentCat + '">' +
          '<div class="m-icon">' + (t.icon ? '<img src="' + esc(t.icon) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<span class=ph>🎯</span>\'">' : '<span class="ph">🎯</span>') + '</div>' +
          '<div><div class="m-name">' + esc(t.name_zh || t.name) + '</div><div class="m-name-en">' + esc(t.name) + '</div>' +
          '<div class="m-diff" style="margin-top:4px">' + esc(t.difficulty_zh || t.difficulty || "—") + (t.time_limit ? '<span style="font-size:0.72rem;color:var(--text-mute)"> · ⏱ ' + esc(t.time_limit_zh || t.time_limit) + '</span>' : '') + '</div></div>' +
          '</a>';
      }).join("") : '<div class="empty">没有匹配的任务</div>';
    }

    function esc(s) { return String(s || "").replace(/[&<>"']/g, function(c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }

    document.addEventListener("DOMContentLoaded", load);
  </script>
</body>
</html>
