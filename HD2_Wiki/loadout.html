<body>
  <div class="wiki-header">
    <h1>🎯 战术搭配器</h1>
    <p>随机抽取 4 个战备 · 按对单 / 对群 / 穿甲 / 专项四维评分 · 类型越多评级越高</p>
    <a class="back" href="wiki.html">← 返回维基首页</a>
  </div>

  <div class="toolbar">
    <button class="draw-btn" id="draw-btn">🎲 随机抽取</button>
    <button class="draw-btn alt" id="balanced-btn" title="按游戏内冲突规则抽取：不重复占三号位、不重复占背包位、自带背包的三号位不与其它三号位或背包共存；次抛类（EAT 系列）不占冲突位，可以随时搭">⚖️ 平衡随机</button>
    <span class="meta" id="meta">正在加载战备库…</span>
  </div>

  <div class="layout" id="layout">
    <div class="empty" style="grid-column:1/-1">正在加载战备库…</div>
  </div>

  <div class="wiki-footer">绝地潜兵2 中文维基 · 战术搭配器 · 评分数据来自社区评分表 · 仅供娱乐参考</div>

  <script>
    /* ===== 常量（与主站战术搭配器一致） ===== */
    var DIM4_CN = { "轨道": "冷却", "飞鹰": "冷却", "支援武器": "人机工效", "重型支援武器": "压制力", "载具": "战术性", "可部署物": "战术灵活性", "背包": "战术价值" };
    var TYPE_COLOR = { "轨道": "#F5C518", "飞鹰": "#5BA3D0", "支援武器": "#2ECC71", "重型支援武器": "#E74C3C", "载具": "#CF64F8", "可部署物": "#D6806D", "背包": "#6B7280" };
    var DIM_COLOR = ["#FF6B4A", "#F5C518", "#CF64F8", "#5BA3D0"];
    var DIM_LABEL = ["对单", "对群", "穿甲"];
    var pool = [];
    var loadout = [];
    var mode = "pure";        // "pure" = 纯随机（原按钮）· "balanced" = 平衡随机
    function setMode(m) {
      mode = m;
      loadout = (m === "balanced") ? drawBalanced() : draw();
      var one = m === "balanced";
      $("draw-btn").classList.toggle("on", !one);
      $("balanced-btn").classList.toggle("on", one);
      $("meta").textContent = pool.length + " 个战备可选 · 数据源：社区评分表 · " + (one
        ? "平衡随机：不重复占三号位 / 背包位，自带背包的三号位不与其它三号位、背包共存（次抛 EAT 系列豁免）"
        : "纯随机：等概率抽 4 件，不做任何约束");
      render(loadout);
    }

    function esc(s) { return String(s || "").replace(/[&<>"']/g, function(c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
    function $(id) { return document.getElementById(id); }

    function grade(score) {
      if (score >= 44) return { g: "S", cls: "g-S" };
      if (score >= 32) return { g: "A", cls: "g-A" };
      if (score >= 20) return { g: "B", cls: "g-B" };
      if (score >= 10) return { g: "C", cls: "g-C" };
      return { g: "D", cls: "g-D" };
    }

    /* ============ 随机 / 平衡随机（2026-09-29 新增平衡版） ============
       分类表按游戏内口径手写：官方新增战备后需要补；漏了只会让约束更宽松，不会报错。
         · 三号位   = 支援武器 / 重型支援武器
         · 背包位   = 背包
         · 次抛      = 打一发就丢的 EAT 系列（不占冲突位，任何情况都能带）
         · 背包三号位 = 自带背包的支援武器（同时占掉三号位与背包位）
       ⚠ 若你觉得某件该进/该出这份表（例如 MLS-4X 突击兵算不算次抛），
         直接改下面两个数组即可，其余逻辑不用动。
       2026-09-29 按用户口径订正：
         · LAS-98 激光大炮**不是**背包三号位（回到普通三号位）
         · B/FLAM-80 焚燃者、M-1000 重装机枪、StA-X3 WASP 发射器**是**背包三号位
         · MLS-4X 突击兵、MS-11 单兵导弹发射井**算次抛**（不占冲突位） */
    var DISPOSABLE_WEAPONS = [
      "support_eat_17_expendable_anti_tank",
      "support_eat_411_leveller",
      "support_eat_700_incendiary",
      "support_mls_4x_commando",
      "support_ms_11_missile_silo"
    ];
    var BACKPACK_WEAPONS = [
      "heavy_support_gr_8_recoilless_rifle",
      "heavy_support_ac_8_autocannon",
      "heavy_support_faf_14_spear",
      "heavy_support_rl_77_airburst_rocket_launcher",
      "heavy_support_gl_28_belt_fed_grenade_launcher",
      "heavy_support_b_flam_80_flamer",
      "heavy_support_m_1000_hmg",
      "heavy_support_sta_x3_wasp_launcher"
    ];
    function slotKindOf(x) {
      if (!x) return "other";
      if (x.type !== "支援武器" && x.type !== "重型支援武器") {
        return x.type === "背包" ? "backpack" : "other";
      }
      if (DISPOSABLE_WEAPONS.indexOf(x.id) >= 0) return "disposable";
      if (BACKPACK_WEAPONS.indexOf(x.id) >= 0) return "bpWeapon";
      return "weapon";
    }
    // 能不能再塞进当前这套：st 记录已经占掉的位
    function canTake(x, st) {
      var k = slotKindOf(x);
      if (k === "disposable") return true;                 // 次抛不占冲突位
      if (k === "weapon")     return !st.sw && !st.bpw;     // 已有三号位 / 已有背包三号位 → 不再要
      if (k === "backpack")   return !st.bp && !st.bpw;     // 已有背包 / 已有背包三号位 → 不再要
      if (k === "bpWeapon")   return !st.sw && !st.bp && !st.bpw;  // 三号位或背包任一被占 → 不再要
      return true;
    }
    function markTaken(x, st) {
      var k = slotKindOf(x);
      if (k === "weapon") st.sw = true;
      else if (k === "backpack") st.bp = true;
      else if (k === "bpWeapon") { st.sw = true; st.bp = true; st.bpw = true; }
    }
    // 洗牌：Fisher–Yates（与原来的 draw 完全同一套算法）
    function shuffleInPlace(p) {
      for (var i = p.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = p[i]; p[i] = p[j]; p[j] = t;
      }
      return p;
    }
    // 纯随机：等概率抽 4 件不重复（原逻辑，一行未改）
    function draw() {
      return shuffleInPlace(pool.slice()).slice(0, 4);
    }
    // 平衡随机：洗牌后顺序取，遇到会撞位的就跳过（次抛永远放行）
    function drawBalanced() {
      var p = shuffleInPlace(pool.slice());
      var st = { sw: false, bp: false, bpw: false };
      var out = [];
      for (var i = 0; i < p.length && out.length < 4; i++) {
        if (!canTake(p[i], st)) continue;
        out.push(p[i]);
        markTaken(p[i], st);
      }
      return out.length === 4 ? out : draw();   // 理论上到不了这里，兜底退回纯随机
    }

    function cardHtml(x, isS) {
      var d4 = DIM4_CN[x.type] || "专项";
      var bonus = x.bonus || 0;
      var bonusCls = bonus > 0 ? "bonus-pos" : bonus < 0 ? "bonus-neg" : "bonus-zero";
      var bonusTxt = bonus > 0 ? "+" + bonus : String(bonus);
      var dims = [
        { label: "对单", val: x.stats[0], color: DIM_COLOR[0] },
        { label: "对群", val: x.stats[1], color: DIM_COLOR[1] },
        { label: "穿甲", val: x.stats[2], color: DIM_COLOR[2] },
        { label: d4, val: x.stats[3], color: DIM_COLOR[3] }
      ];
      var bars = dims.map(function(d) {
        return '<div class="bar"><span class="label">' + esc(d.label) + '</span>' +
          '<div class="track"><div class="fill" style="width:' + Math.min(100, d.val / 10 * 100) + '%;background:' + d.color + '"></div></div>' +
          '<span class="val">' + d.val + '</span></div>';
      }).join("");
      var iconHtml = x.icon
        ? '<img class="icon" src="' + esc(x.icon) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<span class=&quot;type-tag&quot;>' + esc(x.type) + '</span>\'">'
        : '<span class="type-tag" style="background:' + (TYPE_COLOR[x.type] || "#6B7280") + '22;color:' + (TYPE_COLOR[x.type] || "#6B7280") + ';border:1px solid ' + (TYPE_COLOR[x.type] || "#6B7280") + '55">' + esc(x.type) + '</span>';
      return '<div class="card' + (isS ? " S" : "") + '">' +
        '<div class="head"><div class="name">' + esc(x.name) + '</div>' + iconHtml + '</div>' +
        bars +
        '<div class="footer"><span class="bonus ' + bonusCls + '">Bonus: ' + bonusTxt + '</span>' +
        '<button class="swap-btn" data-swap="' + esc(x.id) + '">换一个</button></div></div>';
    }

    function openSwap(id) {
      var item = null;
      for (var i = 0; i < pool.length; i++) if (pool[i].id === id) { item = pool[i]; break; }
      if (!item) return;
      /* 同类型候选。平衡模式下还要按规则过滤：把「其它三件」当作已占位状态，
         只列出换上去不会破坏约束的候选（否则换一下就又出现两把三号位/两个背包了）。 */
      var st = { sw: false, bp: false, bpw: false };
      if (mode === "balanced") {
        loadout.forEach(function(y) { if (y.id !== id) markTaken(y, st); });
      }
      var same = pool.filter(function(x) {
        if (x.type !== item.type || x.id === id) return false;
        return mode === "balanced" ? canTake(x, st) : true;
      });
      var mask = document.createElement("div");
      mask.className = "mask";
      var list = same.map(function(x) {
        return '<div class="mitem" data-pick="' + esc(x.id) + '"><span>' + esc(x.name) + '</span>' +
          '<span class="mstats">' + x.stats.join("/") + ' · B' + (x.bonus || 0) + '</span></div>';
      }).join("") || '<div class="empty">同类型没有可换的战备' + (mode === "balanced" ? "（平衡规则下都被占位挡住了）" : "") + '</div>';
      mask.innerHTML = '<div class="modal"><div class="mhead"><span class="mtitle">🔄 更换「' + esc(item.name) + '」</span><span class="mclose">✕</span></div>' +
        '<div class="mlist">' + list + '</div></div>';
      document.body.appendChild(mask);
      mask.querySelector(".mclose").addEventListener("click", function() { mask.remove(); });
      mask.addEventListener("click", function(e) { if (e.target === mask) mask.remove(); });
      mask.querySelectorAll(".mitem").forEach(function(el) {
        el.addEventListener("click", function() {
          var nid = el.dataset.pick, ni = null;
          for (var i = 0; i < pool.length; i++) if (pool[i].id === nid) { ni = pool[i]; break; }
          if (ni) {
            var idx = loadout.findIndex(function(x) { return x.id === id; });
            if (idx >= 0) loadout[idx] = ni;
            render(loadout);
          }
          mask.remove();
        });
      });
    }

    function render(picked) {
      var root = $("layout");
      var types = {};
      picked.forEach(function(x) { types[x.type] = (types[x.type] || 0) + 1; });
      var T = Object.keys(types).length;
      var M = picked.filter(function(x) { return x.subtag && x.subtag.length > 0; }).length;
      var bonusSum = picked.reduce(function(s, x) { return s + (x.bonus || 0); }, 0);
      var total = (T * 5 + T * T) - (M * M * 0.5) + bonusSum;
      var g = grade(total);
      var isS = g.g === "S";

      var cardsHtml = picked.map(function(x) { return cardHtml(x, isS); }).join("");

      var dimAvg = [0, 1, 2, 3].map(function(i) {
        return picked.reduce(function(s, x) { return s + (x.stats[i] || 0); }, 0) / picked.length;
      });
      var domType = Object.keys(types).sort(function(a, b) { return types[b] - types[a]; })[0] || "";
      var d4Name = DIM4_CN[domType] || "专项";
      var chartLabels = ["对单", "对群", "穿甲", d4Name];
      var chartBars = chartLabels.map(function(lb, i) {
        return '<div class="crow"><span class="clabel">' + esc(lb) + '</span>' +
          '<div class="ctrack"><div class="cfill" style="width:' + Math.min(100, dimAvg[i] / 12 * 100) + '%;background:' + DIM_COLOR[i] + '"></div></div>' +
          '<span class="cval">' + dimAvg[i].toFixed(1) + '</span></div>';
      }).join("");

      root.innerHTML =
        '<div class="cards">' + cardsHtml + '</div>' +
        '<div class="side">' +
          '<div class="panel"><h3>📊 评分明细</h3>' +
            '<div class="prow"><span>类型数 T</span><strong>' + T + '</strong></div>' +
            '<div class="prow"><span>多功能 M</span><strong>' + M + '</strong></div>' +
            '<div class="prow"><span>Bonus 合计</span><strong>' + (bonusSum > 0 ? "+" + bonusSum : bonusSum) + '</strong></div>' +
            '<div class="divider"></div>' +
            '<div class="prow"><span>总评</span><strong class="total">' + total.toFixed(1) + '</strong></div>' +
            '<div class="grade ' + g.cls + '">' + g.g + ' 级</div>' +
            '<div class="hint">' + (isS ? "🏆 顶级配装，真理部为你骄傲！" : "搭配越多样，战术评级越高") + '</div>' +
            '<div class="guide">评级标准：S≥44 · A≥32 · B≥20 · C≥10 · D&lt;10</div>' +
            '<div class="formula">评分公式：<code>总评 = T×5 + T² − M²×0.5 + ΣBonus</code><br>T=配装类型数 · M=多功能战备数</div>' +
          '</div>' +
          '<div class="panel chart"><h3>📈 配装能力轮廓</h3>' + chartBars + '</div>' +
        '</div>';

      root.querySelectorAll(".swap-btn").forEach(function(b) {
        b.addEventListener("click", function() { openSwap(b.dataset.swap); });
      });
    }

    /* ===== 加载 ===== */
    (async function() {
      try {
        var r = await fetch("./data/wiki/zh/loadout.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        var d = await r.json();
        pool = d.stratagems || [];
        setMode("pure");      // 初始仍是原来的纯随机
        $("draw-btn").addEventListener("click", function() { setMode("pure"); });
        $("balanced-btn").addEventListener("click", function() { setMode("balanced"); });
      } catch (e) {
        $("layout").innerHTML = '<div class="empty" style="grid-column:1/-1">⚠️ 战备库加载失败：' + esc(String(e)) + '</div>';
      }
    })();
  </script>
</body>
</html>
