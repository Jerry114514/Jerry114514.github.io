<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏机制 - 绝地潜兵2 中文维基</title>
  <meta name="description" content="绝地潜兵2 游戏机制详解" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #0a0e1a; --bg-mid: #141b33; --bg-card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.08); --text: #e2e8f0; --text-dim: #94a3b8;
      --text-mute: #64748b; --yellow: #f5c518; --blue: #3b82f6; --radius: 12px;
    }
    @font-face { font-family: 'ChuangKeTi'; src: url('./assets/ChuangKeTieJinGangTi-2.otf') format('opentype'); }
@font-face { font-family: 'SourceHanSans'; src: url('./assets/SourceHanSansCN-Medium.otf') format('opentype'); }
    html { scroll-behavior: smooth; }
    body { font-family: "SourceHanSans","Microsoft YaHei","PingFang SC",sans-serif; background: var(--bg-deep); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
    .wiki-header { padding: 20px; background: linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%); border-bottom: 1px solid var(--border); }
    .breadcrumb { max-width: 1400px; margin: 0 auto; font-size: 0.8rem; color: var(--text-mute); }
    .breadcrumb a { color: var(--blue); text-decoration: none; }
    .breadcrumb a:hover { color: var(--yellow); }
    .layout { flex: 1; max-width: 1400px; margin: 0 auto; padding: 20px; display: flex; gap: 20px; width: 100%; }
    .toc-sidebar { width: 260px; flex: 0 0 260px; position: sticky; top: 20px; align-self: flex-start; max-height: calc(100vh - 40px); overflow-y: auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .toc-sidebar .toc-title { font-size: 0.85rem; color: var(--text-mute); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .toc-item { display: block; padding: 4px 0; font-size: 0.8rem; color: var(--text-dim); text-decoration: none; border-radius: 4px; transition: color 0.15s; }
    .toc-item:hover { color: var(--yellow); }
    .toc-item.active { color: var(--yellow); }
    .toc-l3 { padding-left: 16px; }
    .toc-l4 { padding-left: 28px; }
    .main-content { flex: 1; min-width: 0; }
    .card { background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .card h1 { font-size: 1.6rem; color: var(--yellow); margin-bottom: 4px; }
    .card .desc { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 10px; }
    .section { scroll-margin-top: 80px; }
    .section h2 { font-size: 1.2rem; color: var(--text); margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .section h3 { font-size: 1rem; color: var(--text); margin: 18px 0 8px; }
    .section h4 { font-size: 0.92rem; color: var(--text-dim); margin: 14px 0 6px; }
    .section p { font-size: 0.88rem; color: var(--text-dim); line-height: 1.8; margin: 8px 0; }
    .section ul, .section ol { margin: 6px 0 6px 20px; font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }
    .section table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.82rem; }
    .section th { text-align: left; padding: 8px; border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--text-dim); }
    .section td { padding: 6px 8px; border: 1px solid var(--border); color: var(--text-dim); }
    .section tr:nth-child(even) { background: rgba(255,255,255,0.02); }
    .section code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 0.82rem; color: var(--yellow); }
    .section pre { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 0.82rem; color: var(--text-dim); margin: 10px 0; }
    .section blockquote { border-left: 3px solid var(--blue); padding: 8px 14px; margin: 10px 0; background: rgba(59,130,246,0.06); border-radius: 0 8px 8px 0; font-size: 0.85rem; color: var(--text-dim); }
    .section img { max-width: 100%; border-radius: 8px; }

    /* ===== 银河冲击计算器 ===== */
    .calculator-container { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 24px 28px; margin: 32px 0; color: #e0e0e0; }
    .calculator-container h3 { color: #f5c842; margin-top: 0; margin-bottom: 4px; font-size: 1.5rem; }
    .calc-desc { color: #aaa; margin-bottom: 20px; font-size: 0.95rem; }
    .calc-grid { display: flex; flex-wrap: wrap; gap: 30px; }
    .calc-inputs, .calc-results { flex: 1 1 300px; min-width: 260px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-weight: 600; margin-bottom: 4px; color: #ddd; }
    .input-group input, .input-group select { width: 100%; padding: 8px 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #eee; font-size: 1rem; box-sizing: border-box; }
    .input-group input:focus, .input-group select:focus { outline: none; border-color: #f5c842; }
    .input-group .hint { display: block; font-size: 0.8rem; color: #888; margin-top: 2px; }
    button#calcBtn { background: #f5c842; color: #1a1a1a; border: none; padding: 10px 24px; font-size: 1.05rem; font-weight: 700; border-radius: 6px; cursor: pointer; transition: background 0.2s; width: 100%; margin-top: 6px; }
    button#calcBtn:hover { background: #e0b032; }
    .calc-results h4 { margin-top: 0; margin-bottom: 16px; color: #f5c842; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .result-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a2a; font-size: 0.95rem; }
    .result-item.highlight { background: #252525; margin: 4px -8px; padding: 8px 8px; border-radius: 4px; border-left: 3px solid #f5c842; }
    .result-item .result-label { color: #aaa; }
    .result-item .result-value { font-weight: 600; color: #eee; }
    .result-item.highlight .result-value { color: #f5c842; }
    .result-item.result-note .result-value { color: #88ccff; font-weight: 400; font-size: 0.9rem; text-align: right; max-width: 60%; }
    .warning-block { background: #2a1a1a; border-left: 4px solid #ff6644; padding: 16px 20px; margin: 24px 0; border-radius: 6px; }
    .warning-block h4 { color: #ff6644; margin: 0 0 6px 0; }
    .warning-block p { margin: 6px 0; color: #ddd; }
    @media (max-width: 700px) { .calculator-container { padding: 16px 18px; } .calc-grid { flex-direction: column; gap: 20px; } }
    @media (max-width: 1023px) { .toc-sidebar { display: none; } }
    .toc-toggle { display: none; }
    @media (max-width: 1023px) {
      .toc-sidebar { display: none; }
      .toc-toggle { display: block; padding: 8px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim); font-size: 0.85rem; cursor: pointer; margin-bottom: 12px; }
      .toc-sidebar.open { display: block; position: fixed; top: 60px; left: 10px; right: 10px; width: auto; z-index: 100; max-height: 80vh; }
    }
  
h1, h2, h3, h4, .wiki-header h1, .wiki-header .title, button, .btn, .back, .nav-item, .filter-bar button, .cat-tag, .faction-tag, .m-name, .name, .title-block .name, .card h1, .card h2, .toc-item, .breadcrumb a, .calc-container h3, .calc-results h4, .result-item.highlight .result-value, #calcBtn {
  font-family: "ChuangKeTi","SourceHanSans","Microsoft YaHei",sans-serif;
}

</style>
</head>
<body>
  <header class="wiki-header">
    <div class="breadcrumb" id="breadcrumb">← <a href="mechanics.html">游戏机制</a></div>
  </header>

  <div class="layout" id="layout"><div class="loading">正在加载…</div></div>

  <footer class="wiki-footer"><p>绝地潜兵2 中文维基 · 社区驱动 · 数据仅供参考</p></footer>

  <script>
    "use strict";
    async function load() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get("id") || "damage";
      var layout = document.getElementById("layout");
      try {
        var r = await fetch("./data/wiki/zh/mechanics/" + id + "_zh.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) {
          r = await fetch("./data/wiki/zh/mechanics/" + id + ".json?t=" + Date.now(), { cache: "no-store" });
        }
        if (!r.ok) throw new Error("HTTP " + r.status);
        var d = await r.json();
        render(d, id);
      } catch(e) {
        console.error("[Mechanic] 加载失败:", e);
        layout.innerHTML = '<div class="loading">⚠️ 数据加载失败</div>';
      }
    }

    function buildSections(secs) {
      return secs.map(function(s) {
        var out = { level: 2, id: s.title_zh.replace(/[\s\u4e00-\u9fff]+/g, '_'), title: s.title_zh, content: s.content_zh || '' };
        if (s.subsections_zh) {
          out.subsections = s.subsections_zh.map(function(sub) {
            var sub2 = { level: 3, id: sub.title_zh.replace(/[\s\u4e00-\u9fff]+/g, '_'), title: sub.title_zh, content: sub.content_zh || '' };
            if (sub.subsections_zh) {
              sub2.subsections = sub.subsections_zh.map(function(s4) {
                return { level: 4, id: s4.title_zh.replace(/[\s\u4e00-\u9fff]+/g, '_'), title: s4.title_zh, content: s4.content_zh || '' };
              });
            }
            return sub2;
          });
        }
        return out;
      });
    }

    function buildToc(secs) {
      var toc = [];
      secs.forEach(function(s) {
        toc.push({ level: 2, id: s.title_zh.replace(/[\s\u4e00-\u9fff]+/g, '_'), title: s.title_zh });
        if (s.subsections_zh) {
          s.subsections_zh.forEach(function(sub) {
            toc.push({ level: 3, id: sub.title_zh.replace(/[\s\u4e00-\u9fff]+/g, '_'), title: sub.title_zh });
          });
        }
      });
      return toc;
    }

    function render(d, id) {
      var d2 = d.sections_zh ? { title: d.title_zh, description: d.description_zh, sections: buildSections(d.sections_zh), toc: buildToc(d.sections_zh) } : d;
      document.getElementById("breadcrumb").innerHTML = '← <a href="mechanics.html">游戏机制</a> › ' + esc(d2.title);
      document.title = d2.title + " - 绝地潜兵2 中文维基";

      var tocItems = d2.toc.map(function(t) {
        var cls = "toc-item toc-l" + t.level;
        return '<a class="' + cls + '" href="#' + esc(t.id) + '">' + esc(t.title) + '</a>';
      }).join("");

      var sectionsHtml = d2.sections.map(function(s) {
        return renderSection(s);
      }).join("");

      layout.innerHTML =
        '<div class="toc-sidebar" id="toc-sidebar">' +
          '<div class="toc-title">📑 目录</div>' + tocItems +
        '</div>' +
        '<div class="main-content">' +
          '<button class="toc-toggle" onclick="toggleToc()">📑 目录</button>' +
          '<div class="card"><h1>' + esc(d2.title) + '</h1><div class="desc">' + esc(d2.description) + '</div></div>' +
          sectionsHtml +
        '</div>';

      // 滚动高亮
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(e) {
          if (e.isIntersecting) {
            document.querySelectorAll(".toc-item").forEach(function(a) { a.classList.remove("active"); });
            var id = e.target.id;
            var link = document.querySelector('.toc-item[href="#' + id + '"]');
            if (link) link.classList.add("active");
          }
        });
      }, { rootMargin: "-80px 0px -60% 0px" });
      document.querySelectorAll(".section").forEach(function(s) { observer.observe(s); });

      // 银河冲击计算器
      if (id === "galactic_war") { initCalculator(); }
    }

    function initCalculator() {
      var calcDiv = document.getElementById("impact-calculator");
      if (!calcDiv) return;
      calcDiv.innerHTML = calcHtml();
      var script = document.createElement("script");
      script.textContent = calcScript();
      calcDiv.parentNode.appendChild(script);
    }

    function calcHtml() {
      return '<div class="calculator-container" id="calc-container"><h3>🧮 银河冲击计算器</h3><p class="calc-desc">输入你上一局任务的结算数据，估算对星球解放的真实贡献。</p><div class="calc-grid"><div class="calc-inputs">' +
        '<div class="input-group"><label for="deaths">💀 阵亡次数</label><input type="number" id="deaths" value="0" min="0" max="99" step="1"><span class="hint">（超过 10 次按 10 次计算，惩罚封顶 20%）</span></div>' +
        '<div class="input-group"><label for="extracted">🚀 成功撤离人数</label><input type="number" id="extracted" value="4" min="0" max="4" step="1"><span class="hint">（小队总人数固定为 4）</span></div>' +
        '<div class="input-group"><label for="objectives">🎯 完成目标总数</label><input type="number" id="objectives" value="4" min="0" max="6" step="1"><span class="hint">（主线+支线，难度10最多6个）</span></div>' +
        '<div class="input-group"><label for="difficulty">📊 任务难度等级</label><select id="difficulty">' +
        '<option value="1">1-易如反掌</option><option value="2">2-简单</option><option value="3">3-普通</option><option value="4">4-充满挑战</option><option value="5" selected>5-困难</option>' +
        '<option value="6">6-极端</option><option value="7">7-玩命任务</option><option value="8">8-不可能的任务</option><option value="9">9-绝境</option><option value="10">10-超级绝地俯冲</option></select></div>' +
        '<div class="input-group"><label for="multiplier">🌐 在线人数动态系数</label><input type="number" id="multiplier" value="1.0" min="0.5" max="2.0" step="0.05"><span class="hint">（可在主站实时查询当前系数）</span></div>' +
        '<button id="calcBtn">📊 计算贡献</button></div><div class="calc-results"><h4>📋 计算结果</h4><div id="resultArea">' +
        '<div class="result-item"><span class="result-label">阵亡惩罚</span><span class="result-value" id="deathPenalty">-0%</span></div>' +
        '<div class="result-item"><span class="result-label">撤离惩罚</span><span class="result-value" id="extractPenalty">-0%</span></div>' +
        '<div class="result-item"><span class="result-label">总惩罚系数</span><span class="result-value" id="totalPenalty">0%</span></div>' +
        '<div class="result-item highlight"><span class="result-label">⭐ 任务影响度</span><span class="result-value" id="impact">0.00</span></div>' +
        '<div class="result-item highlight"><span class="result-label">🔥 最终真实贡献</span><span class="result-value" id="finalImpact">0.00</span></div>' +
        '<div class="result-item result-note"><span class="result-label">💡 解读</span><span class="result-value" id="interpretation">—</span></div></div></div></div></div>';
    }

    function calcScript() {
      return "var DIFFICULTY_MAX_OBJECTIVES={1:3,2:3,3:4,4:4,5:4,6:5,7:5,8:5,9:6,10:6};var DIFFICULTY_NAMES={1:'Trivial',2:'Easy',3:'Medium',4:'Challenging',5:'Hard',6:'Extreme',7:'Suicide Mission',8:'Impossible',9:'Helldive',10:'Super Helldive'};function compute(){var d=parseInt(document.getElementById('deaths').value)||0;var e=parseInt(document.getElementById('extracted').value)||0;var o=parseInt(document.getElementById('objectives').value)||0;var l=parseInt(document.getElementById('difficulty').value)||1;var m=parseFloat(document.getElementById('multiplier').value)||1.0;d=Math.max(0,d);e=Math.min(4,Math.max(0,e));o=Math.min(6,Math.max(0,o));l=Math.min(10,Math.max(1,l));m=Math.min(2,Math.max(0.5,m));var df=Math.min(1,d/10);var dp=0.2*df;var ef=1-(e/4);var ep=0.3*ef;var tp=dp+ep;var im=1-tp;var ti=o*im;var fi=ti*l*m;document.getElementById('deathPenalty').textContent='- '+(dp*100).toFixed(1)+'%';document.getElementById('extractPenalty').textContent='- '+(ep*100).toFixed(1)+'%';document.getElementById('totalPenalty').textContent=(tp*100).toFixed(1)+'%';document.getElementById('impact').textContent=ti.toFixed(2);document.getElementById('finalImpact').textContent=fi.toFixed(2);var txt='';if(fi<0.5)txt='贡献较低，尽量少死、全员撤离、多做支线！';else if(fi<2)txt='贡献一般，优化死亡和撤离表现能显著提升。';else if(fi<5)txt='贡献不错，继续保持！';else if(fi<10)txt='贡献很高，你是解放星球的栋梁！';else txt='⭐ 超级贡献！这一局打出了史诗级影响力！';var eq=fi/(10*1.0);var maxEq=6;if(eq>0.01){if(eq>=maxEq-0.01)txt+='（已达难度10下的满配水准）';else txt+='（等效于难度10下完成'+Math.min(eq,maxEq).toFixed(1)+'个目标）';}document.getElementById('interpretation').textContent=txt;}document.getElementById('calcBtn').addEventListener('click',compute);document.querySelectorAll('#calc-container input,#calc-container select').forEach(function(el){el.addEventListener('keydown',function(e){if(e.key==='Enter')compute();});});compute();";
    }

    function renderSection(s) {
      var html = '<div class="section" id="' + esc(s.id) + '">';
      if (s.level === 2) html += '<h2>' + esc(s.title) + '</h2>';
      else if (s.level === 3) html += '<h3>' + esc(s.title) + '</h3>';
      else html += '<h4>' + esc(s.title) + '</h4>';
      html += cleanContent(s.content);
      if (s.subsections) {
        s.subsections.forEach(function(sub) { html += renderSection(sub); });
      }
      html += '</div>';
      return html;
    }

    function cleanContent(html) {
      // 清理编辑链接
      html = html.replace(/<span class="mw-editsection">.*?<\/span>/g, "");
      // 清理注释
      html = html.replace(/<!--.*?-->/g, "");
      return html;
    }

    function toggleToc() {
      document.getElementById("toc-sidebar").classList.toggle("open");
    }

    function esc(s) { return String(s || "").replace(/[&<>"']/g, function(c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }

    document.addEventListener("DOMContentLoaded", load);
  </script>
</body>
</html>
