<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="gridTitle gridDesc">
  <title id="gridTitle">星区格网与空格归属示意</title>
  <desc id="gridDesc">以极坐标格网展示星球所在格、同格多数投票、同票按格心距离与空格最近星球归属。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f3c74f"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="22" fill="#07111c"/>
  <rect x="24" y="24" width="1152" height="572" rx="16" fill="#0b1d2b" stroke="#25465a"/>
  <text x="62" y="72" fill="#edf7fb" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">星区格网与空格归属</text>
  <text x="62" y="101" fill="#83a8b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">24 个 15° 楔形 × 10 个 0.1 径向环 = 240 个单元</text>

  <g transform="translate(0 20)">
    <circle cx="332" cy="328" r="248" fill="#06141e" stroke="#1f4356" stroke-width="2"/>
    <g stroke="#23485b" stroke-width="1" fill="none">
      <circle cx="332" cy="328" r="25"/>
      <circle cx="332" cy="328" r="50"/>
      <circle cx="332" cy="328" r="75"/>
      <circle cx="332" cy="328" r="100"/>
      <circle cx="332" cy="328" r="125"/>
      <circle cx="332" cy="328" r="150"/>
      <circle cx="332" cy="328" r="175"/>
      <circle cx="332" cy="328" r="200"/>
      <circle cx="332" cy="328" r="225"/>
      <circle cx="332" cy="328" r="248"/>
    </g>
    <g stroke="#1d4052" stroke-width="1">
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(0 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(15 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(30 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(45 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(60 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(75 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(90 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(105 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(120 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(135 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(150 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(165 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(180 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(195 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(210 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(225 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(240 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(255 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(270 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(285 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(300 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(315 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(330 332 328)"/>
      <line x1="332" y1="328" x2="332" y2="80" transform="rotate(345 332 328)"/>
    </g>

    <g fill="#3b82f6" fill-opacity=".38" stroke="#60a5fa" stroke-width="1.2">
      <path d="M332 178 A150 150 0 0 1 370.823 183.113 L362.988 208.14 A125 125 0 0 0 332 203.879 Z" transform="rotate(-90 332 328)"/>
      <path d="M332 178 A150 150 0 0 1 370.823 183.113 L362.988 208.14 A125 125 0 0 0 332 203.879 Z" transform="rotate(-75 332 328)"/>
      <path d="M332 178 A150 150 0 0 1 370.823 183.113 L362.988 208.14 A125 125 0 0 0 332 203.879 Z" transform="rotate(-60 332 328)"/>
    </g>
    <g fill="#f59e0b" fill-opacity=".34" stroke="#fbbf24" stroke-width="1.2">
      <path d="M332 78 A250 250 0 0 1 396.711 84.952 L379.369 134.961 A200 200 0 0 0 332 128.438 Z" transform="rotate(25 332 328)"/>
      <path d="M332 78 A250 250 0 0 1 396.711 84.952 L379.369 134.961 A200 200 0 0 0 332 128.438 Z" transform="rotate(40 332 328)"/>
    </g>
    <g fill="#22c55e" fill-opacity=".3" stroke="#4ade80" stroke-width="1.2">
      <path d="M332 203.879 A125 125 0 0 1 369.478 208.742 L362.226 233.205 A100 100 0 0 0 332 229.2 Z" transform="rotate(145 332 328)"/>
      <path d="M332 203.879 A125 125 0 0 1 369.478 208.742 L362.226 233.205 A100 100 0 0 0 332 229.2 Z" transform="rotate(160 332 328)"/>
    </g>

    <circle cx="248" cy="246" r="8" fill="#f8fafc" stroke="#60a5fa" stroke-width="3"/>
    <text x="226" y="228" fill="#dbeafe" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">A1</text>
    <circle cx="267" cy="221" r="8" fill="#f8fafc" stroke="#60a5fa" stroke-width="3"/>
    <text x="280" y="214" fill="#dbeafe" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">A2</text>
    <circle cx="395" cy="155" r="8" fill="#f8fafc" stroke="#fbbf24" stroke-width="3"/>
    <text x="409" y="150" fill="#fef3c7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">B</text>
    <circle cx="450" cy="411" r="8" fill="#f8fafc" stroke="#4ade80" stroke-width="3"/>
    <text x="464" y="416" fill="#dcfce7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">C</text>

    <path d="M305 278 C322 257 345 238 365 220" fill="none" stroke="#f3c74f" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="274" y="294" fill="#f3c74f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">空格 → 最近星球</text>
    <circle cx="308" cy="286" r="4" fill="#f3c74f" filter="url(#glow)"/>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="654" y="126" width="470" height="92" rx="12" fill="#0f2535" stroke="#28526a"/>
    <text x="680" y="158" fill="#56d8f4" font-size="14" font-weight="700">① 星球认领</text>
    <text x="680" y="185" fill="#dceaf0" font-size="15">cellId = floor(θ / 15°) : floor(radius × 10)</text>
    <text x="680" y="205" fill="#83a8b8" font-size="13">一个格可容纳多颗星球</text>

    <rect x="654" y="238" width="470" height="104" rx="12" fill="#0f2535" stroke="#28526a"/>
    <text x="680" y="270" fill="#56d8f4" font-size="14" font-weight="700">② 同格多数投票</text>
    <text x="680" y="297" fill="#dceaf0" font-size="15">A: 2 票　B: 1 票 → 格归 A</text>
    <text x="680" y="320" fill="#83a8b8" font-size="13">平票时比较星球到格心的距离</text>

    <rect x="654" y="362" width="470" height="104" rx="12" fill="#0f2535" stroke="#28526a"/>
    <text x="680" y="394" fill="#56d8f4" font-size="14" font-weight="700">③ 空格用最近星球补齐</text>
    <text x="680" y="421" fill="#dceaf0" font-size="15">按格心到星球位置计算欧氏距离</text>
    <text x="680" y="444" fill="#83a8b8" font-size="13">结果：240 格全部有星区，无空洞</text>

    <line x1="654" y1="496" x2="1124" y2="496" stroke="#28526a"/>
    <circle cx="679" cy="523" r="5" fill="#60a5fa"/>
    <text x="694" y="528" fill="#b9d4df" font-size="13">星区 A</text>
    <circle cx="779" cy="523" r="5" fill="#fbbf24"/>
    <text x="794" y="528" fill="#b9d4df" font-size="13">星区 B</text>
    <circle cx="879" cy="523" r="5" fill="#4ade80"/>
    <text x="894" y="528" fill="#b9d4df" font-size="13">星区 C</text>
    <text x="654" y="563" fill="#648b9c" font-size="12">局部语义示意；所有边界实际都落在 15° / 0.1 网格线上。</text>
  </g>
</svg>
