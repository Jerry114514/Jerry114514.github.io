<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>银河星图 — HD2 真理部</title>
<!--
  银河星图（MapLibre GL 3D，主站正式入口）
  ============================================================
  渲染层：MapLibre GL JS v4.7.1（WebGL），真实 3D 透视（pitch 48°）
  分层数据源，参考 helldiverscompanion 星图的图层结构
  星球图标：本地缓存 assets/planet-icons/（fetch_planet_icons.py 落库，缺失回退纯色圆点）
  效果图标：本地 assets/effect-icons/（势力变种 / DSS 战术行动）
  中文字形：复用 HD2_Wiki 的思源黑体，经 localIdeographFontFamily 本地渲染（不下载 CJK 字形）

  自托管资源（不走 CDN，规避墙 + 离线兜底，与仓库既有 chart.umd.min.js 策略一致）：
    js/libs/maplibre/maplibre-gl-csp.js          库本体
    js/libs/maplibre/maplibre-gl-csp-worker.js   worker（显式文件，避免 blob worker）
    js/libs/maplibre/fonts/NotoSansRegular/      拉丁字形 PBF

  数据：data.json + tables/waypoints.json + js/tactical.js + tables/galactic_effects.json

-->
<link rel="stylesheet" href="./js/libs/maplibre/maplibre-gl.css">
<style>
  :root{
    --bg-deep:#080B12; --bg-mid:#0E1420; --panel:rgba(14,20,32,.86);
    --border:rgba(255,255,255,.10); --border-h:rgba(255,255,255,.20);
    --text:#e2e8f0; --text-dim:#94a3b8; --text-mute:#64748b;
    --yellow:#f5c518; --blue:#3b82f6;
    --c-humans:#5BA3D0; --c-terminids:#F5C518; --c-automaton:#D6806D; --c-illuminate:#CF64F8;
    --radius:12px; --radius-s:8px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;height:100dvh}
  /* 正文/标签字体：复用 wiki 侧思源黑体（不经 CDN）。
     该字体同时供下方 MapLibre 的 localIdeographFontFamily 使用 ——
     MapLibre 用 canvas 2D + TinySDF 走系统/本地字体渲染 CJK，故 @font-face 对地图标签同样生效。*/
  @font-face{
    font-family:"SourceHanSans";
    src:url("../HD2_Wiki/assets/fonts/SourceHanSansCN-Medium.otf") format("opentype");
    font-display:swap;
  }
  body{
    display:flex;flex-direction:column;background:var(--bg-deep);color:var(--text);overflow:hidden;
    font-family:"SourceHanSans","Microsoft YaHei","PingFang SC",sans-serif;
  }
  /* ---------- 顶栏 ---------- */
  header{
    display:flex;align-items:center;gap:14px;padding:9px 18px;z-index:20;
    border-bottom:1px solid var(--border);background:var(--bg-mid);
  }
  header h1{font-family:"ZZZ-thick","SourceHanSans",sans-serif;font-size:1.05rem;color:var(--yellow);white-space:nowrap}
  .tag{background:var(--yellow);color:#1a1a00;font-weight:700;border-radius:999px;padding:2px 10px;font-size:.68rem;white-space:nowrap}
  .tag.v2{background:var(--blue);color:#fff}
  header .stats{margin-left:auto;color:var(--text-mute);font-size:.74rem;display:flex;gap:13px;flex-wrap:wrap;align-items:center}
  header .stats b{color:var(--text-dim);font-weight:600}
  header button,header .btn{
    background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text-dim);
    border-radius:8px;padding:5px 11px;cursor:pointer;font-size:.76rem;font-family:inherit;white-space:nowrap;
  }
  header button:hover,header .btn:hover{border-color:var(--blue);color:var(--blue)}
  header a.btn{text-decoration:none;display:inline-block}

  /* ---------- 主区 ---------- */
  main{flex:1;display:flex;min-height:0;position:relative}
  #stage{flex:1;position:relative;overflow:hidden;cursor:grab}
  #stage.dragging{cursor:grabbing}
  #stars{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
  #map{position:absolute;inset:0;z-index:1;background:transparent!important}
  .maplibregl-canvas{outline:none}
  .maplibregl-ctrl-attrib{display:none!important}

  /* 载入遮罩 */
  #boot{
    position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;gap:14px;
    align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#131C30,#080B12 70%);
    transition:opacity .5s ease;
  }
  #boot.gone{opacity:0;pointer-events:none}
  #boot .ring{
    width:46px;height:46px;border-radius:50%;border:3px solid rgba(245,197,24,.18);
    border-top-color:var(--yellow);animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot .msg{color:var(--text-dim);font-size:.84rem;text-align:center;line-height:1.7}
  #boot .msg small{color:var(--text-mute);font-size:.76rem}
  #tac-empty{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:12;pointer-events:none;white-space:nowrap;
    background:rgba(14,20,32,.92);border:1px solid rgba(245,197,24,.45);color:var(--text-dim);
    border-radius:999px;padding:7px 16px;font-size:.78rem;
  }

  /* tooltip */
  #tip{
    position:absolute;z-index:15;pointer-events:none;display:none;
    background:rgba(10,14,26,.95);border:1px solid #334155;border-radius:var(--radius-s);
    padding:9px 12px;font-size:.76rem;line-height:1.6;min-width:170px;max-width:250px;
    box-shadow:0 8px 26px rgba(0,0,0,.6);
  }
  #tip .n{font-weight:700;color:var(--yellow);margin-bottom:2px}
  #tip .r{color:var(--text-dim)}
  #tip .r span{color:var(--text)}
  #tip .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
  #tip .bar i{display:block;height:100%;background:var(--yellow)}

  /* ---------- 侧栏 ---------- */
  aside{
    width:326px;flex-shrink:0;border-left:1px solid var(--border);background:var(--bg-mid);
    overflow-y:auto;overflow-x:hidden;padding:14px;display:flex;flex-direction:column;gap:11px;z-index:10;
    transition:width .26s ease,padding .26s ease,opacity .2s ease;
  }
  /* 可收缩侧栏：收起后只留一条窄边条（点击恢复） */
  body.aside-collapsed aside{width:0;padding:0;opacity:0;pointer-events:none;border-left:none}
  #aside-rail{
    display:none;position:absolute;top:0;right:0;bottom:0;width:22px;z-index:19;cursor:pointer;
    background:linear-gradient(90deg,rgba(14,20,32,0),rgba(14,20,32,.9));
    border-left:1px solid var(--border);align-items:center;justify-content:center;
  }
  body.aside-collapsed #aside-rail{display:flex}
  #aside-rail span{color:var(--text-dim);font-size:.9rem}
  #aside-rail:hover span{color:var(--blue)}

  /* ---------- 左上角星区信息卡（悬停星球时显示） ---------- */
  #sector-card{
    position:absolute;left:14px;top:14px;z-index:14;display:none;min-width:206px;max-width:288px;
    background:rgba(10,14,26,.93);border:1px solid #334155;border-radius:var(--radius);
    padding:10px 13px;box-shadow:0 8px 26px rgba(0,0,0,.6);
  }
  #sector-card.on{display:flex;gap:11px;align-items:flex-start}
  #sector-card .ficon{width:38px;height:38px;flex-shrink:0;margin-top:2px}
  #sector-card .ficon svg,#sector-card .ficon img{width:100%;height:100%;display:block}
  #sector-card .sec-name{font-family:"ZZZ-thick","SourceHanSans",sans-serif;font-size:.98rem;color:var(--text);line-height:1.2}
  #sector-card .presence{font-size:.7rem;letter-spacing:.06em;margin-top:3px;text-transform:uppercase}
  #sector-card .librow{font-size:.82rem;color:var(--text-dim);margin-top:5px}
  #sector-card .librow b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
  #sector-card .bar{height:4px;border-radius:2px;background:rgba(239,68,68,.75);margin-top:6px;overflow:hidden}
  #sector-card .bar i{display:block;height:100%;background:var(--blue);transition:width .25s ease}
  #sector-card .sub{font-size:.68rem;color:var(--text-mute);margin-top:5px}
  /* 敌军阵营：改为带阵营色的胶囊，取代原先挤在一起、不易读的「敌军：A、B」纯文本 */
  #sector-card .enemy-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  #sector-card .enemy-chip{
    display:inline-flex;align-items:center;gap:4px;font-size:.68rem;line-height:1;
    padding:3px 7px;border-radius:999px;border:1px solid currentColor;
    background:color-mix(in srgb, currentColor 14%, transparent);white-space:nowrap;
  }
  #sector-card .enemy-chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
  /* 无 color-mix 支持时退回半透明底，避免胶囊看不见 */
  @supports not (background: color-mix(in srgb, red 10%, transparent)){
    #sector-card .enemy-chip{background:rgba(255,255,255,.07)}
  }

  /* ---------- 星球效果图标（浮动在地图上方，随地图移动） ---------- */
  #fx-layer{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden}
  .fx-cluster{
    position:absolute;left:0;top:0;display:flex;align-items:center;gap:3px;
    transform:translate(-50%,-50%);will-change:transform;
  }
  .fx-i{
    width:17px;height:17px;display:flex;align-items:center;justify-content:center;
    border-radius:5px;background:rgba(8,11,18,.86);border:1px solid rgba(255,255,255,.28);
    box-shadow:0 1px 5px rgba(0,0,0,.6);pointer-events:auto;
  }
  .fx-i svg{width:12px;height:12px;display:block;fill:currentColor}
  .fx-more{
    font-size:.6rem;line-height:1;padding:3px 4px;border-radius:5px;color:var(--text-dim);
    background:rgba(8,11,18,.86);border:1px solid rgba(255,255,255,.22);
  }
  @media (max-width:767px){ .fx-i{width:15px;height:15px} .fx-i svg{width:10px;height:10px} }

  .card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px}
  aside h2{font-family:"ZZZ-thick","SourceHanSans",sans-serif;font-size:.92rem;color:var(--yellow);display:flex;align-items:center;gap:7px}
  .search{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:var(--radius-s);
    color:var(--text);padding:7px 10px;font-size:.78rem;font-family:inherit;outline:none}
  .search:focus{border-color:var(--blue)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:.73rem;cursor:pointer;
    color:var(--text-dim);background:rgba(255,255,255,.03);user-select:none;transition:.15s;
  }
  .chip:hover{border-color:var(--border-h);color:var(--text)}
  .chip.on{border-color:currentColor;background:rgba(255,255,255,.09);color:var(--text)}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .legend{font-size:.75rem;color:var(--text-dim);line-height:1.95}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .legend .ln{display:inline-block;width:20px;height:0;border-top:2px solid;margin-right:8px;vertical-align:middle}
  .muted{color:var(--text-mute);font-size:.73rem;line-height:1.7}
  #detail .kv{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
  #detail .cell{background:rgba(255,255,255,.035);border-radius:var(--radius-s);padding:6px 9px}
  #detail .cell .k{color:var(--text-mute);font-size:.68rem}
  #detail .cell .v{font-size:.86rem;margin-top:2px}
  #detail .tac{border:1px solid rgba(59,130,246,.6);color:var(--blue);background:rgba(59,130,246,.1);
    border-radius:999px;padding:3px 10px;font-size:.72rem;display:inline-block;margin:3px 4px 0 0}
  #detail .tacTxt{font-size:.74rem;color:var(--text-dim);line-height:1.6;margin-top:6px}
  #hits{max-height:210px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
  #hits .hit{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:.76rem}
  #hits .hit:hover{background:rgba(255,255,255,.07)}
  #hits .hit .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  #hits .hit .own{margin-left:auto;color:var(--text-mute);font-size:.68rem}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}
  /* ---------- 移动端适配 ---------- */
  #aside-toggle{display:none}   /* 桌面用顶栏按钮 */
  @media (max-width:900px){
    aside{width:270px;padding:10px}
    header h1{font-size:.92rem}
    header .stats{display:none}
    #sector-card{left:10px;top:10px;min-width:0;max-width:calc(100% - 20px)}
    #sector-card .ficon{width:30px;height:30px}
  }
  @media (max-width:767px){
    /* 顶栏：只保留标题与侧栏开关 */
    header{padding:8px 10px;gap:8px;flex-wrap:nowrap}
    header .tag,header #btn-reset,header #btn-mode,header .btn.opt{display:none}
    header h1{font-size:.86rem}
    #aside-toggle{display:inline-block}
    /* 侧栏改为右侧抽屉浮层，不占地图宽度 */
    aside{
      position:absolute;top:0;right:0;bottom:0;width:min(82vw,300px);
      box-shadow:-10px 0 30px rgba(0,0,0,.55);z-index:25;
    }
    #aside-rail{width:100%;height:100%;top:0;background:rgba(10,14,26,.55)}
    #aside-rail span{font-size:1.1rem}
    /* 移动端：地图铺满，控件缩小 */
    .maplibregl-ctrl-bottom-right{bottom:8px;right:6px}
    .maplibregl-ctrl-bottom-left{display:none}
    #sector-card{font-size:.92em}
    #tac-empty{font-size:.7rem;left:10px;right:10px}
    #tip{min-width:0;width:206px;max-width:206px;font-size:.72rem;padding:7px 10px}
  }
</style>
</head>
<body>
<header>
  <h1>🌌 银河星图</h1>
  <span class="tag v2">实时战况 · 3D</span>
  <div class="stats" id="hdr"></div>
  <button id="aside-toggle" title="侧栏">☰</button>
  <button id="btn-reset">重置视角</button>
  <button id="btn-mode">视图：银河</button>
  <a class="btn opt" href="./index.html">← 战况面板</a>
  <button id="aside-collapse" title="收起侧栏">▶</button>
</header>

<main>
  <div id="stage">
    <canvas id="stars"></canvas>
    <div id="map"></div>
    <div id="tip"></div>
    <div id="sector-card"></div>
    <div id="fx-layer"></div>
    <div id="boot">
      <div class="ring"></div>
      <div class="msg" id="bootmsg">正在初始化星图…<br><small>加载 MapLibre 与战况数据</small></div>
    </div>
  </div>
  <div id="aside-rail" title="展开侧栏"><span>◀</span></div>

  <aside>
    <h2>🔍 检索</h2>
    <div class="card">
      <input class="search" id="q" type="search" placeholder="输入星球名…（如 CHOOHE / 海尔迈尔）" autocomplete="off">
      <div id="hits" style="margin-top:8px"></div>
    </div>

    <h2>🎛️ 阵营筛选</h2>
    <div class="card"><div class="chips" id="factions"></div></div>

    <h2>🗂️ 图层</h2>
    <div class="card"><div class="chips" id="layers"></div></div>

    <h2 id="detailTitle">📋 星球详情</h2>
    <div class="card" id="detail">
      <div class="muted">点击星图上的任意星球查看详情。<br>滚轮缩放 · 拖拽平移 · 右键拖拽旋转/倾斜。</div>
    </div>

    <h2>📖 图例</h2>
    <div class="card legend">
      <div><i style="background:var(--c-humans)"></i>超级地球</div>
      <div><i style="background:var(--c-terminids)"></i>终结族</div>
      <div><i style="background:var(--c-automaton)"></i>机器人</div>
      <div><i style="background:var(--c-illuminate)"></i>光能族</div>
      <div><span class="ln" style="border-color:rgba(239,68,68,.8)"></span>敌军反攻路线</div>
      <div><i style="border:2px solid var(--blue);background:none"></i>战术目标星球</div>
    </div>
    <div class="muted" id="srcnote"></div>
  </aside>
</main>

<script src="./js/libs/maplibre/maplibre-gl-csp.js"></script>
<script src="./js/tactical.js"></script>
<script>
"use strict";
/* ============================================================================
   银河星图 · MapLibre GL 3D
   ============================================================================ */
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";

const OWNER_COLOR = { Humans:"#5BA3D0", Terminids:"#F5C518", Automaton:"#D6806D", Illuminate:"#CF64F8" };
const OWN_CN     = { Humans:"超级地球", Terminids:"终结族", Automaton:"机器人", Illuminate:"光能族" };
const FACTION_KEYS = ["Humans","Terminids","Automaton","Illuminate"];

/* ------------------------------------------------ wiki 图鉴链接映射 ---- */
// 阵营页（星球无变种效果时按当前归属链接阵营图鉴）
const FACTION_PAGE = { Automaton: "Automatons", Terminids: "Terminids", Illuminate: "Illuminate" };
// 变种效果 effectId -> wiki slug（galactic_effects/effect_id_cn 考据，slug 经 wiki API 验证存在）
const EFFECT_TO_STRAIN = {
  1202: "Jet_Brigade", 1203: "Jet_Brigade", 1239: "Jet_Brigade",
  1243: "Predator_Strain", 1245: "Predator_Strain",
  1244: "Spore_Burst_Strain", 1386: "Spore_Burst_Strain",
  1248: "Incineration_Corps", 1249: "Incineration_Corps",
  1303: "Rupture_Strain", 1310: "Rupture_Strain",
  1360: "Cyborgs", 1361: "Cyborgs",
  1377: "Mindless_Masses", 1378: "Mindless_Masses",
  1379: "Appropriators", 1380: "Appropriators",
  1402: "Vote_Snatchers", 1403: "Vote_Snatchers",
  1269: "The_Great_Host", 1417: "Invasion_Fleet",
};
// 变种归属阵营（链接只在星球当前归属与其一致时显示）
const STRAIN_FACTION = {
  Jet_Brigade: "Automaton", Incineration_Corps: "Automaton", Cyborgs: "Automaton",
  Predator_Strain: "Terminids", Spore_Burst_Strain: "Terminids", Rupture_Strain: "Terminids",
  Mindless_Masses: "Illuminate", Appropriators: "Illuminate", Vote_Snatchers: "Illuminate",
  The_Great_Host: "Illuminate", Invasion_Fleet: "Illuminate",
};
const STRAIN_CN = {
  Jet_Brigade: "喷气旅", Incineration_Corps: "炽灼部队", Cyborgs: "生化人",
  Predator_Strain: "掠食变种", Spore_Burst_Strain: "孢裂变种", Rupture_Strain: "爆裂变种",
  Mindless_Masses: "无脑群氓", Appropriators: "占领者", Vote_Snatchers: "窃票者",
  The_Great_Host: "伟大集群", Invasion_Fleet: "入侵舰队",
};
// 链接规则：变种（且归属一致）> 阵营页 > Super_Earth；无映射返回 null 不渲染，避免死链
function wikiLinkFor(p) {
  const owner = p.currentOwner || "";
  for (const id of (p.activeEffects || [])) {
    const slug = EFFECT_TO_STRAIN[id];
    if (slug && STRAIN_FACTION[slug] === owner) {
      return { url: "https://helldivers.wiki.gg/wiki/" + slug,
               label: "🏷️ " + (STRAIN_CN[slug] || slug.replace(/_/g, " ")) + " · 查看图鉴" };
    }
  }
  if (FACTION_PAGE[owner]) {
    return { url: "https://helldivers.wiki.gg/wiki/" + FACTION_PAGE[owner],
             label: "🏷️ " + (OWN_CN[owner] || owner) + " · 查看图鉴" };
  }
  if (owner === "Humans") {
    return { url: "https://helldivers.wiki.gg/wiki/Super_Earth", label: "🏷️ 超级地球 · 查看图鉴" };
  }
  return null;
}

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmt = (n) => (n || 0).toLocaleString("zh-CN");

/* ---------------------------------------------------------------- 工具 ---- */
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// 并发受限的图片加载（CORS 优先；wiki.gg 若不给 CORS 头则回退纯色圆点）
async function fetchImageBitmap(url, crossOrigin) {
  const img = new Image();
  if (crossOrigin) img.crossOrigin = "anonymous";
  img.referrerPolicy = "no-referrer";
  img.decoding = "async";
  await new Promise((res, rej) => {
    img.onload = () => res();
    img.onerror = () => rej(new Error("load fail"));
    img.src = url;

  catch (_) { return null; }

// 读 PNG 头部取像素尺寸（IHDR 位于固定偏移）。
// 必要性：planet-icons 并非同尺寸 —— 实测 139 个 64px、122 个 48px（另有少数 47~65px）。
// 若统一按 pixelRatio:2 注册，48px 图标在同一 icon-size 下会比 64px 小约 33%，
// 这正是「图标大小与可互动区域不匹配」的根因。改为按各图实际宽度归一化后，
// icon-size 才能与 planet-core 的直径精确对齐。
function pngSizeFromBuffer(buf) {
  const b = new Uint8Array(buf);
  if (b.length < 24) return null;
  if (b[0] !== 0x89 || b[1] !== 0x50 || b[2] !== 0x4e || b[3] !== 0x47) return null;  // \x89PNG
  const w = (b[16] << 24) | (b[17] << 16) | (b[18] << 8) | b[19];
  const h = (b[20] << 24) | (b[21] << 16) | (b[22] << 8) | b[23];
  return (w > 0 && h > 0) ? { w, h } : null;
}

// 载入图标：返回 { image, pixelRatio }，pixelRatio 归一化到 32 CSS px 基准
// （64px → 2，48px → 1.5），使所有图标在同一 icon-size 下视觉尺寸一致。
async function loadPlanetIcon(url) {

    const r = await fetch(url, { cache: "force-cache" });
    if (r.ok) dim = pngSizeFromBuffer(await r.arrayBuffer());
  } catch (_) { /* 读头失败则退回按 64px 假设 */ }
  const img = await loadBitmapWithFallback(url);

async function pool(items, limit, worker) {
  let i = 0, active = 0;
  return new Promise((resolve) => {
    const next = () => {
      if (i >= items.length && active === 0) return resolve();
      while (active < limit && i < items.length) {
        const item = items[i++]; active++;
        Promise.resolve(worker(item)).catch(() => {}).then(() => { active--; next(); });
      }
    };
    next();
  });
}

// 星点/星云生成到一张可平铺贴图，作为 raster 图层挂进地图 —— 随平移/缩放真实移动；
// 屏幕坐标只保留深色底与四周暗角（相机质感），不再画星点。
function paintBackdrop() {
  const cv = $("stars");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth || window.innerWidth;
  const h = cv.clientHeight || window.innerHeight;
  cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#05070C"; g.fillRect(0, 0, w, h);
  const vg = g.createRadialGradient(w/2, h/2, Math.min(w,h)*0.32, w/2, h/2, Math.max(w,h)*0.78);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.55)");
  g.fillStyle = vg; g.fillRect(0, 0, w, h);
}

// 生成无缝星空贴图：星点在边缘处按 3×3 环绕补画，保证平铺无接缝
function makeStarfieldTile(size) {
  const cv = document.createElement("canvas");
  cv.width = size; cv.height = size;
  const g = cv.getContext("2d");
  g.clearRect(0, 0, size, size);                 // 透明底，露出屏幕深色
  const wrap = (fn) => { for (const ox of [-size, 0, size]) for (const oy of [-size, 0, size]) fn(ox, oy); };
  const nebulae = [
    [size*0.30, size*0.34, size*0.45, "rgba(64,88,168,.10)"],
    [size*0.74, size*0.62, size*0.42, "rgba(128,74,168,.085)"],
    [size*0.55, size*0.20, size*0.34, "rgba(40,120,150,.06)"],
  ];
  for (const [x, y, r, col] of nebulae) {
    wrap((ox, oy) => {
      const rg = g.createRadialGradient(x+ox, y+oy, 0, x+ox, y+oy, r);
      rg.addColorStop(0, col); rg.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = rg; g.fillRect(x+ox-r, y+oy-r, r*2, r*2);
    });
  }
  const count = Math.round(size * size / 2600);
  for (let n = 0; n < count; n++) {
    const x = Math.random() * size, y = Math.random() * size;
    const big = Math.random() > 0.985;
    const r = big ? 1.5 + Math.random() * 1.5 : Math.random() * 0.95 + 0.25;
    const a = 0.20 + Math.random() * 0.72;
    const col = big ? `rgba(255,246,220,${a})` : `rgba(226,238,255,${a})`;
    wrap((ox, oy) => {
      g.beginPath(); g.arc(x+ox, y+oy, r, 0, 6.2832);
      g.fillStyle = col; g.fill();
      if (big) {
        g.strokeStyle = `rgba(255,246,220,${a * 0.35})`; g.lineWidth = 0.7;
        const s2 = r * 4.2;
        g.beginPath();
        g.moveTo(x+ox - s2, y+oy); g.lineTo(x+ox + s2, y+oy);
        g.moveTo(x+ox, y+oy - s2); g.lineTo(x+ox, y+oy + s2);
        g.stroke();
      }
    });
  }
  return cv.toDataURL("image/png");
}

// 星区多边形数据缺失，故按「同星区星球坐标 + 向质心外扩」构造近似范围。
function convexHull(pts) {
  if (pts.length < 3) return pts.slice();
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lower = [], upper = [];
  for (const pt of p) { while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], pt) <= 0) lower.pop(); lower.push(pt); }
  for (let i = p.length - 1; i >= 0; i--) { const pt = p[i]; while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], pt) <= 0) upper.pop(); upper.push(pt); }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}
function expandHull(hull, factor) {
  if (!hull.length) return hull;
  const cx = hull.reduce((a, p) => a + p[0], 0) / hull.length;
  const cy = hull.reduce((a, p) => a + p[1], 0) / hull.length;
  return hull.map(([x, y]) => [cx + (x - cx) * factor, cy + (y - cy) * factor]);
}
function ring(coords) { const r = coords.slice(); if (r.length) r.push(r[0]); return r; }

        index: p.index, name: p.name || ("#" + p.index),
        nameCn: PL_CN[String(p.name || "").toUpperCase()] || "",
        owner: p.currentOwner || "None", ownerCn: OWN_CN[p.currentOwner] || (p.currentOwner || "未知"),
        color: OWNER_COLOR[p.currentOwner] || "#64748b",
        sector: p.sector || "", sectorCn: SEC_CN[(p.sector || "").toUpperCase()] || "",
        players: p.players || 0, lib: +libPct.toFixed(1),
        tacCount: tac.length, tacTitle: tac.join(" / "),
        icon: planetIconFile(p.name) || "",
        // 有可显示效果图标（去重后）的星球，供浮动图标层使用
        fx: fxOf(p).length,
        isDef: (data.campaigns || []).some(c => c.campaignType === "defense" && c.planet && c.planet.index === p.index) ? 1 : 0,
        isEvent: (data.planet_events || []).some(e => e.planetIndex === p.index) ? 1 : 0,
      },
    };
  }));

  // 补给线（有向；按速率分级）
  const ownerOf = (i) => (BYIDX[i] ? BYIDX[i].currentOwner : null);
  const posOf = (i) => (BYIDX[i] && BYIDX[i].position) ? BYIDX[i].position : null;
  const atkSet = new Set((data.planet_attacks || []).map(a => a.source + ">" + a.target));
  const supplyFC = fc((() => {
    const out = [];
    for (const k of Object.keys(WP)) {
      const a = posOf(+k); if (!a) continue;
      for (const to of (WP[k] || [])) {
        const b = posOf(+to); if (!b) continue;
        const isAtk = atkSet.has(k + ">" + to);
        out.push({
          type: "Feature",
          geometry: { type: "LineString", coordinates: [[a.x, a.y], [b.x, b.y]] },
          properties: {
            grade: isAtk ? "attack" : "human",
            width: isAtk ? 1.9 : 1.15,
            from: +k, to: +to,
            owner: ownerOf(+k) || "None",
          },
        });
      }
    }
    return out;
  })());

  // 反攻线（用于方向箭头）
  const attackFC = fc((data.planet_attacks || []).map(a => {
    const p1 = posOf(a.source), p2 = posOf(a.target);
    if (!p1 || !p2) return null;
    return { type: "Feature", geometry: { type: "LineString", coordinates: [[p1.x, p1.y], [p2.x, p2.y]] },
             properties: { from: a.source, to: a.target } };
  }).filter(Boolean));

  // 玩家热力（按星球）
  const heatFC = fc(planets.filter(p => (p.players || 0) > 0).map(p => ({
    type: "Feature", geometry: pt(p.position.x, p.position.y),
    properties: { value: Math.min(1, (p.players || 0) / 9000) },
  })));

  // 星区领土（近似凸包）——按星区聚合
  const bySector = {};
  planets.forEach(p => { const s = p.sector || "UNKNOWN"; (bySector[s] = bySector[s] || []).push(p); });
  const sectorFC = fc(Object.entries(bySector)
    .filter(([, list]) => list.length >= 3)
    .map(([name, list]) => ({
      type: "Feature",
      geometry: { type: "Polygon", coordinates: [ring(expandHull(convexHull(list.map(p => [p.position.x, p.position.y])), 1.16))] },
      properties: { name, count: list.length },
    })));

  // 势力领土（近似凸包，仅非我方阵营绘制，作为大色块）
  const factionFC = fc(FACTION_KEYS
    .filter(k => k !== "Humans")
    .map(k => {
      const list = planets.filter(p => p.currentOwner === k);
      if (list.length < 3) return null;
      const hull = expandHull(convexHull(list.map(p => [p.position.x, p.position.y])), 1.20);
      return { type: "Feature", geometry: { type: "Polygon", coordinates: [ring(hull)] },
               properties: { owner: k, color: OWNER_COLOR[k], ownerCn: OWN_CN[k], count: list.length } };
    }).filter(Boolean));

  // 星区中文名（放在星区质心）
  const sectorLabelFC = fc(Object.entries(bySector)
    .filter(([, list]) => list.length >= 3)
    .map(([name, list]) => {
      const cx = list.reduce((a, p) => a + p.position.x, 0) / list.length;
      const cy = list.reduce((a, p) => a + p.position.y, 0) / list.length;
      const idx = SECTOR_IDX[name] || {};
      return { type: "Feature", geometry: pt(cx, cy),
               properties: { text: idx.cn || name, n: list.length } };
    }));

  // 势力名（放在该阵营凸包质心，沿地图旋转）
  // 大字用中文：译名取自既有术语库 OWN_CN（与 HD2_Wiki/data/wiki/zh/factions.json 的 name_zh 同源）
  const factionLabelFC = fc(FACTION_KEYS.map(k => {
    const list = planets.filter(p => p.currentOwner === k);
    if (!list.length) return null;
    const cx = list.reduce((a, p) => a + p.position.x, 0) / list.length;
    const cy = list.reduce((a, p) => a + p.position.y, 0) / list.length;
    return { type: "Feature", geometry: pt(cx, cy),
             properties: { text: OWN_CN[k] || k, color: OWNER_COLOR[k], owner: k, n: list.length } };
  }).filter(Boolean));

  // 节点玩家数分级表达式（planet-core 半径用；0→0，12000→1）
  const PLAYER_T = ["interpolate", ["linear"], ["coalesce", ["get", "players"], 0],
    0, 0, 800, .22, 2500, .45, 6000, .75, 12000, 1];
  const resolvePlayersExpr = (tree) => JSON.parse(JSON.stringify(tree).replaceAll('["interp-players"]', JSON.stringify(PLAYER_T)));

  // 战术空态：无任何战术目标时明确提示（避免误以为功能坏了）
  if (!Object.keys(TACBY).length && !$("tac-empty")) {
    const n = document.createElement("div");
    n.id = "tac-empty";
    n.innerHTML = "📭 当前无战术目标 —— 星图拓扑暂未形成可围攻局面，解放推进后自动出现";
    $("stage").appendChild(n);
  }

  // ---- 4) 顶栏统计 ----
  const owners = {};
  planets.forEach(p => { owners[p.currentOwner] = (owners[p.currentOwner] || 0) + 1; });
  $("hdr").innerHTML =
    `<span><b>星球</b> ${planets.length}</span>` +
    FACTION_KEYS.map(k => `<span style="color:${OWNER_COLOR[k]}">${OWN_CN[k]} ${owners[k] || 0}</span>`).join("") +
    `<span style="color:var(--blue)"><b>战术目标</b> ${Object.keys(TACBY).length}</span>` +
    `<span style="color:#E74C3C"><b>反攻</b> ${(data.planet_attacks || []).length}</span>` +
    `<span><b>更新</b> ${(data.fetchedAt || "").slice(5, 16).replace("T", " ")}</span>`;

  // ---- 5) 地图 ----
  setMsg("正在构建星图图层…<br><small>MapLibre GL · WebGL</small>");
  maplibregl.setWorkerUrl("./js/libs/maplibre/maplibre-gl-csp-worker.js");

  MAP = new maplibregl.Map({
    container: "map",
    // CJK（汉字/假名/谚文）由 MapLibre 用 canvas 2D + TinySDF 本地取字形，
    // 不请求字形 PBF —— 因此中文字形无需下载，复用上面的 @font-face 思源黑体。
    // 拉丁字符仍走 glyphs PBF（仅 3 个区间，共 ~238 KB）。
    localIdeographFontFamily: "'SourceHanSans','Microsoft YaHei','PingFang SC',sans-serif",
    style: {
      version: 8,
      name: "hd2-galaxy",
      glyphs: "./js/libs/maplibre/fonts/{fontstack}/{range}.pbf",
      sources: {
        planets:    { type: "geojson", data: planetFC },
        supply:     { type: "geojson", data: supplyFC, lineMetrics: true },
        attack:     { type: "geojson", data: attackFC },
        sector:     { type: "geojson", data: sectorFC },
        faction:    { type: "geojson", data: factionFC },
        flabel:     { type: "geojson", data: factionLabelFC },
        slabel:     { type: "geojson", data: sectorLabelFC },
        heat:       { type: "geojson", data: heatFC },
      },
      layers: [
        // 背景交给 CSS 星空，不在此处填色
        { id: "bg", type: "background", paint: { "background-color": "rgba(0,0,0,0)" } },

        // 星区（细虚线，弱）
        { id: "sector-fill", type: "fill", source: "sector",
          paint: { "fill-color": "rgba(255,255,255,.014)" } },
        { id: "sector-line", type: "line", source: "sector",
          paint: { "line-color": "rgba(255,255,255,.10)", "line-width": .8, "line-dasharray": [4, 4] } },

        // 势力领土（大色块）
        { id: "faction-fill", type: "fill", source: "faction",
          paint: { "fill-color": ["get", "color"], "fill-opacity": .085 } },
        { id: "faction-line", type: "line", source: "faction",
          paint: { "line-color": ["get", "color"], "line-width": 1.1, "line-opacity": .45 } },

        // 玩家热力（默认关）
        { id: "heat", type: "heatmap", source: "heat", layout: { visibility: "none" },
          paint: {
            "heatmap-weight": ["get", "value"],
            "heatmap-intensity": .9,
            "heatmap-radius": ["interpolate", ["linear"], ["zoom"], 4, 12, 8, 30, 12, 60],
            "heatmap-opacity": .55,
            "heatmap-color": ["interpolate", ["linear"], ["heatmap-density"],
              0, "rgba(0,0,0,0)", .2, "rgba(245,197,24,.25)", .5, "rgba(245,140,24,.5)",
              .8, "rgba(239,68,68,.7)", 1, "rgba(239,68,68,.9)"],
          } },

        // 补给线：渐变（我方蓝 -> 敌方阵营色）
        { id: "supply", type: "line", source: "supply",
          filter: ["==", ["get", "grade"], "human"],
          layout: { "line-cap": "round", "line-join": "round" },
          paint: {
            "line-width": ["interpolate", ["linear"], ["zoom"], 4, ["*", ["get", "width"], .5], 9, ["get", "width"], 13, ["*", ["get", "width"], 2.4]],
            "line-opacity": .42,
            "line-gradient": ["interpolate", ["linear"], ["line-progress"],
              0, "rgba(91,163,208,.55)", 1, "rgba(207,100,248,.75)"],
          } },

        // 补给线流光（细亮虚线叠加，相位动画在 load 后驱动）
        { id: "supply-flow", type: "line", source: "supply",
          filter: ["==", ["get", "grade"], "human"],
          layout: { "line-cap": "round" },
          paint: {
            "line-width": ["interpolate", ["linear"], ["zoom"], 4, .8, 9, 1.4, 13, 3],
            "line-color": "rgba(150,205,255,.55)",
            "line-dasharray": [0, 4, 3],
          } },

        // 反攻线：红色虚线
        { id: "attack-line", type: "line", source: "attack",
          layout: { "line-cap": "butt" },
          paint: {
            "line-color": "rgba(239,68,68,.85)",
            "line-width": ["interpolate", ["linear"], ["zoom"], 4, 1.2, 9, 2.2, 13, 4],
            "line-dasharray": [2, 1.6],
            "line-opacity": .8,
          } },

        // 节点投影（map 对齐 + 微下移，营造悬浮立体感）
        { id: "planet-shadow", type: "circle", source: "planets",
          paint: {
            "circle-pitch-alignment": "map",
            "circle-translate": [0, 1.6],
            "circle-color": "rgba(0,0,0,.5)",
            "circle-blur": .8,
            "circle-radius": ["interpolate", ["linear"], ["zoom"], 4, 2.6, 9, 6.4, 13, 15.5],
          } },

        // 星球外发光（外层宽晕）
        { id: "planet-glow", type: "circle", source: "planets",
          paint: {
            "circle-color": ["get", "color"],
            "circle-blur": 1,
            "circle-opacity": ["interpolate", ["linear"], ["zoom"], 4, .14, 9, .26, 13, .38],
            "circle-radius": ["interpolate", ["linear"], ["zoom"], 4, 4.2, 9, 10.5, 13, 26],
          } },

        // 星球内发光（紧贴本体的亮晕，分层立体）
        { id: "planet-glow-in", type: "circle", source: "planets",
          paint: {
            "circle-color": ["get", "color"],
            "circle-blur": .5,
            "circle-opacity": ["interpolate", ["linear"], ["zoom"], 4, .2, 9, .34, 13, .5],
            "circle-radius": ["interpolate", ["linear"], ["zoom"], 4, 2.8, 9, 6.8, 13, 16],
          } },

        // 星球本体（半径按在线玩家数分级：0 → 基准，12000 → 玩家权重放大）
        // 半径 = 交互命中半径（MapLibre 的 circle 命中即该半径 + 描边/2 + clickTolerance），
        // 故 icon-size 一律按本层半径换算，改这里即可同时放大图标与 hover 区。
        { id: "planet-core", type: "circle", source: "planets",
          paint: {
            "circle-color": ["get", "color"],
            "circle-radius": ["interpolate", ["linear"], ["zoom"],
              4, ["+", 4.4, ["*", 1.76, ["interp-players"]]],
              9, ["+", 10.12, ["*", 3.96, ["interp-players"]]],
              13, ["+", 24.2, ["*", 8.8, ["interp-players"]]]],
            "circle-stroke-color": "rgba(0,0,0,.55)",
            "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 4, .6, 9, 1.2, 13, 1.8],
          } },

        // 高人气星白环（玩家数 ≥ 2500）
        { id: "planet-hot", type: "circle", source: "planets",
          filter: [">", ["coalesce", ["get", "players"], 0], 2499],
          paint: {
            "circle-color": "rgba(0,0,0,0)",
            "circle-radius": ["interpolate", ["linear"], ["zoom"], 4, 4.5, 9, 9.5, 13, 27],
            "circle-stroke-color": "rgba(255,255,255,.45)",
            "circle-stroke-width": 1,
          } },

        // 防御战红环
        { id: "planet-def", type: "circle", source: "planets",
          filter: ["==", ["get", "isDef"], 1],
          paint: {
            "circle-color": "rgba(0,0,0,0)",
            "circle-radius": ["interpolate", ["linear"], ["zoom"], 4, 5.5, 9, 11, 13, 28],
            "circle-stroke-color": "rgba(239,68,68,.85)",
            "circle-stroke-width": 1.4,
          } },

        // 战术目标蓝环
        { id: "planet-tac", type: "circle", source: "planets",
          filter: [">", ["get", "tacCount"], 0],
          paint: {
            "circle-color": "rgba(0,0,0,0)",
            "circle-radius": ["interpolate", ["linear"], ["zoom"], 4, 6.5, 9, 12.5, 13, 30],
            "circle-stroke-color": "rgba(59,130,246,.9)",
            "circle-stroke-width": 1.5,
          } },

        // 活动事件黄环
        { id: "planet-event", type: "circle", source: "planets",
          filter: ["==", ["get", "isEvent"], 1],
          paint: {
            "circle-color": "rgba(0,0,0,0)",
            "circle-radius": ["interpolate", ["linear"], ["zoom"], 4, 7.5, 9, 14, 13, 33],
            "circle-stroke-color": "rgba(245,197,24,.9)",
            "circle-stroke-width": 1.3,
            "circle-stroke-opacity": .85,
          } },

        // 图标大小 = 星球本体直径（PNG 经 pixelRatio 归一化到 32px 基准，故 size = 半径/16），
        // 使图标与 hover/点击区严格一致；想整体缩放图标，只改 planet-core 的半径即可。
        { id: "planet-icon", type: "symbol", source: "planets",
          layout: {
            "icon-image": ["get", "icon"],
            "icon-size": ["interpolate", ["linear"], ["zoom"],
              4,  ["+", 0.275, ["*", 0.11, ["interp-players"]]],
              9,  ["+", 0.6325, ["*", 0.2475, ["interp-players"]]],
              13, ["+", 1.5125, ["*", 0.55, ["interp-players"]]]],
            "icon-allow-overlap": true,
            "icon-ignore-placement": true,
            "icon-anchor": "center",
            "icon-padding": 0,
          } },

        // 星球名标签（缩放到一定级别才显示）
        { id: "planet-label", type: "symbol", source: "planets",
          minzoom: 8.2,
          layout: {
            "text-field": ["coalesce", ["get", "nameCn"], ["get", "name"]],
            "text-font": ["NotoSansRegular"],
            "text-size": ["interpolate", ["linear"], ["zoom"], 8.2, 10, 11, 12, 13, 14.5],
            "text-anchor": "top",
            "text-offset": [0, 1.1],
            "text-allow-overlap": false,
            "text-optional": true,
            "text-padding": 3,
          },
          paint: { "text-color": "rgba(226,232,240,.92)", "text-halo-color": "rgba(0,0,0,.85)", "text-halo-width": 1.3 } },

        // 星区中文名（缩放到一定级别显示）
        { id: "sector-label", type: "symbol", source: "slabel",
          minzoom: 6.6,
          layout: {
            "text-field": ["get", "text"],
            "text-font": ["NotoSansRegular"],
            "text-size": ["interpolate", ["linear"], ["zoom"], 6.6, 11, 9, 15, 13, 24],
            "text-letter-spacing": .12,
            "text-allow-overlap": true,
            "text-ignore-placement": true,
          },
          paint: { "text-color": "rgba(226,232,240,.5)", "text-halo-color": "rgba(0,0,0,.6)", "text-halo-width": 1.1 } },

        // 势力名（沿地图旋转）
        { id: "flabel", type: "symbol", source: "flabel",
          layout: {
            "text-field": ["get", "text"],
            "text-font": ["NotoSansRegular"],
            "text-size": ["interpolate", ["linear"], ["zoom"], 4, 13, 9, 23, 13, 52],
            "text-rotate": 0,
            "text-pitch-alignment": "map",
            "text-rotation-alignment": "map",
            "text-allow-overlap": true,
            "text-ignore-placement": true,
            "text-letter-spacing": .06,
          },
          paint: { "text-color": ["get", "color"], "text-opacity": .38, "text-halo-color": "rgba(0,0,0,.5)", "text-halo-width": 1.4 } },

        // 反攻方向箭头
        { id: "attack-arrow", type: "symbol", source: "attack",
          minzoom: 7.2,
          layout: {
            "symbol-placement": "line-center",
            "icon-image": "arrow-head",
            "icon-size": ["interpolate", ["linear"], ["zoom"], 7, .5, 12, 1.3],
            "icon-allow-overlap": true,
            "icon-ignore-placement": true,
          } },
      // 统一解析 ["interp-players"] 占位符：凡 layout/paint 用到它的图层都替换为真实表达式。
      // 原先只对 planet-core 硬编码处理，新增图层（planet-icon 的 icon-size）复用该占位符后
      // 会残留未知表达式，MapLibre 判该属性非法 → 图层加载失败、map 的 load 事件永不触发，
      // 页面就永久停在「正在构建星图图层…」。改为遍历所有图层，杜绝同类问题。
      ].map((l) => {
        const out = { ...l };
        for (const key of ["paint", "layout"]) {
          if (!out[key]) continue;
          if (JSON.stringify(out[key]).includes('["interp-players"]')) out[key] = resolvePlayersExpr(out[key]);
        }
        return out;
      }),
    },
    center: HOME.center,
    zoom: HOME.zoom,
    pitch: HOME.pitch,
    bearing: HOME.bearing,
    minZoom: 3.2,
    maxZoom: 15,
    maxPitch: 70,
    minPitch: 0,
    maxBounds: [[-1.9, -1.7], [1.9, 1.75]],
    // 交互命中留白默认 3px（CSS px），会让可点区域明显大于可见星球；
    // 收窄到 1px，使点击/hover 判定贴近实际图标范围。
    clickTolerance: 1,
    dragRotate: true,
    pitchWithRotate: true,
    attributionControl: false,
    antialias: true,
    renderWorldCopies: false,
    fadeDuration: 120,
  });

  MAP.addControl(new maplibregl.NavigationControl({ visualizePitch: true, showCompass: true }), "bottom-right");
  MAP.addControl(new maplibregl.ScaleControl({ maxWidth: 90, unit: "metric" }), "bottom-left");

  MAP.on("error", (e) => { if (e && e.error) console.warn("[MapLibre]", e.error.message || e.error); });

  // 加载兜底：map 的 load 事件若因样式/资源问题永不触发，页面会永久停在加载遮罩上
  // （2026-09 曾因 planet-icon 残留未解析的 ["interp-players"] 表达式而整页卡死）。
  // 这里加超时保护，把失败暴露出来而不是静默卡住。
  let mapLoaded = false;
  const loadGuard = setTimeout(() => {
    if (mapLoaded) return;
    const b = $("boot");
    if (!b) return;
    b.innerHTML = '<div class="msg" style="color:#f59e0b">⚠️ 星图加载超时<br>' +
      '<small>图层样式可能未通过校验，请查看控制台（[MapLibre] 前缀）后刷新重试</small></div>';
    console.error("[星图] map load 事件超时未触发 —— 请检查图层样式表达式是否合法");
  }, 25000);

  MAP.on("load", async () => {
    mapLoaded = true; clearTimeout(loadGuard);
    // 反攻箭头图标（SDF，可着色）
    try {
      const HEAD = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">' +
        '<path d="M2 3 L16 9 L2 15 L5.5 9 Z" fill="#fff"/></svg>';
      const img = new Image();
      img.referrerPolicy = "no-referrer";
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(HEAD);
      await new Promise((res) => { img.onload = res; img.onerror = res; });
      if (img.width) MAP.addImage("arrow-head", img, { sdf: true });
    } catch (_) {}
    try { MAP.setPaintProperty("attack-arrow", "icon-color", "rgba(255,120,120,.95)"); } catch (_) {}

    // 星空贴图：raster 图层挂在最底层，随地图平移/缩放真实移动（真视差）
    try {
      MAP.addSource("stars-src", {
        type: "image",
        url: makeStarfieldTile(2048),
        coordinates: [[-2.6, 2.6], [2.6, 2.6], [2.6, -2.6], [-2.6, -2.6]],
      });
      MAP.addLayer({ id: "stars-raster", type: "raster", source: "stars-src",
        paint: { "raster-opacity": 1, "raster-resampling": "linear", "raster-fade-duration": 0 } }, "bg");
    } catch (e) { console.warn("[星空] raster 挂载失败", e); }

    // 预载星球图标（本地 planet-icons 缓存）
    const files = [...new Set(planetFC.features.map(f => f.properties.icon).filter(Boolean))];
    let ok = 0, bad = 0;                       // 声明在 if 之外：下方提示需要读取
    if (files.length) {
      setMsg("正在加载星球图标…<br><small>本地 planet-icons · " + files.length + " 个</small>");
      await pool(files, 6, async (file) => {
        // 同源：无 CORS/纹理污染问题；pixelRatio 按各图实际宽度归一化
        const res = await loadPlanetIcon(ICON_DIR + file);
        if (!res) { bad++; return; }
        try { if (!MAP.hasImage(file)) MAP.addImage(file, res.image, { pixelRatio: res.pixelRatio }); ok++; }
        catch (_) { bad++; }
      });
      $("srcnote").innerHTML =
        "图标：wiki.gg 命中 <b>" + ok + "</b> / 缺 <b>" + bad + "</b>（本地缓存，缺失的以纯色圆点显示）" +
        "<br>星球图标 © <a href='https://helldivers.wiki.gg/' target='_blank' rel='noopener noreferrer' style='color:var(--blue)'>helldivers.wiki.gg</a>（CC BY-NC-SA 4.0）";
      console.info("[图标] 命中", ok, "缺失", bad, "共", files.length);
    } else {
      $("srcnote").textContent = "图标：未启用（纯色圆点渲染）";
    }

    // 补给线流光动画（等长相位 ping-pong，~9fps 足够顺滑且省电）
    const FLOW = [[0, 4, 3], [1, 3, 3], [2, 2, 3], [3, 1, 3], [4, 0, 3], [3, 1, 3], [2, 2, 3], [1, 3, 3]];
    let flowIdx = 0;
    if (window._flowTimer) clearInterval(window._flowTimer);
    window._flowTimer = setInterval(() => {
      if (!MAP.getLayer("supply-flow") || !LAYER_ON.supply) return;
      flowIdx = (flowIdx + 1) % FLOW.length;
      try { MAP.setPaintProperty("supply-flow", "line-dasharray", FLOW[flowIdx]); } catch (_) {}
    }, 110);

    $("boot").classList.add("gone");
    setTimeout(() => { const b = $("boot"); if (b) b.style.display = "none"; }, 600);

    initFXLayer(planetFC);
  });

  /* ---- 星球效果图标浮层 ----
     把势力变种 / SEAF / DSS 等效果以小图标显示在星球旁边（参考 companion）。
     实现方式：HTML 浮层 + map.project() 投影，而不是 MapLibre symbol 图层 ——
     因为一个星球可能同时有多个效果，而 symbol 每要素只支持一个 icon-image。 */
  function initFXLayer(planetFC) {
    const fx = [];
    for (const f of planetFC.features) {
      const p = BYIDX[f.properties.index];
      if (!p) continue;
      const list = fxOf(p);
      if (list.length && p.position) fx.push({ idx: f.properties.index, list });
    }
    if (!fx.length) { $("srcnote").innerHTML += "<br>效果图标：当前战局无带图标的效果"; return; }
    const host = $("fx-layer");
    host.innerHTML = "";
    const nodes = fx.map(item => {
      const el = document.createElement("div");
      el.className = "fx-cluster";
      el.innerHTML = item.list.slice(0, 3).map(e =>
        `<div class="fx-i" style="color:${e.color}" title="${esc(e.cn)}"></div>`).join("") +
        (item.list.length > 3 ? `<div class="fx-more">+${item.list.length - 3}</div>` : "");
      host.appendChild(el);
      return {
        idx: item.idx, el,
        n: Math.min(3, item.list.length) + (item.list.length > 3 ? 1 : 0),
        list: item.list,
      };
    });
    // 异步填充 SVG（按文件缓存；缺图项保持空框，不显示错误）
    (async () => {
      const files = [...new Set(fx.flatMap(x => x.list.map(e => e.icon)))];
      for (const f of files) await effectIconSVG(f);
      nodes.forEach(nd => {
        const slots = nd.el.querySelectorAll(".fx-i");
        nd.list.slice(0, 3).forEach((e, i) => {
          const svg = __fxsvg[e.icon];
          if (slots[i] && svg) slots[i].innerHTML = svg;
        });
      });
    })();

    // 位置同步：每帧重算屏幕坐标（星球少、元素少，成本可忽略）
    let rafId = 0, visible = true, lastZoom = MAP.getZoom();
    const MINZ = 7.6, GAP = 21;
    function sync() {
      rafId = 0;
      const z = MAP.getZoom();
      const on = z >= MINZ;
      if (on !== visible) { host.style.display = on ? "" : "none"; visible = on; }
      if (!on) return;
      for (const nd of nodes) {
        const p = BYIDX[nd.idx];
        if (!p || !p.position) continue;
        const pt = MAP.project([p.position.x, p.position.y]);
        // 图标排在星球右侧：整体右移，使簇的中心落在星球右侧
        nd.el.style.transform = `translate(${(pt.x + GAP * nd.n / 2).toFixed(1)}px,${pt.y.toFixed(1)}px) translate(-50%,-50%)`;
      }
    }
    function schedule() { if (!rafId) rafId = requestAnimationFrame(sync); }
    MAP.on("move", schedule);
    MAP.on("zoom", schedule);
    MAP.on("resize", schedule);
    MAP.on("moveend", schedule);
    schedule();
  }

  bindUI(data, planets);
}

/* -------------------------------------------------------------- UI 交互 ---- */
function bindUI(data, planets) {
  const CIRCLED = (n) => Math.max(0, Math.min(255, Math.round(n)));
  const colorOf = (owner) => OWNER_COLOR[owner] || "#64748b";

  // 阵营筛选
  $("factions").innerHTML = FACTION_KEYS.map(k =>
    `<span class="chip on" data-f="${k}" style="color:${OWNER_COLOR[k]}">` +
    `<span class="dot" style="background:${OWNER_COLOR[k]}"></span>${OWN_CN[k]}</span>`).join("");
  $("factions").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip"); if (!chip) return;
    const k = chip.dataset.f;
    if (ACTIVE_FACTIONS.has(k)) { if (ACTIVE_FACTIONS.size === 1) return; ACTIVE_FACTIONS.delete(k); chip.classList.remove("on"); }
    else { ACTIVE_FACTIONS.add(k); chip.classList.add("on"); }
    applyFactionFilter();
  });

  // 图层开关
  const LAYER_LABEL = { territory:"领土/星区", supply:"补给线", attack:"反攻线", icons:"星球图标", heat:"玩家热力", labels:"星球名" };
  $("layers").innerHTML = Object.keys(LAYER_ON).map(k =>
    `<span class="chip${LAYER_ON[k] ? " on" : ""}" data-l="${k}">${LAYER_LABEL[k]}</span>`).join("");
  $("layers").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip"); if (!chip) return;
    const k = chip.dataset.l;
    LAYER_ON[k] = !LAYER_ON[k];
    chip.classList.toggle("on", LAYER_ON[k]);
    applyLayerToggles();
  });

  // 视图模式
  const MODES = [
    ["galaxy",   "银河"],
    ["tactical", "战术"],
    ["region",   "区域"],
  ];
  let mi = 0;
  $("btn-mode").addEventListener("click", () => {
    mi = (mi + 1) % MODES.length;
    VIEW_MODE = MODES[mi][0];
    $("btn-mode").textContent = "视图：" + MODES[mi][1];
    applyViewMode();
  });

  $("btn-reset").addEventListener("click", () => {
    MAP.easeTo({ center: HOME.center, zoom: HOME.zoom, pitch: HOME.pitch, bearing: HOME.bearing, duration: 700 });
  });

  // 检索
  const q = $("q");
  const allNames = planets.map(p => ({ index: p.index, name: p.name || ("#" + p.index),
    nameCn: PL_CN[String(p.name || "").toUpperCase()] || "",
    owner: p.currentOwner, sector: p.sector || "", sectorCn: SEC_CN[(p.sector || "").toUpperCase()] || "",
    lib: p.maxHealth > 0 ? (1 - p.health / p.maxHealth) * 100 : 0 }));
  let hitsTimer = null;
  q.addEventListener("input", () => { clearTimeout(hitsTimer); hitsTimer = setTimeout(renderHits, 130); });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") performSearch(q.value.trim()); });

  function renderHits() {
    const term = q.value.trim().toUpperCase();
    const box = $("hits");
    if (!term) { box.innerHTML = ""; return; }
    const list = allNames.filter(p =>
      p.name.toUpperCase().includes(term) ||
      (p.nameCn && p.nameCn.includes(q.value.trim())) ||
      (p.sector || "").toUpperCase().includes(term) ||
      (p.sectorCn && p.sectorCn.includes(q.value.trim()))).slice(0, 40);
    if (!list.length) { box.innerHTML = '<div class="muted" style="padding:4px 8px">无匹配</div>'; return; }
    box.innerHTML = list.map(p =>
      `<div class="hit" data-i="${p.index}"><span class="dot" style="background:${colorOf(p.owner)}"></span>` +
      `<span>${esc(p.nameCn || p.name)}</span><span class="own">${OWN_CN[p.owner] || p.owner || ""} · ${p.lib.toFixed(0)}%</span></div>`).join("");
  }
  function performSearch(term) {
    if (!term) return;
    const p = allNames.find(x => x.name.toUpperCase() === term.toUpperCase())
           || allNames.find(x => x.name.toUpperCase().includes(term.toUpperCase()));
    if (p) focusPlanet(p.index);
  }
  $("hits").addEventListener("click", (e) => {
    const h = e.target.closest(".hit"); if (!h) return;
    focusPlanet(+h.dataset.i);
  });

  function focusPlanet(index) {
    const p = BYIDX[index]; if (!p || !p.position) return;
    MAP.flyTo({ center: [p.position.x, p.position.y], zoom: Math.max(MAP.getZoom(), 10.4), pitch: 46, duration: 900 });
    showDetail(index);
  }
  window.__focusPlanet = focusPlanet;

  // hover tooltip
  const tip = $("tip");
  MAP.on("mousemove", "planet-core", (e) => {
    const f = e.features && e.features[0]; if (!f) return;
    const pr = f.properties;
    tip.innerHTML =
      `<div class="n">${esc(pr.nameCn || pr.name)}${pr.nameCn ? ` <small style="color:var(--text-mute)">${esc(pr.name)}</small>` : ""}</div>` +
      `<div class="r">星区：<span>${esc(pr.sectorCn || pr.sector || "—")}</span></div>` +
      `<div class="r">归属：<span>${esc(pr.ownerCn)}</span></div>` +
      `<div class="r">解放度：<span>${pr.lib}%</span> · 玩家 <span>${fmt(pr.players)}</span></div>` +
      (pr.tacCount ? `<div class="r" style="color:#60a5fa">⚡ ${esc(pr.tacTitle)}</div>` : "") +
      `<div class="bar"><i style="width:${pr.lib}%"></i></div>`;
    tip.style.display = "block";
    const st = $("stage").getBoundingClientRect();
    const mob = window.matchMedia("(max-width:767px)").matches;
    let x, y;
    if (mob) {
      // 移动端跟随手指，并避开左上角星区卡
      x = Math.max(6, Math.min(st.width - 215, e.originalEvent.clientX - st.left - 102));
      y = Math.max(96, e.originalEvent.clientY - st.top + 18);
    } else {
      x = e.originalEvent.clientX - st.left + 15;
      y = e.originalEvent.clientY - st.top + 15;
      if (x + 265 > st.width) x = e.originalEvent.clientX - st.left - 275;
      if (y + 110 > st.height) y = e.originalEvent.clientY - st.top - 120;
    }
    tip.style.left = x + "px"; tip.style.top = y + "px";
    MAP.getCanvas().style.cursor = "pointer";
    showSectorCard(pr.sector);
  });
  MAP.on("mouseleave", "planet-core", () => {
    tip.style.display = "none"; MAP.getCanvas().style.cursor = ""; hideSectorCard();
  });
  MAP.getCanvas().addEventListener("mouseleave", hideSectorCard);

  /* ---- 左上角星区卡：星区名 / 占领方 / 总解放度 / 阵营图标 ---- */
  let secToken = 0;
  function hideSectorCard() { secToken++; $("sector-card").classList.remove("on"); }
  async function showSectorCard(sector) {
    const s = SECTOR_IDX[sector];
    if (!s) { hideSectorCard(); return; }
    const my = ++secToken, el = $("sector-card");
    const dominant = s.owner || "Humans";
    const color = OWNER_COLOR[dominant] || "#94a3b8";
    el.innerHTML =
      `<div class="ficon" style="color:${color}"></div>` +
      `<div style="flex:1;min-width:0">` +
        `<div class="sec-name">${esc(s.cn || sector)}</div>` +
        `<div class="presence" style="color:${color}">` +
          (s.owner ? `${esc(OWN_CN[s.owner] || s.owner)} 控制` : "交战区 · 多阵营") + `</div>` +
        `<div class="librow">总解放度 <b>${s.lib.toFixed(2)}%</b></div>` +
        `<div class="bar"><i style="width:${Math.max(0, Math.min(100, s.lib)).toFixed(2)}%"></i></div>` +
        `<div class="sub">${s.planets} 个星球</div>` +
        (s.races.length
          ? `<div class="enemy-row">` + s.races.map(r =>
              `<span class="enemy-chip" style="color:${colorOf(r)}">` +
                `<i class="dot"></i>${esc(OWN_CN[r] || r)}</span>`).join("") + `</div>`
          : "") +
      `</div>`;
    el.classList.add("on");
    const svg = await factionIconSVG(dominant);
    if (my !== secToken) return;                       // 已移开或切换到别的星区
    const slot = el.querySelector(".ficon");
    if (slot && svg) slot.innerHTML = svg;             // 失败则退化为空槽（仍保留文字信息）
  }

  // 点击详情
  MAP.on("click", "planet-core", (e) => {
    const f = e.features && e.features[0];
    if (f) { showDetail(f.properties.index); showSectorCard(f.properties.sector); }
  });

  function showDetail(index) {
    const p = BYIDX[index]; if (!p) return;
    const lib = p.maxHealth > 0 ? ((1 - p.health / p.maxHealth) * 100).toFixed(2) : "—";
    const tags = TACBY[index] || [];
    const campaigns = (data.campaigns || []).filter(c => c.planet && c.planet.index === index);
    const camp = campaigns[0];
    const ev = (data.planet_events || []).find(x => x.planetIndex === index);
    const pCn = PL_CN[String(p.name || "").toUpperCase()] || "";
    const pSec = SEC_CN[(p.sector || "").toUpperCase()] || "";
    // 标题栏保持固定文案（面板标签），星球名只在下方正文出现一次，避免重复显示
    $("detailTitle").textContent = "📋 星球详情";
    $("detail").innerHTML =
      `<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
         <span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${colorOf(p.currentOwner)};flex-shrink:0"></span>
         <b style="font-size:.95rem">${esc(pCn || p.name || ("#" + index))}</b>
         ${pCn && p.name ? `<span style="color:var(--text-mute);font-size:.72rem">${esc(p.name)}</span>` : ""}
       </div>` +
      `<div class="kv">
         <div class="cell"><div class="k">归属</div><div class="v">${esc(OWN_CN[p.currentOwner] || p.currentOwner || "—")}</div></div>
         <div class="cell"><div class="k">解放度</div><div class="v">${lib}%</div></div>
         <div class="cell"><div class="k">在线玩家</div><div class="v">${fmt(p.players)}</div></div>
         <div class="cell"><div class="k">星区</div><div class="v">${esc(pSec || p.sector || "—")}</div></div>
         <div class="cell"><div class="k">抵抗值</div><div class="v">${p.resistance != null ? p.resistance : "—"}</div></div>
         <div class="cell"><div class="k">索引</div><div class="v">${p.index}</div></div>
       </div>` +
      (camp ? `<div style="margin-top:9px"><span class="tac">${camp.campaignType === "defense" ? "防御战役" : "解放战役"}</span>` +
              `<span class="tac">${OWN_CN[camp.faction] || camp.faction || ""}</span></div>` : "") +
      (ev ? `<div style="margin-top:9px"><span class="tac" style="border-color:rgba(245,197,24,.6);color:var(--yellow);background:rgba(245,197,24,.1)">活动事件</span>` +
            `<div class="tacTxt">进度 ${(ev.maxHealth > 0 ? (1 - ev.health / ev.maxHealth) * 100 : 0).toFixed(1)}%</div></div>` : "") +
      (tags.length ? `<div style="margin-top:9px">` + tags.map(t =>
          `<span class="tac">${esc(t.title)}</span>`).join("") +
          tags.map(t => `<div class="tacTxt">${esc(t.text)}</div>`).join("") + `</div>` : "") +
      (() => { const wl = wikiLinkFor(p); return wl ?
          `<div style="margin-top:9px"><a class="btn" style="width:100%;font-size:.74rem;text-align:center;display:block;text-decoration:none" href="${esc(wl.url)}" target="_blank" rel="noopener noreferrer">${esc(wl.label)}</a></div>` : ""; })() +
      `<div style="margin-top:10px"><button class="btn" style="width:100%;font-size:.74rem" onclick="window.__focusPlanet(${index})">🎯 聚焦到该星球</button></div>`;
  }

  /* ---- 筛选 / 图层 / 视图 的实际生效 ---- */
  function ownerFilterExpr() {
    const list = [...ACTIVE_FACTIONS];
    return ["in", ["get", "owner"], ["literal", list]];
  }
  function setLayerVis(id, on) {
    try { MAP.setLayoutProperty(id, "visibility", on ? "visible" : "none"); } catch (_) {}
  }
  function applyFactionFilter() {
    const f = ownerFilterExpr();
    for (const id of ["planet-shadow", "planet-glow", "planet-glow-in", "planet-core", "planet-hot", "planet-def", "planet-tac", "planet-event", "planet-icon", "planet-label"]) {
      try { MAP.setFilter(id, id === "planet-def" ? ["all", f, ["==", ["get", "isDef"], 1]]
                        : id === "planet-tac" ? ["all", f, [">", ["get", "tacCount"], 0]]
                        : id === "planet-event" ? ["all", f, ["==", ["get", "isEvent"], 1]]
                        : f); } catch (_) {}
    }
  }
  function applyLayerToggles() {
    setLayerVis("supply", LAYER_ON.supply);
    setLayerVis("attack-line", LAYER_ON.attack);
    setLayerVis("attack-arrow", LAYER_ON.attack);
    setLayerVis("sector-fill", LAYER_ON.territory);
    setLayerVis("sector-line", LAYER_ON.territory);
    setLayerVis("faction-fill", LAYER_ON.territory);
    setLayerVis("faction-line", LAYER_ON.territory);
    setLayerVis("flabel", LAYER_ON.territory);
    setLayerVis("supply-flow", LAYER_ON.supply);
    setLayerVis("planet-icon", LAYER_ON.icons);
    setLayerVis("planet-label", LAYER_ON.labels);
    setLayerVis("heat", LAYER_ON.heat);
  }
  function applyViewMode() {
    if (VIEW_MODE === "galaxy") {
      LAYER_ON.territory = true; LAYER_ON.labels = true; LAYER_ON.heat = false; LAYER_ON.attack = true;
    } else if (VIEW_MODE === "tactical") {
      LAYER_ON.territory = false; LAYER_ON.labels = true; LAYER_ON.heat = false; LAYER_ON.attack = true;
    } else {
      LAYER_ON.territory = true; LAYER_ON.labels = false; LAYER_ON.heat = true; LAYER_ON.attack = false;
    }
    // 同步 chip 状态
    $("layers").querySelectorAll(".chip").forEach(c => c.classList.toggle("on", !!LAYER_ON[c.dataset.l]));
    applyLayerToggles();
  }

  applyFactionFilter();

  /* ---- 可收缩侧栏（桌面：折叠为窄边条；移动端：右侧抽屉 + 点地图关闭） ---- */
  const isMobile = () => window.matchMedia("(max-width:767px)").matches;
  const setAside = (collapsed) => {
    document.body.classList.toggle("aside-collapsed", collapsed);
    requestAnimationFrame(() => { if (MAP) MAP.resize(); });
  };
  $("aside-collapse").addEventListener("click", () => setAside(true));
  $("aside-rail").addEventListener("click", () => setAside(false));
  $("aside-toggle").addEventListener("click", () =>
    setAside(!document.body.classList.contains("aside-collapsed")));
  // 移动端：抽屉打开时，在「地图画布」上按下即收起（不误伤侧栏内输入框与图层开关）
  $("stage").addEventListener("pointerdown", (e) => {
    if (isMobile() && !document.body.classList.contains("aside-collapsed") && e.target.closest("#map"))
      setAside(true);
  }, { passive: true });
}

/* ---------------------------------------------------------------- 启动 ---- */
try {
  boot();
} catch (e) {
  $("bootmsg").innerHTML = "⚠️ 初始化异常<br><small>" + esc(e.message) + "</small>";
  console.error(e);
}
</script>
