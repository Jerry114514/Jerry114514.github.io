  <style>
    :root{

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg); color:var(--text); min-height:100vh;
      font-family:"SourceHanSans","Microsoft YaHei","PingFang SC",system-ui,sans-serif;

    a{color:var(--blue);text-decoration:none}
    a:hover{color:var(--yellow)}
    /* ---- 顶栏 ---- */
    .topbar{

    .topbar .brand{font-size:.82rem;color:var(--yellow);letter-spacing:.08em;font-weight:700}
    .topbar .stamp{margin-left:auto;font-size:.7rem;color:var(--mute);white-space:nowrap}

    .cols{display:grid;gap:14px}

    .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}

    .hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .chip{
      display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;

    /* 环形进度 */
    .ring{position:relative;width:132px;height:132px;flex:0 0 132px}
    .ring svg{transform:rotate(-90deg)}
    .ring .val{
      position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;

    /* 进度条 */
    .bar{position:relative;height:12px;background:#1a1a1a;border:1px solid var(--line);border-radius:999px;overflow:hidden}

    .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--dim);margin-top:6px}
    .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
    /* 区域展开 */
    .rg{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);
        color:inherit;font:inherit;text-align:left;padding:10px 0;min-height:44px;cursor:pointer}
    .rg:last-of-type{border-bottom:0}
    .rg.on{background:#161205}
    .rg .rgd{font-size:.76rem;color:var(--dim);padding:6px 0 10px;line-height:1.7;border-bottom:1px solid var(--line)}
    .rgd .mini{color:var(--mute);font-size:.72rem}

    /* ════ 表格家族 ════
       设计取自站内维基的表头规范（HD2_Wiki/assets/css/hud-skin.css 的
       `.info-table / .part-table / .stats-table / .section table` 家族）：
       表头 = 琥珀斜纹底 + 琥珀粗体大写 + 字距；数据行 = 细横线 + 偶数行压深；
       首列弱化；`.table-wrap` 横向滚动壳（窄屏不挤压，移动端可横滑）。 */
    .table-wrap{position:relative;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
    table.wtbl{border-collapse:collapse;width:100%}
    table.wtbl th{
      background:repeating-linear-gradient(45deg,rgba(245,197,24,.14) 0 6px,transparent 6px 12px);
      border:1px solid #33270A;color:var(--yellow);font-size:.72rem;letter-spacing:.1em;
      text-transform:uppercase;text-align:left;padding:6px 9px;white-space:nowrap;font-weight:700;
    }
    table.wtbl td{border-bottom:1px solid var(--line-2);padding:7px 9px;color:var(--text-dim);font-size:.82rem;vertical-align:top}
    table.wtbl td:first-child{color:var(--text-mute)}
    table.wtbl tr:nth-child(even) td{background:#0D0D0D}
    table.wtbl td.num,table.wtbl th.num{text-align:right;font-variant-numeric:tabular-nums}

      background:#161205;color:var(--yellow);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;

    table.wtbl tr.det[hidden]{display:none}

    footer{max-width:1080px;margin:0 auto;padding:0 14px 32px;color:var(--mute);font-size:.72rem;line-height:1.8}

    .sectnav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg-2)}

    .sectnav a:hover{border-color:var(--yellow);color:var(--yellow)}
    @media (max-width:600px){
      .hero{flex-direction:column;align-items:flex-start}

<body>
  <header class="topbar">
    <a class="back" href="./galaxy-map-v2.html">← 银河星图</a>
    <span class="brand">真理部 · 星球资料</span>
    <span class="stamp" id="stamp"></span>
  </header>

  <main id="app">
    <div class="loading" id="loading">🛰️ 正在载入星球资料…</div>
  </main>

  <footer>
    <div id="foot-note"></div>
    <div style="margin-top:6px">
      数据来源：官方战况 API（经 <a href="./index.html">真理部主站</a> 定时落盘）· 星球坐标/译名 <code>tables/starmap.json</code> ·
      区域 <code>tables/planet_regions*.json</code> · 补给线 <code>tables/waypoints.json</code> ·
      星球统计 <code>data.json → war_stats.planets_stats</code>
    </div>
  </footer>

  <script>
  "use strict";
  /* ============================================================================
     星球资料页（2026-09-25 新增，设计参考 helldiverscompanion.com hellpad 的星球页分区）
     目标：把原来全塞在星图右栏的星球信息，做成**独立、可分栏、可分享、移动端友好**的页面。
       · 入口：星图里点星球 → 轻量预览卡 → 「完整资料」→ planet.html?idx=N
       · 数据：与星图同一份 data.json + tables/*，公式与星图完全一致（口径统一，避免两处数字打架）
       · 定位：可索引页（动态 title/description/canonical + JSON-LD），也是分享落地页
     ============================================================================ */

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => (n == null ? "—" : Number(n).toLocaleString("en-US"));
  const pct = (v, d) => (v == null || isNaN(v) ? "—" : v.toFixed(d == null ? 2 : d) + "%");

  /* ---- 与星图同源的常量与公式 ---- */
  const OWNER_COLOR = { Humans: "#5BA3D0", Terminids: "#F5C518", Automaton: "#D6806D", Illuminate: "#CF64F8" };
  const OWN_CN = { Humans: "超级地球", Terminids: "终结族", Automaton: "机器人", Illuminate: "光能者" };
  const RACE_CN = { 1: "超级地球", 2: "终结族", 3: "机器人", 4: "光能者" };
  const LIB_RATE_K = 32;                       // 与 galaxy-map-v2.html 同值
  const ETA_MAX_H = 720;                       // 30 天以上不显示
  const REGION_TYPE_ZH = { Settlement: "定居点", Town: "城镇", City: "城市", MegaCity: "大城市" };
  const REGION_STARS = { Settlement: 1, Town: 2, City: 3, MegaCity: 4 };

  const libPct = (p) => (p && p.maxHealth > 0) ? Math.max(0, Math.min(100, (1 - p.health / p.maxHealth) * 100)) : 0;
  const grossOf = (p) => (p && p.maxHealth > 0 && DATA) ? (p.players || 0) * (DATA.impactMultiplier || 0) * LIB_RATE_K / p.maxHealth * 100 : 0;
  const netOf = (p) => grossOf(p) - (p.resistance || 0);         // 本页没有会话内两次观测，一律"推演"
  const etaOf = (p) => { const r = netOf(p), left = 100 - libPct(p); if (!(r > 0.0005)) return null; const h = left / r; return h <= ETA_MAX_H ? h : null; };
  function fmtHours(h) {
    if (h == null) return "—";
    if (h >= 24) return Math.floor(h / 24) + " 天 " + Math.round(h % 24) + " 时";
    if (h >= 1) return Math.floor(h) + " 小时 " + Math.round((h % 1) * 60) + " 分";
    return Math.max(1, Math.round(h * 60)) + " 分";
  }
  // 官方 war_stats 的时间字段是**毫秒**（2026-09-25 用 FRONTERIA 实测：raw 3,176,496,038 ↔
  // companion 页面显示 1M 6D 18h 2m 24s ≈ 3,175,344 秒，比值 1000.4）→ 先 /1000 再格式化。
  // 三年战争的累计值会到 700+ 天，只写「天」不好读 → 按 companion 的粗粒度分档，但写成中文：
  // 年 / 周 / 天 / 时 / 分，最多显示 3 档（跳过前导零）。
  function fmtDuration(ms) {
    if (!ms) return "—";
    let sec = Math.floor(ms / 1000);
    const units = [["年", 365 * 86400], ["周", 7 * 86400], ["天", 86400], ["时", 3600], ["分", 60]];
    const parts = [];
    units.forEach(([label, size]) => {
      const n = Math.floor(sec / size);
      sec -= n * size;
      if (n > 0) parts.push(n + " " + label);
    });
    return parts.length ? parts.slice(0, 3).join(" ") : Math.max(1, Math.floor(ms / 1000)) + " 秒";
  }

  /* ---- 表格助手（模块级：warHtml/statsHtml/regionsHtml/linksHtml/srcHtml 都要用）----
     结构与站内维基的 `.info-table` 家族一致（表头琥珀斜纹 + 大写 + 字距、数据行细线、偶数行压深），
     `.table-wrap` 是唯一的横向滚动壳（窄屏可横滑，不挤压列）。 */
  const T = {
    t: (v, cls) => `<td${cls ? ` class="${cls}"` : ""}>${v}</td>`,
    r: (cells, cls, attrs) => `<tr${cls ? ` class="${cls}"` : ""}${attrs || ""}>${cells.join("")}</tr>`,
    grp: (label, span) => `<tr class="grp"><td colspan="${span}">${esc(label)}</td></tr>`,
    table: (head, rows, cls) => `<div class="table-wrap"><table class="wtbl${cls ? " " + cls : ""}">`
      + `<thead><tr>${head.map((h) => `<th${h.cls ? ` class="${h.cls}"` : ""}>${esc(h.t)}</th>`).join("")}</tr></thead>`
      + `<tbody>${rows.join("")}</tbody></table></div>`,
  };

  /* ---- 数据状态 ---- */
  let DATA = null, PL_CN = {}, PL_SEC = {}, SEC_CN = {}, WAY = {}, REG_TABLE = {}, REG_ZH = {}, BIOME_IDX = null,
      BIOME_FB = null, EFFECT_CN = {}, HISTORY = null, P = null, STATS = null;

  const jget = async (url, soft) => {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) { if (soft) return null; throw new Error("HTTP " + r.status + " " + url); }
      return await r.json();
    } catch (e) { if (soft) return null; throw e; }
  };
  const soft = (u) => jget(u, true);

  async function boot() {
    const q = new URLSearchParams(location.search);
    let idx = q.get("idx");
    if (idx == null || idx === "") {
      const byName = q.get("name");
      if (!byName) { fail("缺少参数：请在链接里带上 ?idx=星球序号（例如 <a href='?idx=217'>?idx=217</a>）"); return; }
      const pi = await soft("./tables/planet_index.json") || {};
      idx = Object.keys(pi).find((k) => String(pi[k]).toUpperCase() === String(byName).trim().toUpperCase());
      if (idx == null) { fail("找不到星球：" + esc(byName)); return; }
    }
    const index = Number(idx);
    try {
      DATA = await jget("./data.json");
    } catch (e) { fail("战况数据载入失败：" + esc(e.message) + "（data.json 由 CI 每 5 分钟生成，稍后重试）"); return; }

    P = (DATA.planets || []).find((x) => x.index === index);
    if (!P) { fail("星球序号 " + index + " 不在当前战况数据里。"); return; }

    // 并发拉取静态表（任一失败都不阻断主流程）
    const [sm, way, reg, regZh, bioIdx, bioFb, eff, hist] = await Promise.all([
      soft("./tables/starmap.json"), soft("./tables/waypoints.json"),
      soft("./tables/planet_regions.json?v=20260925b"), soft("./tables/planet_regions_zh.json?v=20260925b"),
      soft("./assets/biomes/index.json"), soft("./tables/planet_biomes.json"),
      soft("./tables/effect_id_cn.json"), soft("./data/history/player_distribution.json"),
    ]);
    WAY = (way && way.waypoints) || {};
    REG_TABLE = (reg && reg.planets) || {};
    REG_ZH = (regZh && regZh.planets) || {};
    BIOME_IDX = bioIdx || {}; BIOME_FB = bioFb || {}; EFFECT_CN = eff || {}; HISTORY = hist || null;
    if (sm && sm.systems) {
      sm.systems.forEach((s) => {
        if (s.name_en && s.name) SEC_CN[String(s.name_en).toUpperCase()] = s.name;
        (s.planets || []).forEach((p) => {
          if (!p.en) return;
          if (p.cn) PL_CN[String(p.en).toUpperCase()] = p.cn;
          if (s.name) PL_SEC[String(p.en).toUpperCase()] = s.name;     // 星球 → 星区（官方 API 的 sector 常为空）
        });
      });
    }
    STATS = ((DATA.war_stats || {}).planets_stats || []).find((s) => s.planetIndex === index) || null;

    document.title = plCn() + "（" + (P.name || "") + "）星球资料 - 绝地潜兵2 真理部";
    setMeta();
    render();
  }

  const plCn = () => PL_CN[String(P.name || "").toUpperCase()] || P.name || ("#" + P.index);
  // 星区：官方 API 只给部分星球（实测很多是空串）→ 回退 starmap.json 的「星球属于哪个星区」，再退回"未知星区"
  const secCn = () => SEC_CN[String(P.sector || "").toUpperCase()]
    || PL_SEC[String(P.name || "").toUpperCase()] || (P.sector || "") || "未知星区";
  // 己方星球：官方 API 报满血，直接算 (1-health/maxHealth) 会得到 0%，与"已解放"自相矛盾
  // （星图 §19.24 修过同一类 bug）→ 显示层统一按 100% 处理
  const libShowOf = (o, health, maxHealth) => {
    if (String(o || "").toLowerCase() === "humans") return 100;
    return maxHealth > 0 ? Math.max(0, Math.min(100, 100 * (1 - health / maxHealth))) : null;
  };
  const biomeName = () => P.biome || BIOME_FB[String(P.name || "").toUpperCase()] || "";
  function biomeFile() {
    if (!BIOME_IDX) return null;
    const v = BIOME_IDX[biomeName()];
    if (!v) return null;
    return typeof v === "string" ? v : (v.file || v.img || v.image || null);
  }
  const warDeadline = (warTime) => {                 // warTime(秒) → 本地绝对时刻
    const w = (DATA && DATA.war) || {};
    if (!w.time || !DATA.fetchedAt || !warTime) return null;
    return Date.parse(DATA.fetchedAt) + (warTime - w.time) * 1000;
  };

  function setMeta() {
    const t = plCn() + "（" + P.name + "）星球资料 - 绝地潜兵2 真理部";
    const d = "绝地潜兵2 星球资料 · " + plCn() + "（" + P.name + "）："
      + secCn() + "星区 · 归属 " + (OWN_CN[P.currentOwner] || P.currentOwner || "未知")
      + " · 已解放 " + libPct(P).toFixed(2) + "% · 在线玩家 " + fmt(P.players)
      + "。含战役与战略分析、下属区域、星球统计、环境条件与补给线。";
    const url = location.origin + location.pathname + "?idx=" + P.index;
    const set = (sel, val) => { const e = document.querySelector(sel); if (e) e.setAttribute("content", val); };
    set('meta[name="description"]', d);
    set('meta[property="og:title"]', t); set('meta[name="twitter:title"]', t);
    set('meta[property="og:description"]', d); set('meta[name="twitter:description"]', d);
    set('meta[property="og:url"]', url);
    const l = document.querySelector('link[rel="canonical"]'); if (l) l.setAttribute("href", url);
    const ld = document.createElement("script");
    ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({
      "@context": "https://schema.org", "@type": "WebPage", name: t, description: d, url: url,
      inLanguage: "zh-CN", isPartOf: { "@type": "WebSite", name: "绝地潜兵2 · 真理部", url: location.origin + "/" }
    });
    document.head.appendChild(ld);
  }

  function fail(msg) {
    const l = $("loading"); if (l) l.remove();
    $("app").innerHTML = `<div class="card"><div class="error">⚠️ ${msg}</div></div>`
      + `<p class="note" style="padding:0 4px">可以回到 <a href="./galaxy-map-v2.html">银河星图</a> 或 <a href="./index.html">主站面板</a>。</p>`;
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    const l = $("loading"); if (l) l.remove();
    const owner = P.currentOwner || "Humans";
    const color = OWNER_COLOR[owner] || "#64748b";
    const camp = (DATA.campaigns || []).find((c) => c.planet && c.planet.index === P.index) || null;
    const ev = (DATA.planet_events || []).find((e) => e.planetIndex === P.index) || null;
    const isDef = !!(camp && (String(camp.campaignType).toLowerCase() === "defense" || camp.type === 1 || camp.type === 4))
               || !!ev;
    const humanOwned = String(P.currentOwner || "Humans").toLowerCase() === "humans";
    const showLib = humanOwned && !isDef;
    const lib = showLib ? 100 : libPct(P);
    const total = (DATA.player_distribution && DATA.player_distribution.total) || 0;
    const share = total > 0 ? (P.players || 0) / total * 100 : 0;
    const r = netOf(P), eta = etaOf(P);

    const status = isDef ? { cn: "⚠ 防御战 · 入侵中", cls: "def" }
      : showLib ? { cn: "✓ 已解放 · 超级地球控制中", cls: "ok" }
      : camp ? { cn: String(camp.campaignType).toLowerCase() === "defense" ? "入侵 · 防御战役" : "解放战役", cls: "warn" }
      : { cn: "无战役 · 待命", cls: "" };

    document.documentElement.style.setProperty("--fcd", color);
    $("stamp").textContent = "更新于 " + (DATA.fetchedAt ? new Date(DATA.fetchedAt).toLocaleString("zh-CN", { hour12: false }) : "—");

    // 环形进度弧长
    const R = 54, C = 2 * Math.PI * R;
    const dash = C * Math.min(100, Math.max(0, lib)) / 100;

    const kpiRows = [
      ["在线玩家", fmt(P.players), share ? "占全服 " + share.toFixed(2) + "%" : "—"],
      ["解放进度", lib.toFixed(2) + "%", showLib ? "超级地球控制中" : "1 − health / maxHealth"],
      ["施加影响", "+" + grossOf(P).toFixed(3) + "%/h", "在线玩家 × 影响系数"],
      ["抵抗度", P.resistance != null ? (+P.resistance).toFixed(2) + "%" : "—", "敌方抵抗（%/h）"],
      ["净速率", (r >= 0 ? "+" : "") + r.toFixed(3) + "%/h", "推演：施加 − 抵抗"],
      ["预计解放", eta == null ? (r < 0 ? "不会解放（净速率为负）" : "—") : fmtHours(eta), "按当前净速率线性外推"],
      ["血量", fmt(P.health) + " / " + fmt(P.maxHealth), "剩余 / 上限"],
      ["星区", secCn(), P.sector ? P.sector : "取自 tables/starmap.json"],
      ["所属阵营", OWN_CN[owner] || owner, owner],
    ].map(([k, v, s]) => T.r([T.t(esc(k)), T.t(esc(v), "num hi"), T.t(esc(s), "dim")])).join("");
    const kpis = T.table([{ t: "指标" }, { t: "数值", cls: "num" }, { t: "说明" }], [kpiRows], "minwide");

    $("app").innerHTML = `
      <div class="cols">
        <div>
          <!-- ① 星球头部 -->
          <section class="card" style="border-top:3px solid ${color}">
            <div class="body">
              <div class="hero">
                <div class="names">
                  <div class="nm">${esc(plCn())}</div>
                  <div class="en">${esc(P.name || "")}</div>
                  <div class="meta">
                    <span class="chip ${status.cls}">${esc(status.cn)}</span>
                    <span class="chip"><i class="dot" style="background:${color}"></i>${esc(OWN_CN[owner] || owner)}</span>
                    <span class="chip">${esc(secCn())} 星区</span>
                    ${P.attacking ? `<span class="chip def">遭受进攻</span>` : ""}
                  </div>
                </div>
                <div class="ring">
                  <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
                    <circle cx="66" cy="66" r="${R}" fill="none" stroke="#1e1e1e" stroke-width="12"/>
                    <circle cx="66" cy="66" r="${R}" fill="none" stroke="${showLib ? "#1FA84A" : color}" stroke-width="12"
                      stroke-linecap="round" stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}"/>
                  </svg>
                  <div class="val"><b>${lib.toFixed(1)}%</b><span>${showLib ? "已解放" : "解放进度"}</span></div>
                </div>
              </div>
              <div style="margin-top:14px">
                <div class="bar"><i style="width:${Math.min(100, lib).toFixed(2)}%"></i><span class="mk" style="left:${Math.min(100, lib).toFixed(2)}%"></span></div>
                <div class="rate">
                  ${showLib ? `<span>超级地球持有，进度恒为 100%（官方 API 对己方星球报满血，故不显示速率）</span>`
                    : `<span>净速率 <b class="${r >= 0 ? "up" : "down"}">${r >= 0 ? "▲" : "▼"} ${Math.abs(r).toFixed(3)}%/h</b> · 推演</span>
                       ${eta != null ? `<span>预计 <b>${fmtHours(eta)}</b> 后解放</span>` : ""}`}
                </div>
              </div>
            </div>
            <div class="sectnav">
              <a href="#sec-war">战役与战略</a><a href="#sec-stats">星球统计</a><a href="#sec-regions">下属区域</a>
              <a href="#sec-env">环境与词条</a><a href="#sec-links">补给线</a><a href="#sec-trend">全服趋势</a><a href="#sec-src">数据口径</a>
            </div>
          </section>

          <!-- ② 关键指标 -->
          <section class="card" style="margin-top:14px">
            <h2>关键指标 <span class="en">KEY METRICS</span></h2>
            <div class="body" style="padding-top:10px">${kpis}</div>
          </section>

          <!-- ③ 战役与战略 -->
          <section class="card" id="sec-war" style="margin-top:14px">
            <h2>战役与战略分析 <span class="en">STRATEGIC ANALYSIS</span></h2>
            <div class="body">${warHtml(camp, ev, color)}</div>
          </section>

          <!-- ④ 星球统计 -->
          <section class="card" id="sec-stats" style="margin-top:14px">
            <h2>星球统计 <span class="en">PLANET STATISTICS</span></h2>
            <div class="body">${statsHtml()}</div>
          </section>

          <!-- ⑤ 下属区域 -->
          <section class="card" id="sec-regions" style="margin-top:14px">
            <h2>下属区域（城市 / 超大型工厂） <span class="en">REGIONS</span></h2>
            <div class="body" id="rg-body">${regionsHtml()}</div>
          </section>

          <!-- ⑥ 环境与词条 -->
          <section class="card" id="sec-env" style="margin-top:14px">
            <h2>环境与词条 <span class="en">OPERATIONAL PARAMETERS</span></h2>
            <div class="body">${envHtml()}</div>
          </section>
        </div>

        <div>
          <!-- 补给线 -->
          <section class="card" id="sec-links">
            <h2>补给线 / 相邻星球 <span class="en">LINKED PLANETS</span></h2>
            <div class="body">${linksHtml()}</div>
          </section>
          <!-- 全服趋势 -->
          <section class="card" id="sec-trend" style="margin-top:14px">
            <h2>全服趋势 <span class="en">GALAXY TREND</span></h2>
            <div class="body">${trendHtml()}</div>
          </section>
          <!-- 数据口径 -->
          <section class="card" id="sec-src" style="margin-top:14px">
            <h2>数据口径 <span class="en">SOURCES</span></h2>
            <div class="body note">${srcHtml()}</div>
          </section>
        </div>
      </div>`;

    $("foot-note").innerHTML = `${esc(plCn())}（${esc(P.name)}）· 序号 ${P.index} · 页面生成于 ${new Date().toLocaleString("zh-CN", { hour12: false })}`;
    bindRegions();
    bindLinkRows();
    paintTrend();
  }

  function warHtml(camp, ev, color) {
    const rows = [];
    if (camp) {
      rows.push(T.r([
        T.t("当前战役"),
        T.t(`战役 #${esc(camp.id)} · 类型 ${esc(camp.campaignType || "—")}`),
        T.t(`<span style="color:${OWNER_COLOR[camp.faction] || color}">${esc(OWN_CN[camp.faction] || camp.faction || "—")}</span>`, "num hi"),
      ]));
    }
    if (ev) {
      const dl = warDeadline(ev.expireTime);
      const left = dl ? Math.max(0, dl - Date.now()) : null;
      const prog = ev.maxHealth > 0 ? Math.max(0, Math.min(100, (1 - ev.health / ev.maxHealth) * 100)) : null;
      rows.push(T.r([
        T.t("星球事件"),
        T.t(`${ev.eventType === 1 ? "防御战 · 入侵" : "事件类型 " + ev.eventType} · 发起方 ${esc(RACE_CN[ev.race] || ev.race || "—")}`
            + (left != null ? `<span class="sub">剩余 ${fmtHours(left / 3600000)}</span>` : "")
            + (prog != null ? `<div class="bar" style="margin-top:8px;max-width:260px"><i style="width:${prog.toFixed(2)}%"></i></div>` : "")),
        T.t(prog != null ? prog.toFixed(2) + "%" : "—", "num hi"),
      ]));
    }
    if (!rows.length) return `<p class="empty">该星球当前没有进行中的战役或事件（无战役 · 待命）。</p>`;
    return T.table([{ t: "项目" }, { t: "详情" }, { t: "数值", cls: "num" }], rows) +
      `<p class="note" style="margin-top:10px">说明：速率是**推演值**（在线玩家 × 影响系数 ÷ 血量 − 抵抗度）。
      星图页在同一次会话里做两次观测后会切成「实测」，本页每次打开都是新会话，故一律标「推演」。</p>`;
  }

  function statsHtml() {
    if (!STATS) return `<p class="empty">该星球暂无累计统计（官方 <code>war_stats.planets_stats</code> 里没有这一条；通常是从未被打过的星球）。</p>`;
    const s = STATS;
    const won = s.missionsWon || 0, lost = s.missionsLost || 0, tot = won + lost;
    const rate = tot > 0 ? won / tot * 100 : (s.missionSuccessRate || 0);
    const shots = s.bulletsFired || 0, hits = s.bulletsHit || 0;
    const accident = s.friendlies || 0, deaths = s.deaths || 0;
    // ⚠ 击杀是**该星球自本场战争开战以来的累计值**，不是"当前控制方造成的"：
    //   星球三年里反复易主，所以机器人星球上也会留下当年打终结族的旧账
    //   （实测 300 颗星球里 210 颗三个阵营都有击杀；三类击杀之和恰好等于全服总数）。
    //   companion 的做法是**只显示与控制方对应的那一类**（MARFARK 只显示 Dead Automatons），
    //   本页照此办理：主打一行 + 其余历史累计压成一条弱化说明 —— 既对齐 companion，
    //   也不会让人误以为"机器人星球上在打虫子"。
    const kills = [
      { key: "terminids", cn: "终结族", v: s.bugKills || 0 },
      { key: "automaton", cn: "机器人", v: s.automatonKills || 0 },
      { key: "illuminate", cn: "光能者", v: s.illuminateKills || 0 },
    ];
    const ownerKey = String(P.currentOwner || "").toLowerCase();
    const ownerMatch = kills.find((k) => k.key === ownerKey) || null;
    const mainKill = ownerMatch || kills.slice().sort((a, b) => b.v - a.v)[0];
    const otherKills = kills.filter((k) => k !== mainKill && k.v > 0);
    const killNote = ownerMatch ? "当前控制方" : "该星球历史主要交战阵营（现由" + (OWN_CN[P.currentOwner] || P.currentOwner || "未知") + "控制）";
    const rows = [
      T.grp("任务", 3),
      T.r([T.t("任务完成"), T.t(fmt(won), "num hi"), T.t(tot ? "成功率 " + rate.toFixed(1) + "%" : "—", "num dim")]),
      T.r([T.t("任务失败"), T.t(fmt(lost), "num hi"), T.t(tot ? "占 " + (100 - rate).toFixed(1) + "%" : "—", "num dim")]),
      T.r([T.t("累计任务时长"), T.t(fmtDuration(s.missionTime), "num"),
           T.t("全部玩家累计（官方毫秒字段 ÷1000）", "dim")]),
      T.grp("火力", 3),
      T.r([T.t("开火"), T.t(fmt(shots), "num"), T.t("累计发数", "dim")]),
      T.r([T.t("命中"), T.t(fmt(hits), "num"), T.t(shots ? "命中率 " + (hits / shots * 100).toFixed(1) + "%" : "—", "num dim")]),
      T.grp("战果（击杀为该星球累计，含易主前的旧账）", 3),
      T.r([T.t(mainKill.cn + "击杀"), T.t(fmt(mainKill.v), "num hi"), T.t(killNote, "dim")]),
      otherKills.length
        ? T.r([T.t("其他阵营历史累计"), T.t(otherKills.map((k) => k.cn + " " + fmt(k.v)).join(" · "), "dim"),
               T.t("易主前打下的", "num dim")])
        : "",
      T.grp("伤亡", 3),
      T.r([T.t("阵亡绝地潜兵"), T.t(fmt(deaths), "num hi"), T.t("", "dim")]),
      T.r([T.t("误伤"), T.t(fmt(accident), "num"), T.t(deaths ? "占阵亡 " + (accident / Math.max(1, deaths) * 100).toFixed(1) + "%" : "—", "num dim")]),
      T.r([T.t("复活"), T.t(fmt(s.revives || 0), "num"), T.t("", "dim")]),
    ].filter(Boolean);
    return T.table([{ t: "指标" }, { t: "数值", cls: "num" }, { t: "备注", cls: "num" }], rows, "minwide") +
      `<p class="note" style="margin-top:10px">口径：与官方 API <code>war_stats.planets_stats</code> 一致（本场战争开战以来累计），
      与 companion 的星球统计**同源**。**击杀按星球累计、不按阵营归属** —— 本场战争打了三年，星球反复易主，
      所以机器人星球上也会留着当年打终结族的数字（实测 300 颗星球里 210 颗三个阵营都有击杀，
      且三类之和恰好等于全服总数）。这里与 companion 一样只把与控制方对应的那一类作为主行，
      其余压成一条弱化说明。「命中率 &gt; 100%」是官方原始数据的特征（多弹丸武器按发/弹计数口径不同），照实呈现不修正；
      时间字段单位是毫秒。</p>`;
  }

  function regionsHtml() {
    const st = REG_TABLE[String(P.index)];
    if (!st || !st.regions || !st.regions.length) return `<p class="empty">静态表里没有这颗星球的区域数据（<code>tables/planet_regions.json</code> 覆盖 84 颗有城市/工厂的星球）。</p>`;
    const zhMap = REG_ZH[String(P.index)] || {};
    const live = P.regions || [];
    const rows = [];
    st.regions.forEach((rg, k) => {
      const lv = live[k] || null;
      const typeOf = String(rg.region_type || "").toLowerCase() === "megafactory" ? "Megafactory" : (rg.size || "");
      const typeCn = typeOf === "Megafactory" ? "超大型工厂" : (REGION_TYPE_ZH[typeOf] || typeOf || "区域");
      const stars = REGION_STARS[typeOf] || 0;
      const mh = (lv && lv.maxHealth) || 0;
      // 己方星球在"无区域战役"时官方不下发 regions[] → 逐条只能是"—"；整颗星球都是我们的，
      // 故我方星球一律记 100%（有运行时数据时仍以运行时为准，例如某区域还在打）。
      const ours = String(P.currentOwner || "").toLowerCase() === "humans";
      let p = lv ? libShowOf(lv.owner, lv.health, mh) : null;
      if (p == null && ours) p = 100;
      const ownerCn = lv && lv.owner ? (OWN_CN[lv.owner] || lv.owner) : (rg.owner || "—");
      const zh = zhMap[rg.name] || "";
      rows.push(T.r([
        T.t(`${typeOf === "Megafactory" ? "🏭" : "🏙"} ${esc(zh || rg.name)}` +
            (zh ? `<span class="sub">${esc(rg.name)}</span>` : "")),
        T.t(`${esc(typeCn)} <span class="stars">${"★".repeat(stars)}</span>`),
        T.t(esc(ownerCn) + (lv && lv.isAvailable ? `<span class="sub">可部署</span>` : "")),
        T.t(lv && lv.players ? fmt(lv.players) : "—", "num"),
        T.t(p == null ? "—" : p.toFixed(2) + "%", "num hi"),
      ], "click rg-row", ` data-d="${k}"`) + `<tr class="det" data-d="${k}" hidden><td colspan="5">`
        + (rg.desc ? esc(rg.desc) : "<span class='mini'>（该区域没有说明文本）</span>")
        + `<div class="mini" style="margin-top:6px">类型 ${esc(typeCn)}（上游 <code>${esc(rg.size || rg.region_type || "—")}</code>）· 血量 ${fmt(lv ? lv.health : null)} / ${fmt(lv ? lv.maxHealth : null)}</div></td></tr>`);
      rows.push("");
    });
    return T.table([{ t: "区域" }, { t: "类型" }, { t: "归属" }, { t: "玩家", cls: "num" }, { t: "已解放", cls: "num" }],
                   rows.filter(Boolean)) +
      `<p class="note" style="margin-top:10px">点任意行展开该区域的说明与血量。区域进度与星图同口径（己方控制 = 100%）。</p>`;
  }

  function envHtml() {
    const file = biomeFile();
    const img = file
      ? `<div class="biome"><img src="./assets/biomes/${esc(file)}" alt="${esc(biomeName())}" loading="lazy"><div class="cap">${esc(biomeName() || "环境")}</div></div>`
      : `<div class="biome" style="padding:18px;text-align:center" class="empty">${esc(biomeName() || "未知环境")}（无环境图）</div>`;
    // 同一效果可能有多个 id 映射到同一个中文名（实测 MARFARK 的 activeEffects=[1248,1249]
    // 都是「炽灼部队」）→ 按名字去重，避免同一词条显示两遍
    const fx = [];
    (P.activeEffects || []).forEach((id) => {
      const n = EFFECT_CN[String(id)] || ("效果 #" + id);
      if (fx.indexOf(n) < 0) fx.push(n);
    });
    const tags = fx.length ? fx.map((n) => `<span class="tag">⚡ ${esc(n)}</span>`).join("")
      : `<p class="empty">当前没有生效中的星球效果（词条）。</p>`;
    return `${img}
      <div style="margin-top:12px"><div class="k" style="font-size:.72rem;color:var(--mute);margin-bottom:6px">生效效果 / 词条</div>${tags}</div>
      <p class="note" style="margin-top:10px">环境图来自 <code>assets/biomes/</code>（随仓库提交）；生态名优先取官方 API 的 <code>biome</code>，
      缺失时回退 <code>tables/planet_biomes.json</code>。词条名取 <code>tables/effect_id_cn.json</code>（82 条），未收录显示原始 id。</p>`;
  }

  function linksHtml() {
    const ns = WAY[String(P.index)] || WAY[P.index] || [];
    if (!ns.length) return `<p class="empty">该星球没有登记补给线（<code>tables/waypoints.json</code> 覆盖 186 颗星球 / 341 条连接）。</p>`;
    const rows = ns.map((i) => {
      const q = (DATA.planets || []).find((x) => x.index === i) || { index: i, name: "#" + i };
      const cn = PL_CN[String(q.name || "").toUpperCase()] || q.name;
      const o = q.currentOwner || "None";
      const l = libShowOf(o, q.health, q.maxHealth);
      return T.r([
        T.t(`<a href="./planet.html?idx=${i}">${esc(cn)}</a><span class="sub">#${i} · ${esc(q.name || "")}</span>`),
        T.t(`<span style="color:${OWNER_COLOR[o] || "#94a3b8"}">${esc(OWN_CN[o] || o || "未知")}</span>`),
        T.t(l == null ? "—" : l.toFixed(1) + "%", "num hi"),
      ], "click link-row");
    });
    return T.table([{ t: "星球" }, { t: "归属" }, { t: "已解放", cls: "num" }], rows) +
      `<p class="note" style="margin-top:10px">补给线两端同为超级地球时可用于跨星球支援；点任意行进入它的资料页。</p>`;
  }

  function trendHtml() {
    const h = HISTORY && HISTORY.history;
    if (!h || !h.length) return `<p class="empty">没有全服历史数据（<code>data/history/player_distribution.json</code>）。</p>`;
    return `<canvas id="trend" class="chart" width="640" height="300"></canvas>
      <div class="legend">
        <span><i style="background:var(--humans)"></i>超级地球</span>
        <span><i style="background:var(--terminids)"></i>终结族</span>
        <span><i style="background:var(--automaton)"></i>机器人</span>
        <span><i style="background:var(--illuminate)"></i>光能者</span>
        <span style="color:var(--mute)">共 ${h.length} 个采样点</span>
      </div>
      <p class="note" style="margin-top:8px">全服在线玩家按战线的分布趋势（最近若干小时）。这是**全服**数据，不是这颗星球的专属统计 ——
      官方 API 不提供单星球的历史曲线，只有当前快照。</p>`;
  }

  function paintTrend() {
    const cv = $("trend"); if (!cv || !cv.getContext) return;
    const h = ((HISTORY && HISTORY.history) || []).slice(-72);
    if (h.length < 2) return;
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height, padL = 44, padR = 10, padT = 12, padB = 22;
    const keys = [["Humans", "#5BA3D0"], ["Terminids", "#F5C518"], ["Automaton", "#D6806D"], ["Illuminate", "#CF64F8"]];
    let max = 0;
    h.forEach((s) => { let t = 0; keys.forEach(([k]) => { t += (s.factions || {})[k] || 0; }); max = Math.max(max, s.totalPlayers || t, t); });
    max = max || 1;
    const X = (i) => padL + (W - padL - padR) * i / (h.length - 1);
    const Y = (v) => padT + (H - padT - padB) * (1 - v / max);
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "#242424"; ctx.lineWidth = 1;
    for (let g = 0; g <= 4; g++) {
      const v = max * g / 4, y = Y(v);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillStyle = "#6E6E6E"; ctx.font = "11px sans-serif"; ctx.textAlign = "right";
      ctx.fillText(Math.round(v / 1000) + "k", padL - 6, y + 4);
    }
    keys.forEach(([k, color]) => {
      ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2;
      h.forEach((s, i) => { const v = (s.factions || {})[k] || 0; if (i === 0) ctx.moveTo(X(i), Y(v)); else ctx.lineTo(X(i), Y(v)); });
      ctx.stroke();
    });
    ctx.beginPath(); ctx.strokeStyle = "#EDEDED"; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
    h.forEach((s, i) => { const v = s.totalPlayers || 0; if (i === 0) ctx.moveTo(X(i), Y(v)); else ctx.lineTo(X(i), Y(v)); });
    ctx.stroke(); ctx.setLineDash([]);
    const t0 = h[0].timestamp ? new Date(h[0].timestamp) : null, t1 = h[h.length - 1].timestamp ? new Date(h[h.length - 1].timestamp) : null;
    if (t0 && t1) {
      ctx.fillStyle = "#6E6E6E"; ctx.font = "11px sans-serif";
      ctx.textAlign = "left"; ctx.fillText(t0.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit" }), padL, H - 6);
      ctx.textAlign = "right"; ctx.fillText(t1.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit" }), W - padR, H - 6);
    }
  }

  function srcHtml() {
    const w = (DATA && DATA.war) || {};
    const rows = [
      ["战况数据", `${esc(DATA.source || "—")}（<code>data.json</code>）`],
      ["抓取时刻", esc(DATA.fetchedAt || "—")],
      ["战争时间", w.time ? fmt(w.time) + " s" : "—"],
      ["影响系数", DATA.impactMultiplier != null ? (+DATA.impactMultiplier).toFixed(6) : "—"],
      ["解放进度", "1 − health / maxHealth"],
      ["速率", `在线玩家 × 影响系数 × ${LIB_RATE_K} ÷ 血量 − 抵抗度`],
      ["累计统计", "官方 <code>war_stats.planets_stats</code>（时间字段单位＝毫秒）"],
    ].map(([k, v]) => T.r([T.t(esc(k)), T.t(v, "hi")]));
    return T.table([{ t: "项目" }, { t: "口径 / 取值" }], rows) +
      `<p class="note" style="margin-top:10px">本页与 <a href="./galaxy-map-v2.html">银河星图</a> 使用同一份数据与同一套公式；
      两处数字若不一致，请以页面顶部的「更新于」判断谁更新。星球统计与 companion 同源。</p>`;
  }

  function bindRegions() {
    const body = $("rg-body"); if (!body) return;
    body.addEventListener("click", (ev) => {
      const row = ev.target.closest ? ev.target.closest("tr.rg-row") : null;
      if (!row) return;
      const k = row.getAttribute("data-d");
      const d = body.querySelector(`tr.det[data-d="${k}"]`);
      if (!d) return;
      const on = d.hidden;
      body.querySelectorAll("tr.rg-row").forEach((b) => b.classList.remove("on"));
      d.hidden = !on;
      if (on) row.classList.add("on");
    });
  }

  function bindLinkRows() {
    const box = $("sec-links"); if (!box) return;
    box.addEventListener("click", (ev) => {
      const row = ev.target.closest ? ev.target.closest("tr.link-row") : null;
      if (!row || (ev.target.closest && ev.target.closest("a"))) return;
      const a = row.querySelector("a[href]");
      if (a) location.href = a.getAttribute("href");
    });
  }

  boot();
  </script>
</body>
