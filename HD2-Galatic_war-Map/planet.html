  <style>
    /* ============================================================
       星球指挥台（2026-10-25 重构）
       信息层级参考社区站点的“战场指挥台”分区方式（首屏强态势 + 左中右），
       视觉沿用本站黑金 HUD；所有数字与公式与重构前完全一致。
       断点：≥1280 三栏指挥台 / 900–1279 两栏 / 700–899 单栏+横向 KPI / <600 完整单列
       ============================================================ */
    :root{
      --bg:#0A0A0A; --bg-2:#101010; --card:#121212; --line:#242424; --line-2:#333;
      --text:#EDEDED; --dim:#A8A8A8; --mute:#6E6E6E;
      --yellow:#F5C518; --blue:#5BA3D0; --red:#FF4D2E; --green:#1FA84A;
      --humans:#5BA3D0; --terminids:#F5C518; --automaton:#D6806D; --illuminate:#CF64F8;
      --fcd:var(--yellow);
      --stripe:repeating-linear-gradient(45deg,rgba(245,197,24,.10) 0 6px,transparent 6px 12px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg); color:var(--text); min-height:100vh;
      font-family:"SourceHanSans","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
      -webkit-text-size-adjust:100%;
    }
    a{color:var(--blue);text-decoration:none}
    a:hover{color:var(--yellow)}
    :is(a,button,summary,[tabindex]):focus-visible{outline:2px solid var(--fcd);outline-offset:2px}
    /* ---- 顶栏 ---- */
    .topbar{
      position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
      padding:10px 14px;background:rgba(10,10,10,.94);border-bottom:2px solid var(--fcd);
      backdrop-filter:blur(6px);
    }
    .topbar .back{
      display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;
      border:1px solid var(--line-2);border-radius:8px;color:var(--dim);font-size:.82rem;
    }
    .topbar .back:hover{border-color:var(--yellow);color:var(--yellow)}
    .topbar .brand{font-size:.82rem;color:var(--yellow);letter-spacing:.08em;font-weight:700}
    .topbar .stamp{margin-left:auto;font-size:.7rem;color:var(--mute);white-space:nowrap}
    /* ---- 区块导航（窄屏横向滚动） ---- */
    .sectnav{
      display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;
      border-bottom:1px solid var(--line);background:var(--bg-2);
      scroll-snap-type:x proximity;
    }
    .sectnav a{
      font-size:.76rem;color:var(--dim);border:1px solid var(--line);border-radius:999px;
      padding:4px 10px;white-space:nowrap;scroll-snap-align:start;
    }
    .sectnav a:hover{border-color:var(--yellow);color:var(--yellow)}
    @media (max-width:600px){
      .sectnav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start}
    }
    /* ---- 来源徽标 ---- */
    .srcbadges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0 2px}
    .sbadge{
      display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
      border:1px solid var(--line-2);font-size:.68rem;color:var(--dim);letter-spacing:.04em;
    }
    .sbadge i{width:7px;height:7px;border-radius:50%;background:var(--green)}
    .sbadge.calc i{background:var(--yellow)}
    /* ---- 主布局 ---- */
    main{max-width:1400px;margin:0 auto;padding:12px 14px 40px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
    section.card{scroll-margin-top:64px}
    .card > h2, .card > .chead{
      margin:0;padding:10px 14px;font-size:.82rem;letter-spacing:.1em;color:var(--yellow);
      border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px;
    }
    .card .chead{border-top:1px solid var(--fc, var(--line-2));background:var(--stripe)}
    .card > h2 .en, .chead .en{color:var(--mute);font-size:.68rem;font-weight:400;letter-spacing:.14em}
    .card .body{padding:12px 14px}
    /* ============================================================
       A. COMMAND HERO
       ============================================================ */
    .hero{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;
      background:radial-gradient(120% 140% at 20% 0%,#141414 0%,#0B0B0B 60%);min-width:0}
    .hero-media{position:absolute;inset:0;z-index:0;pointer-events:none}
    .hero-media .bg{width:100%;height:100%;object-fit:cover;opacity:.9}
    /* 暗化 + 渐变遮罩：保证文字对比度（验收项） */
    .hero-media::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(6,6,6,.62) 0%,rgba(6,6,6,.78) 55%,rgba(6,6,6,.92) 100%),
                 radial-gradient(90% 120% at 12% 10%,rgba(6,6,6,.15) 0%,rgba(6,6,6,.72) 78%);
    }
    .hero-media .icon{display:none}
    .hero-media.no-bio .bg{display:none}
    .hero-media.no-bio .icon{
      display:block;width:min(44%,340px);height:auto;
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      opacity:.5;filter:saturate(.9);
    }
    .hero-media.no-img .icon{display:none}
    .hero-in{position:relative;z-index:1;padding:18px 18px 14px}
    .eyebrow{font-size:.66rem;letter-spacing:.22em;color:var(--fcd);text-transform:uppercase;font-weight:700}
    .hero-grid{display:grid;gap:14px}
    .hid .nm{font-size:2rem;line-height:1.12;font-weight:700;margin:4px 0 0}
    .hid .en{color:var(--dim);font-size:.84rem;letter-spacing:.12em;margin-top:3px}
    .hid .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .chip{
      display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
      border:1px solid var(--line-2);font-size:.74rem;color:var(--dim);
      background:rgba(10,10,10,.45);
    }
    .chip .dot{width:8px;height:8px;border-radius:50%}
    .chip.ok{color:var(--green);border-color:rgba(31,168,74,.55)}
    .chip.def{color:var(--red);border-color:rgba(255,77,46,.55)}
    .chip.warn{color:var(--yellow);border-color:rgba(245,197,24,.55)}
    /* 中部：解放进度环 */
    .hmid{display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:center}
    .ring{position:relative;width:168px;height:168px}
    .ring svg circle.arc{transition:stroke-dasharray .6s ease}
    .ring .val{
      position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-variant-numeric:tabular-nums;text-align:center;
    }
    .ring .val b{font-size:1.9rem;line-height:1}
    .ring .val span{font-size:.64rem;color:var(--dim);letter-spacing:.12em;margin-top:4px}
    .hpv{font-size:.76rem;color:var(--dim);font-variant-numeric:tabular-nums;text-align:center}
    .hpv b{color:var(--text)}
    /* 右部：Quick Intel */
    .hright{display:flex;flex-direction:column;gap:0;border:1px solid var(--line-2);border-radius:10px;
      background:rgba(8,8,8,.55);overflow:hidden}
    .hright .qt{font-size:.64rem;letter-spacing:.18em;color:var(--fcd);padding:7px 10px;border-bottom:1px solid var(--line-2);background:var(--stripe)}
    .qi{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
      padding:6px 10px;border-bottom:1px solid rgba(36,36,36,.7);font-size:.76rem}
    .qi:last-child{border-bottom:0}
    .qi .k{color:var(--mute)}
    .qi .v{font-variant-numeric:tabular-nums;color:var(--text);text-align:right}
    .qi .v small{color:var(--mute);font-size:.68rem;margin-left:3px}
    /* 首屏下方的细粒度进度条 + 速率方向 */
    .hero-strip{position:relative;z-index:1;border-top:1px solid var(--line);background:rgba(8,8,8,.6);padding:10px 16px}
    .bar{position:relative;height:12px;background:#1a1a1a;border:1px solid var(--line);border-radius:999px;overflow:hidden}
    .bar > i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#1FA84A,#7ddc9a)}
    .bar > i.defo{background:linear-gradient(90deg,#2b6f94,#5BA3D0)}
    .bar > .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--yellow)}
    .strip-rate{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--dim);margin-top:8px}
    .strip-rate b{color:var(--text);font-variant-numeric:tabular-nums}
    .up{color:var(--green)} .down{color:var(--red)}
    /* ============================================================
       指挥台三栏（≥1280：4 / 5 / 3；900–1279：两栏；以下单栏）
       ============================================================ */
    .cmd-grid{display:grid;gap:14px;margin-top:14px;align-items:start}
    .col-l,.col-m,.col-r{display:flex;flex-direction:column;gap:14px;min-width:0}
    @media (min-width:900px){
      .cmd-grid{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
      .col-l{grid-column:1}
      .col-m{grid-column:1}
      .col-r{grid-column:2;grid-row:1 / span 2}
    }
    @media (min-width:1280px){
      .cmd-grid{grid-template-columns:minmax(0,4fr) minmax(0,5fr) minmax(0,3fr)}
      .col-l{grid-column:1;grid-row:auto}
      .col-m{grid-column:2;grid-row:auto}
      .col-r{grid-column:3;grid-row:auto}
    }
    @media (min-width:900px){
      .hero-grid{grid-template-columns:minmax(0,1.15fr) auto minmax(0,.95fr);align-items:center}
    }
    /* ============================================================
       B. 战略态势卡（左栏）
       ============================================================ */
    .sit{display:flex;flex-direction:column;gap:8px}
    .sit .line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.8rem}
    .sit .line:last-child{border-bottom:0}
    .sit .line .k{color:var(--mute)}
    .sit .line .v{font-variant-numeric:tabular-nums;text-align:right;color:var(--text)}
    .sit .line .v.ok{color:var(--green)} .sit .line .v.bad{color:var(--red)}
    .sit .line .v small{display:block;color:var(--mute);font-size:.68rem;margin-top:2px}
    .sit .hint{border:1px dashed var(--line-2);border-radius:8px;padding:8px 10px;font-size:.74rem;color:var(--dim);line-height:1.6}
    /* ============================================================
       C. 全服趋势（中栏主图）
       ============================================================ */
    .trend-sum{font-size:.78rem;color:var(--dim);line-height:1.7;margin-bottom:8px}
    .trend-sum b{color:var(--text)}
    .chart{width:100%;height:280px;display:block}
    .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--dim);margin-top:6px}
    .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
    .legend .dash i{background:transparent;border-top:2px dashed #EDEDED;border-radius:0;height:0}
    /* ============================================================
       D. 星球统计 KPI 卡（右栏）
       ============================================================ */
    .pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    @media (min-width:700px) and (max-width:1279.5px){ .pcards{grid-template-columns:repeat(3,minmax(0,1fr))} }
    @media (min-width:1280px){ .pcards{grid-template-columns:repeat(2,minmax(0,1fr))} }
    .pc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#0E0E0E;min-width:0}
    .pc .k{font-size:.66rem;color:var(--mute);letter-spacing:.06em}
    .pc .v{font-size:1.06rem;font-variant-numeric:tabular-nums;margin-top:3px;overflow-wrap:anywhere}
    .pc .v small{font-size:.7rem;color:var(--dim);margin-left:3px}
    .pc .s{font-size:.66rem;color:var(--mute);margin-top:2px}
    .pc.hero-v{border-color:var(--fc,var(--line-2))}
    .pgrp{font-size:.66rem;letter-spacing:.16em;color:var(--yellow);text-transform:uppercase;margin:10px 0 6px}
    .pgrp:first-child{margin-top:0}
    details.note-det{border:1px solid var(--line);border-radius:8px;margin-top:10px}
    details.note-det > summary{
      cursor:pointer;padding:7px 10px;font-size:.72rem;color:var(--dim);list-style:none;min-height:36px;
      display:flex;align-items:center;gap:6px;
    }
    details.note-det > summary::before{content:"▸";color:var(--mute)}
    details.note-det[open] > summary::before{content:"▾"}
    details.note-det > .note{padding:2px 10px 10px}
    /* ============================================================
       E. 环境与词条
       ============================================================ */
    .env-grid{display:grid;gap:14px}
    @media (min-width:700px){ .env-grid{grid-template-columns:minmax(0,320px) minmax(0,1fr)} }
    .biome{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#0d0d0d}
    .biome img{display:block;width:100%;height:auto}
    .biome .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;font-size:.76rem;
      background:linear-gradient(transparent,rgba(0,0,0,.85))}
    .biome.noimg{padding:18px;text-align:center;color:var(--mute);font-size:.8rem}
    .fxlist{display:flex;flex-direction:column;gap:6px}
    details.fx{border:1px solid var(--line-2);border-radius:999px;background:#0E0E0E}
    details.fx > summary{
      cursor:pointer;list-style:none;padding:4px 12px;font-size:.74rem;color:var(--dim);
      display:inline-flex;align-items:center;gap:6px;min-height:30px;
    }
    details.fx > summary::-webkit-details-marker{display:none}
    details.fx > summary::after{content:"▾";font-size:.6rem;color:var(--mute)}
    details.fx[open]{border-radius:10px}
    details.fx[open] > summary::after{content:"▴"}
    details.fx .fxd{padding:2px 12px 10px;font-size:.7rem;color:var(--mute);line-height:1.7;overflow-wrap:anywhere}
    details.fx .fxd b{color:var(--dim)}
    .tag{display:inline-flex;gap:6px;align-items:center;padding:3px 9px;border:1px solid var(--line-2);
      border-radius:999px;font-size:.74rem;color:var(--dim);margin:0 6px 6px 0}
    /* ============================================================
       F. 区域（紧凑行 + 展开）
       ============================================================ */
    .rghead,.rgc{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr) 64px 74px 84px;gap:8px;align-items:center}
    .rghead{font-size:.66rem;color:var(--mute);letter-spacing:.08em;padding:2px 4px 6px;text-transform:uppercase}
    .rgc{
      width:100%;background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;
      text-align:left;padding:9px 4px;min-height:44px;cursor:pointer;
    }
    .rgc:hover{background:#151515}
    .rgc[aria-expanded="true"]{background:#161205}
    .rgc .rgn{font-size:.84rem;min-width:0}
    .rgc .rgn .sub{display:block;color:var(--mute);font-size:.68rem;margin-top:1px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rgc .rgt{font-size:.72rem;color:var(--dim)}
    .rgc .num{font-variant-numeric:tabular-nums;font-size:.78rem;text-align:right}
    .rgc .num.hi{color:var(--text);font-weight:600}
    .rgc .num.ok{color:var(--green)} .rgc .num.warn{color:var(--yellow)}
    .stars{color:var(--yellow);letter-spacing:-1px}
    .rgd{font-size:.76rem;color:var(--dim);padding:6px 4px 12px;line-height:1.7;border-top:1px dashed var(--line);
      border-bottom:1px solid var(--line)}
    .rgd[hidden]{display:none}
    .rgd .mini{color:var(--mute);font-size:.72rem}
    @media (max-width:700px){
      /* 窄屏：行内只留 名称/归属/进度，其余并入展开区 */
      .rghead{display:none}
      .rgc{grid-template-columns:minmax(0,1fr) 70px 64px}
      .rgc .rgt,.rgc .num.eta,.rgc .num.net{display:none}
    }
    /* ============================================================
       G. 补给线（紧凑行）
       ============================================================ */
    .lk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
    .lk:last-child{border-bottom:0}
    .lk .nm{font-size:.82rem;min-width:0}
    .lk .nm .sub{display:block;color:var(--mute);font-size:.68rem;margin-top:1px}
    .lk .st{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
    .lk .pct{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--text)}
    .stchip{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;color:var(--dim);
      border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;white-space:nowrap}
    .stchip i{width:6px;height:6px;border-radius:50%}
    /* ============================================================
       I. 数据口径（底部折叠）
       ============================================================ */
    details.srcbox{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:14px}
    details.srcbox > summary{
      cursor:pointer;list-style:none;padding:10px 14px;font-size:.82rem;letter-spacing:.1em;color:var(--yellow);
      display:flex;align-items:baseline;gap:8px;min-height:40px;
    }
    details.srcbox > summary::-webkit-details-marker{display:none}
    details.srcbox > summary::before{content:"▸";color:var(--mute)}
    details.srcbox[open] > summary::before{content:"▾"}
    /* ════ 表格家族（保留：数据口径等低频对比仍用表格） ════ */
    .table-wrap{position:relative;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
    table.wtbl{border-collapse:collapse;width:100%}
    table.wtbl th{
      background:repeating-linear-gradient(45deg,rgba(245,197,24,.14) 0 6px,transparent 6px 12px);
      border:1px solid #33270A;color:var(--yellow);font-size:.72rem;letter-spacing:.1em;
      text-transform:uppercase;text-align:left;padding:6px 9px;white-space:nowrap;font-weight:700;
    }
    table.wtbl td{border-bottom:1px solid var(--line-2);padding:7px 9px;color:var(--dim);font-size:.82rem;vertical-align:top}
    table.wtbl td:first-child{color:var(--mute)}
    table.wtbl tr:nth-child(even) td{background:#0D0D0D}
    table.wtbl td.num,table.wtbl th.num{text-align:right;font-variant-numeric:tabular-nums}
    table.wtbl td.hi{color:var(--text);font-weight:600}
    table.wtbl td.dim{color:var(--mute);font-size:.74rem}
    table.wtbl .sub{display:block;color:var(--mute);font-size:.72rem;margin-top:3px}
    /* 通用 */
    .note{font-size:.72rem;color:var(--mute);line-height:1.7}
    .empty{color:var(--mute);font-size:.8rem}
    .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.82rem}
    .kv dt{color:var(--mute)}
    .kv dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
    .loading,.error{padding:32px 14px;text-align:center;color:var(--mute);font-size:.86rem}
    .error{color:var(--red)}
    footer{max-width:1400px;margin:0 auto;padding:0 14px 32px;color:var(--mute);font-size:.72rem;line-height:1.8}
    footer a{color:var(--dim)}

  <script src="./js/forecast.js?v=20261013b"></script>
  <script src="./js/regions.js"></script>
  <script src="./js/rate-source.js"></script>
  <script>
  "use strict";
  /* ============================================================================
     星球指挥台（2026-10-25 由“两栏报表”重构为“首屏强态势 + 左中右指挥台”）
     信息层级参考 helldiverscompanion hellpad 星球页的分区方式，但代码 / 图片 / 文案 /
     运行时数据全部为本站自有，公式与数据口径与重构前完全一致：
       · 入口：星图 → 星球预览卡 → 「完整资料」→ planet.html?idx=N
       · 数据：data.json + tables/*（与星图同源同公式，口径统一）
       · 布局：≥1280 左(战略+补给线 4) / 中(趋势+区域 5) / 右(统计 3)；900–1279 两栏；
               700–899 单栏+横向 KPI；<600 完整单列
       · 锚点 #sec-war/#sec-stats/#sec-regions/#sec-env/#sec-links/#sec-trend/#sec-src 保持不变
     未接入（仓库内无可靠静态数据，不抓取 Companion）：POI / 行星剧情 / 战术行动卡。
     ============================================================================ */

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => (n == null ? "—" : Number(n).toLocaleString("en-US"));
  const pct = (v, d) => (v == null || isNaN(v) ? "—" : v.toFixed(d == null ? 2 : d) + "%");

  /* ---- 与星图同源的常量与公式（重构前后一字未改） ---- */
  const OWNER_COLOR = { Humans: "#5BA3D0", Terminids: "#F5C518", Automaton: "#D6806D", Illuminate: "#CF64F8" };
  const OWN_CN = { Humans: "超级地球", Terminids: "终结族", Automaton: "机器人", Illuminate: "光能者" };
  const RACE_CN = { 1: "超级地球", 2: "终结族", 3: "机器人", 4: "光能者" };
  // ⚠ 2026-09-29 重新标定 32 → 90；三处必须同值（index.html / 本文件 / galaxy-map-v2.html），
  //   依据见 index.html 同名常量上方的注释（实测 K 中位数 82.8，取 90）。这是**推演兜底**常数，
  //   有实测帧时走 js/rate-source.js 的实测路径，与本值无关。
  const LIB_RATE_K = 90;
  const ETA_MAX_H = 720;                       // 30 天以上不显示
  /* 「等效推进速率」的基准球：血量 100 万（游戏里最常见的档位；2026-09-26 两个快照里都是 273 颗中的 181 颗）。
     ⚠ 为什么需要它（2026-09-26 用户反馈「300 万血 + 1.5 抵抗的西斯，全服 90% 人打了 5 天，体感与数字不符」）：
       界面上的速率是**百分比/小时**，分母就是该星球自己的 maxHealth，所以
         · 100 万血 / 抵抗 1.5 → 净速率 X %/h
         · 300 万血 / 抵抗 1.5 → 净速率**同样是** X %/h（血量不改变百分比速率）
       但两者的**绝对**进展差了 3 倍。要让"体感"回到数字上，就得回到绝对值：
         施加(血/秒) = 玩家数 × 影响系数 × K ÷ 3600
         回血(血/秒) = 抵抗度% × maxHealth ÷ 3600
       两者的差（净血/秒）换算成"基准球的 %/h"就是等效推进速率 —— 这样 300 万血的星球
       会诚实地显示出"等效只有 1/3 的速度"，与"打 5 天"的体感一致。
     口径出处与实测见交接文档 §19.36；对分母做任何改动都要同步更新 srcHtml() 里的口径表。 */
  const BASE_MAX_HEALTH = 1000000;
  // 相对基准球的血量倍数：>1 表示这颗星球比基准球更"厚"
  const hpRatioOf = (p) => (p && p.maxHealth > 0) ? p.maxHealth / BASE_MAX_HEALTH : 1;
  // 等效推进速率（基准球口径）：净速率 × 血量倍数。
  // 含义 =「同样的绝对投入，放在一颗 100 万血的基准球上，每小时能推进多少 %」
  const eqRateOf = (p) => netOf(p) * hpRatioOf(p);
  const REGION_TYPE_ZH = { Settlement: "定居点", Town: "城镇", City: "城市", MegaCity: "大城市" };
  const REGION_STARS = { Settlement: 1, Town: 2, City: 3, MegaCity: 4 };

  const libPct = (p) => (p && p.maxHealth > 0) ? Math.max(0, Math.min(100, (1 - p.health / p.maxHealth) * 100)) : 0;
  const grossOf = (p) => (p && p.maxHealth > 0 && DATA) ? (p.players || 0) * (DATA.impactMultiplier || 0) * LIB_RATE_K / p.maxHealth * 100 : 0;
  const netOf = (p) => grossOf(p) - (p.resistance || 0);         // 本页没有会话内两次观测，一律"推演"
  const etaOf = (p) => { const r = netOf(p), left = 100 - libPct(p); if (!(r > 0.0005)) return null; const h = left / r; return h <= ETA_MAX_H ? h : null; };
  /* ---- 速率取值：**实测优先**（2026-09-29）-----------------------------------------
     实测数据来自社区 CDN 的 15 分钟帧（由采集脚本落到 ./data/recent/，
     同源读取，见 js/rate-source.js），口径与社区站点的实测差分一致：
       实测净推进 %/h = −(末帧血量 − 首帧血量) ÷ 满血 × 100 ÷ 帧间隔小时
       施加/纯产出    = 实测净推进 + 抵抗度
     拿不到帧就退回本页原有的推演公式（玩家 × 影响系数 × K ÷ 血量 − 抵抗度），并在说明里标注来源。 */
  function rateModel(p) {
    const R = window.HD2Recent;
    const d = R ? R.planetDiag(p) : null;
    if (d && d.ok) {
      const m = d.value;
      return {
        net: m.net, gross: m.gross, res: m.res, resEq: m.resEq,
        eq: m.net * hpRatioOf(p), measured: true, hours: m.hours,
        src: "实测（近 " + (m.hours >= 1.5 ? m.hours.toFixed(1) : "1") + " 小时 CDN 帧差分）",
      };
    }
    const res = Number(p.resistance) || 0;
    const net = netOf(p);
    return {
      net, gross: grossOf(p), res, resEq: res * (p.maxHealth || 0) / 1e6,
      eq: eqRateOf(p), measured: false,
      // 满血顶格时实测看不到变化（净速率必 ≤ 0）——必须说明这是推演兜底，不是"实测 0"
      src: (d && d.reason === "capped")
        ? "推演兜底（满血顶格，实测看不到变化 → 净速率 ≤ 0）：在线玩家 × 影响系数 × " + LIB_RATE_K + " ÷ 血量 − 抵抗度"
        : "推演（在线玩家 × 影响系数 × " + LIB_RATE_K + " ÷ 血量 − 抵抗度"
          + (d && d.reason === "owner" ? "；窗口内易主" : "") + "）",
    };
  }
  function etaOfNet(p, net) {
    const left = Math.max(0, 100 - libPct(p));
    if (!(net > 0.0005)) return null;
    const h = left / net;
    return h <= ETA_MAX_H ? h : null;
  }
  function fmtHours(h) {
    if (h == null) return "—";
    if (h >= 24) return Math.floor(h / 24) + " 天 " + Math.round(h % 24) + " 时";
    if (h >= 1) return Math.floor(h) + " 小时 " + Math.round((h % 1) * 60) + " 分";
    return Math.max(1, Math.round(h * 60)) + " 分";
  }
  // 官方 war_stats 的时间字段是**毫秒**（2026-09-25 用 FRONTERIA 实测：raw 3,176,496,038 ↔
  // companion 页面显示 1M 6D 18h 2m 24s ≈ 3,175,344 秒，比值 1000.4）→ 先 /1000 再格式化。
  // 三年战争的累计值会到 700+ 天，只写「天」不好读 → 按 companion 的粗粒度分档，但写成中文：
  // 年 / 周 / 天 / 时 / 分，最多显示 3 档（跳过前导零）。
  function fmtDuration(ms) {
    if (!ms) return "—";
    let sec = Math.floor(ms / 1000);
    const units = [["年", 365 * 86400], ["周", 7 * 86400], ["天", 86400], ["时", 3600], ["分", 60]];
    const parts = [];
    units.forEach(([label, size]) => {
      const n = Math.floor(sec / size);
      sec -= n * size;
      if (n > 0) parts.push(n + " " + label);
    });
    return parts.length ? parts.slice(0, 3).join(" ") : Math.max(1, Math.floor(ms / 1000)) + " 秒";
  }

  /* ---- 表格助手（数据口径等低频对比表仍用表格；结构沿用站内维基 .info-table 家族） ---- */
  const T = {
    t: (v, cls, title) => `<td${cls ? ` class="${cls}"` : ""}${title ? ` title="${esc(title)}"` : ""}>${v}</td>`,
    r: (cells, cls, attrs) => `<tr${cls ? ` class="${cls}"` : ""}${attrs || ""}>${cells.join("")}</tr>`,
    grp: (label, span) => `<tr class="grp"><td colspan="${span}">${esc(label)}</td></tr>`,
    table: (head, rows, cls) => `<div class="table-wrap"><table class="wtbl${cls ? " " + cls : ""}">`
      + `<thead><tr>${head.map((h) => `<th${h.cls ? ` class="${h.cls}"` : ""}>${esc(h.t)}</th>`).join("")}</tr></thead>`
      + `<tbody>${rows.join("")}</tbody></table></div>`,
  };

  /* ---- 数据状态 ---- */
  let DATA = null, PL_CN = {}, PL_SEC = {}, SEC_CN = {}, WAY = {}, REG_TABLE = {}, REG_ZH = {}, BIOME_IDX = null,
      BIOME_FB = null, EFFECT_CN = {}, EFFECT_DESC = {}, EFFECT_VAR = {}, EFFECT_VAR_ORDER = [], HISTORY = null, P = null, STATS = null;

  const jget = async (url, soft) => {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) { if (soft) return null; throw new Error("HTTP " + r.status + " " + url); }
      return await r.json();
    } catch (e) { if (soft) return null; throw e; }
  };
  const soft = (u) => jget(u, true);

  async function boot() {
    const q = new URLSearchParams(location.search);
    let idx = q.get("idx");
    if (idx == null || idx === "") {
      const byName = q.get("name");
      if (!byName) { fail("缺少参数：请在链接里带上 ?idx=星球序号（例如 <a href='?idx=217'>?idx=217</a>）"); return; }
      const pi = await soft("./tables/planet_index.json") || {};
      idx = Object.keys(pi).find((k) => String(pi[k]).toUpperCase() === String(byName).trim().toUpperCase());
      if (idx == null) { fail("找不到星球：" + esc(byName)); return; }
    }
    const index = Number(idx);
    try {
      DATA = await jget("./data.json");
    } catch (e) { fail("战况数据载入失败：" + esc(e.message) + "（data.json 由 CI 每 5 分钟生成，稍后重试）"); return; }

    // 实测帧（社区 CDN 15 分钟一帧，由采集脚本落到 ./data/recent/）：拿不到不影响页面，
    // 只是速率退回推演。失败要静默 —— 这是一份"锦上添花"的数据。
    try { if (window.HD2Recent) await HD2Recent.load({ base: "./data/recent" }); } catch (_) { }

    P = (DATA.planets || []).find((x) => x.index === index);
    if (!P) { fail("星球序号 " + index + " 不在当前战况数据里。"); return; }

    // 并发拉取静态表（任一失败都不阻断主流程）
    const [sm, way, reg, regZh, bioIdx, bioFb, eff, effDesc, vars, hist] = await Promise.all([
      soft("./tables/starmap.json"), soft("./tables/waypoints.json"),
      soft("./tables/planet_regions.json?v=20261007b"), soft("./tables/planet_regions_zh.json?v=20261007b"),
      soft("./assets/biomes/index.json"), soft("./tables/planet_biomes.json"),
      soft("./tables/effect_id_cn.json"), soft("./tables/galactic_effects.json"),
      soft("./tables/hd2_variables.json"), soft("./data/history/player_distribution.json"),
    ]);
    WAY = (way && way.waypoints) || {};
    REG_TABLE = (reg && reg.planets) || {};
    REG_ZH = (regZh && regZh.planets) || {};
    BIOME_IDX = bioIdx || {}; BIOME_FB = bioFb || {}; EFFECT_CN = eff || {}; EFFECT_DESC = effDesc || {}; HISTORY = hist || null;
    // 行动变量表（tables/hd2_variables.json）：**词条权威源**——按 effect_ids 建索引，
    // 自带 中文名 cn / 中文描述 desc / 所属分组（终结族特殊个体/深域惧像/作战限制/环境条件…）。
    // 覆盖 82 个行星词条 effect id；此前只查 effect_id_cn（名无述）+ galactic_effects（英文名述），
    // 会漏掉「补给不足/缺少飞行员」这类只有该表收录的中文描述（2026-10-26 用户指出后修正）。
    (vars && vars.categories || []).forEach((c) => {
      const g = { cn: c.name || "", en: c.name_en || "" };
      EFFECT_VAR_ORDER.push(g);
      (c.entries || []).forEach((e) => {
        (e.effect_ids || []).forEach((i) => {
          EFFECT_VAR[i] = { cn: e.cn || e.name || "", desc: e.desc || "", en: e.name || "", group: g };
        });
      });
    });
    if (sm && sm.systems) {
      sm.systems.forEach((s) => {
        if (s.name_en && s.name) SEC_CN[String(s.name_en).toUpperCase()] = s.name;
        (s.planets || []).forEach((p) => {
          if (!p.en) return;
          if (p.cn) PL_CN[String(p.en).toUpperCase()] = p.cn;
          if (s.name) PL_SEC[String(p.en).toUpperCase()] = s.name;     // 星球 → 星区（官方 API 的 sector 常为空）
        });
      });
    }
    STATS = ((DATA.war_stats || {}).planets_stats || []).find((s) => s.planetIndex === index) || null;

    document.title = plCn() + "（" + (P.name || "") + "）星球资料 - 绝地潜兵2 真理部";
    setMeta();
    render();
  }

  const plCn = () => PL_CN[String(P.name || "").toUpperCase()] || P.name || ("#" + P.index);
  // 星区：**以 starmap.json 的「该星球属于哪个星区」为准**（游戏内文本：阿基拉分区/AKIRA SECTOR…）。
  // 官方 API 的 P.sector 是另一套 hd2dev 分区名（Sol/Barnard/Tau Ceti/Kronos/Gacrux…），与游戏分区
  // 不符（实测 273 颗里 152 颗为空、有值的 121 颗里仅 8 颗与 starmap 一致）→ 只能兜底，不能优先。
  const secCn = () => PL_SEC[String(P.name || "").toUpperCase()]
    || SEC_CN[String(P.sector || "").toUpperCase()] || (P.sector || "") || "未知星区";
  // 己方星球：官方 API 报满血，直接算 (1-health/maxHealth) 会得到 0%，与"已解放"自相矛盾
  // （星图 §19.24 修过同一类 bug）→ 显示层统一按 100% 处理
  const libShowOf = (o, health, maxHealth) => {
    if (String(o || "").toLowerCase() === "humans") return 100;
    return maxHealth > 0 ? Math.max(0, Math.min(100, 100 * (1 - health / maxHealth))) : null;
  };
  const biomeName = () => P.biome || BIOME_FB[String(P.name || "").toUpperCase()] || "";
  function biomeFile() {
    if (!BIOME_IDX) return null;
    const v = BIOME_IDX[biomeName()];
    if (!v) return null;
    return typeof v === "string" ? v : (v.file || v.img || v.image || null);
  }
  // 星球徽标（assets/planet-icons/<英文名>.png，空格/标点转下划线；缺失时由 onerror 兜底隐藏）
  const iconFile = () => "./assets/planet-icons/" + String(P.name || "").toUpperCase().replace(/[^A-Z0-9]+/g, "_") + ".png";
  const warDeadline = (warTime) => {                 // warTime(秒) → 本地绝对时刻
    const w = (DATA && DATA.war) || {};
    if (!w.time || !DATA.fetchedAt || !warTime) return null;
    return Date.parse(DATA.fetchedAt) + (warTime - w.time) * 1000;
  };

  function setMeta() {
    const t = plCn() + "（" + P.name + "）星球资料 - 绝地潜兵2 真理部";
    const camp = (DATA.campaigns || []).find(c => c.planet?.index === P.index);
    const defense = window.HD2Forecast?.isDefense(camp) || (DATA.planet_events || []).some(e => e.planetIndex === P.index && e.eventType === 1);
    const progress = defense ? "防守进度 " + (camp?.defendersProgress == null ? "未知" : Number(camp.defendersProgress).toFixed(2) + "%") : "已解放 " + libPct(P).toFixed(2) + "%";
    const d = "绝地潜兵2 星球资料 · " + plCn() + "（" + P.name + "）："
      + secCn() + "星区 · 归属 " + (OWN_CN[P.currentOwner] || P.currentOwner || "未知")
      + " · " + progress + " · 在线玩家 " + fmt(P.players)
      + "。含战役与战略分析、下属区域、星球统计、环境条件与补给线。";
    const url = location.origin + location.pathname + "?idx=" + P.index;
    const set = (sel, val) => { const e = document.querySelector(sel); if (e) e.setAttribute("content", val); };
    set('meta[name="description"]', d);
    set('meta[property="og:title"]', t); set('meta[name="twitter:title"]', t);
    set('meta[property="og:description"]', d); set('meta[name="twitter:description"]', d);
    set('meta[property="og:url"]', url);
    const l = document.querySelector('link[rel="canonical"]'); if (l) l.setAttribute("href", url);
    const ld = document.createElement("script");
    ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({
      "@context": "https://schema.org", "@type": "WebPage", name: t, description: d, url: url,
      inLanguage: "zh-CN", isPartOf: { "@type": "WebSite", name: "绝地潜兵2 · 真理部", url: location.origin + "/" }
    });
    document.head.appendChild(ld);
  }

  function fail(msg) {
    const l = $("loading"); if (l) l.remove();
    $("app").innerHTML = `<div class="card"><div class="error">⚠️ ${msg}</div></div>`
      + `<p class="note" style="padding:0 4px">可以回到 <a href="./galaxy-map-v2.html">银河星图</a> 或 <a href="./index.html">主站面板</a>。</p>`;
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    const l = $("loading"); if (l) l.remove();
    const owner = P.currentOwner || "Humans";
    const color = OWNER_COLOR[owner] || "#64748b";
    const camp = (DATA.campaigns || []).find((c) => c.planet && c.planet.index === P.index) || null;
    const ev = (DATA.planet_events || []).find((e) => e.planetIndex === P.index) || null;
    const isDef = !!(camp && (String(camp.campaignType).toLowerCase() === "defense" || camp.type === 1 || camp.type === 4))
               || !!ev;
    const humanOwned = String(P.currentOwner || "Humans").toLowerCase() === "humans";
    const showLib = humanOwned && !isDef;
    const defense = isDef && camp ? window.HD2Forecast?.defense(camp) || null : null;

    const total = (DATA.player_distribution && DATA.player_distribution.total) || 0;

    // 速率一律走 rateModel：实测优先，拿不到才推演（见文件顶部的说明）
    const rm = rateModel(P);

    const status = isDef ? { cn: "⚠ 防御战 · 入侵中", cls: "def" }

      : camp ? { cn: String(camp.campaignType).toLowerCase() === "defense" ? "入侵 · 防御战役" : "解放战役", cls: "warn" }
      : { cn: "无战役 · 待命", cls: "" };

    document.documentElement.style.setProperty("--fcd", color);

    $("app").innerHTML = `
      ${heroHtml({ color, status, camp, ev, isDef, showLib, defense, lib, rm, r, eta, eqRate, hpRatio, share })}

            <div class="body">${warHtml(camp, ev, color, { rm, r, eta, defense, isDef, showLib })}</div>
          </section>
          <section class="card" id="sec-links" aria-labelledby="h-links">
            <h2 id="h-links">补给线 / 相邻星球 <span class="en">LINKED PLANETS</span></h2>
            <div class="body">${linksHtml()}</div>
          </section>
        </div>
        <div class="col-m">
          <section class="card" id="sec-trend" aria-labelledby="h-trend">
            <h2 id="h-trend">全服趋势 <span class="en">GALAXY TREND · 非单星球历史</span></h2>
            <div class="body">${trendHtml(camp, isDef)}</div>
          </section>
          <section class="card" id="sec-regions" aria-labelledby="h-regions">
            <h2 id="h-regions">下属区域（城市 / 超大型工厂） <span class="en">REGIONS</span></h2>
            <div class="body" id="rg-body">${regionsHtml()}</div>
          </section>
        </div>
        <div class="col-r">
          <section class="card" id="sec-stats" aria-labelledby="h-stats">
            <h2 id="h-stats">星球统计 <span class="en">PLANET STATISTICS</span></h2>
            <div class="body">${statsHtml()}</div>
          </section>
        </div>
      </div>

      <!-- ⑥ 环境与词条 -->
      <section class="card" id="sec-env" style="margin-top:14px" aria-labelledby="h-env">
        <h2 id="h-env">环境与作战参数 <span class="en">OPERATIONAL PARAMETERS</span></h2>
        <div class="body">${envHtml()}</div>
      </section>

      <!-- ⑨ 数据口径（默认折叠；POI / 行星剧情 / 战术行动未接入） -->

        <summary>数据口径 <span class="en">SOURCES</span></summary>
        <div class="body note">${srcHtml()}</div>
      </details>`;

    $("stamp").textContent = "更新于 " + (DATA.fetchedAt ? new Date(DATA.fetchedAt).toLocaleString("zh-CN", { hour12: false }) : "—");
    $("foot-note").innerHTML = `${esc(plCn())}（${esc(P.name)}）· 序号 ${P.index} · 页面生成于 ${new Date().toLocaleString("zh-CN", { hour12: false })}`;
    bindRegions();
    paintTrend();
  }

  /* ---- A. Command Hero：身份（左）+ 解放环（中）+ Quick Intel（右）+ 细粒度进度条 ---- */

  const owner0 = () => P.currentOwner || "Humans";

  /* ---- 顶部来源徽标（完整口径在页底 #sec-src） ---- */
  function badgesHtml(rm) {
    const calc = rm.measured ? "实测帧" : "推演";
    return `
      <div class="srcbadges" aria-label="数据来源徽标">
        <span class="sbadge"><i></i>官方战况 API</span>

  /* ---- B. 战略态势：终点线 / 抵抗 / 净速率 / 每小时回血 / 是否足够 / 实测or推演 ---- */
  function warHtml(camp, ev, color, ctx) {
    const { rm, r, eta, defense, isDef, showLib } = ctx;
    const L = (k, v, sub, cls) => `<div class="line"><span class="k">${k}</span>
      <span class="v${cls ? " " + cls : ""}">${v}${sub ? `<small>${sub}</small>` : ""}</span></div>`;
    let out = "";

    if (defense) {
      out += L("当前战役", `战役 #${esc(camp.id)} · 防御战`, `入侵方 ${esc(OWN_CN[camp.faction] || camp.faction || "—")}`);
      out += L("终点线（防守进度）", defense.def == null ? "—" : defense.def.toFixed(2) + "%", "战役事件防守进度，非星球本体血量");
      out += L("敌方入侵进度", defense.atk == null ? "—" : defense.atk.toFixed(2) + "%", "敌方固定时间进度");
      out += L("防守速率", defense.rate == null ? "—" : defense.rate.toFixed(3) + "%/h", esc(defense.source));
      out += L("所需防守速率", defense.requiredRate == null ? "—" : defense.requiredRate.toFixed(3) + "%/h", "守住所需的最低速率");
      out += L("截止时预计", defense.projected == null ? "—" : defense.projected.toFixed(2) + "%",
        "预计战役结果：" + (defense.win === true ? "守住" : defense.win === false ? "失守" : "数据不足"),
        defense.win === true ? "ok" : defense.win === false ? "bad" : "");
      out += L("预计完成防守", HD2Forecast.duration(defense.etaH), esc(defense.source));
      out += `<div>${HD2Forecast.defenseHtml(camp, DATA, P)}</div>`;
    } else if (camp) {
      out += L("当前战役", `战役 #${esc(camp.id)} · 解放战`, `对阵 ${esc(OWN_CN[camp.faction] || camp.faction || "—")}`);
      out += L("终点线（解放进度）", libPct(P).toFixed(2) + "%", `血量 ${fmt(P.health)} / ${fmt(P.maxHealth)}`);
      out += L("敌方抵抗", rm.res != null ? rm.res.toFixed(2) + "%/h" : "—",
        "等效抵抗度 " + rm.resEq.toFixed(2) + "%（100 万血基准）");
      out += L("净速率", (r >= 0 ? "+" : "") + r.toFixed(3) + "%/h", esc(rm.src), r > 0.0005 ? "ok" : "bad");
      out += L("每小时回血", fmt(rm.res / 100 * (P.maxHealth || 0)) + " HP/h", "抵抗度% × 血量（推演口径的绝对值）");
      out += L("当前速率是否足够",
        eta != null ? "足够" : "不足",
        eta != null ? "预计 " + fmtHours(eta) + " 后解放" : "净速率 ≤ 0 或预计超出 30 天",
        eta != null ? "ok" : "bad");
    } else if (ev) {
      const dl = warDeadline(ev.expireTime);
      const left = dl ? Math.max(0, dl - Date.now()) : null;
      const prog = ev.maxHealth > 0 ? Math.max(0, Math.min(100, (1 - ev.health / ev.maxHealth) * 100)) : null;
      out += L("星球事件", `${ev.eventType === 1 ? "防御战 · 入侵" : "事件类型 " + ev.eventType}`,
        `发起方 ${esc(RACE_CN[ev.race] || ev.race || "—")}`);
      out += L("终点线", prog == null ? "—" : prog.toFixed(2) + "%", `血量 ${fmt(ev.health)} / ${fmt(ev.maxHealth)}`);
      if (left != null) out += L("剩余时间", fmtHours(left / 3600000));
    } else {
      out += `<p class="empty">该星球当前没有进行中的战役或事件（无战役 · 待命）。</p>`;
      out += L("敌方抵抗", rm.res != null ? rm.res.toFixed(2) + "%/h" : "—", "无战役时仍存在的回血能力（推演口径）");
    }

    // 补给线战略提示：仅当能从 waypoints + 归属 + 战役表**确定**时显示，否则不渲染
    const hint = supplyHint();
    if (hint) out += `<div class="hint">⇄ ${hint}</div>`;

    out += `<p class="note" style="margin-top:10px">防御战使用战役事件的防守进度，不使用己方星球本体血量。预测优先采用实测防守速率，缺失时采用开战以来平均速率；解放战采用实测优先、推演兜底的净推进速率。</p>`;
    return `<div class="sit">${out}</div>`;
  }

  /* 补给线提示（可推导才显示）：
     1) 本星球为敌方控制、无战役，且相邻星球全部为敌方控制 → 无法发动解放战役（需先打通相邻星球）。
     2) 本星球有战役，且相邻存在「敌方控制且有战役」的星球 → 相邻战线提示（只列事实，不预测因果）。 */
  function supplyHint() {
    const ns = WAY[String(P.index)] || WAY[P.index] || [];
    if (!ns.length) return "";
    const byIdx = (i) => (DATA.planets || []).find((x) => x.index === i) || null;
    const isHuman = (i) => { const q = byIdx(i); return q && String(q.currentOwner || "").toLowerCase() === "humans"; };
    const hasCamp = (i) => (DATA.campaigns || []).some((c) => c.planet && c.planet.index === i);
    const ours = String(P.currentOwner || "").toLowerCase() === "humans";
    const campHere = (DATA.campaigns || []).some((c) => c.planet && c.planet.index === P.index);
    if (!ours && !campHere && !(DATA.planet_events || []).some((e) => e.planetIndex === P.index)
        && ns.length && !ns.some((i) => isHuman(i))) {
      const names = ns.slice(0, 3).map((i) => { const q = byIdx(i); return q ? (PL_CN[String(q.name || "").toUpperCase()] || q.name) : ("#" + i); });
      return `该星球当前没有我方补给线连接（相邻 ${ns.length} 颗均为敌方控制，如 ${names.join("、")}），无法对其发动解放战役——需先解放相邻星球打通补给线。`;
    }
    if (campHere) {
      const hot = ns.filter((i) => { const q = byIdx(i); return q && !isHuman(i) && hasCamp(i); });
      if (hot.length) {
        const names = hot.slice(0, 3).map((i) => { const q = byIdx(i); return q ? (PL_CN[String(q.name || "").toUpperCase()] || q.name) : ("#" + i); });
        return `相邻星球中 ${hot.length} 颗当前也有战役（${names.join("、")}${hot.length > 3 ? " 等" : ""}）——多线作战时注意分配兵力。`;
      }
    }
    return "";
  }

  /* ---- C. 全服趋势：当前战役摘要 + 主图 + 口径 ---- */
  function trendHtml(camp, isDef) {
    const h = HISTORY && HISTORY.history;
    const sum = camp
      ? `<b>战役 #${esc(camp.id)}</b> · ${isDef ? "防御战" : "解放战"} · ${esc(OWN_CN[camp.faction] || camp.faction || "—")} · 进度见左栏「战略态势」`
      : `当前无进行中战役 · 全服战线分布如下`;
    if (!h || !h.length) return `<div class="trend-sum">${sum}</div><p class="empty">没有全服历史数据（<code>data/history/player_distribution.json</code>）。</p>`;
    return `<div class="trend-sum">${sum}</div>
      <canvas id="trend" class="chart" width="720" height="300" role="img"
        aria-label="全服在线玩家按阵营分布的趋势折线图，最近 ${Math.min(h.length, 72)} 个采样点"></canvas>
      <div class="legend">
        <span><i style="background:var(--humans)"></i>超级地球</span>
        <span><i style="background:var(--terminids)"></i>终结族</span>
        <span><i style="background:var(--automaton)"></i>机器人</span>
        <span><i style="background:var(--illuminate)"></i>光能者</span>
        <span class="dash"><i></i>全服合计</span>
        <span style="color:var(--mute)">共 ${h.length} 个采样点</span>
      </div>
      <p class="note" style="margin-top:8px">这是<b>全服</b>在线玩家按战线的分布趋势（最近若干小时），<b>不是这颗星球的历史曲线</b> ——
      官方 API 不提供单星球的历史曲线，只有当前快照。虚线为四阵营之和。</p>`;
  }

  function paintTrend() {
    const cv = $("trend"); if (!cv || !cv.getContext) return;
    const h = ((HISTORY && HISTORY.history) || []).slice(-72);
    if (h.length < 2) return;
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height, padL = 44, padR = 10, padT = 12, padB = 22;
    const keys = [["Humans", "#5BA3D0"], ["Terminids", "#F5C518"], ["Automaton", "#D6806D"], ["Illuminate", "#CF64F8"]];
    let max = 0;
    h.forEach((s) => { let t = 0; keys.forEach(([k]) => { t += (s.factions || {})[k] || 0; }); max = Math.max(max, s.totalPlayers || t, t); });
    max = max || 1;
    const X = (i) => padL + (W - padL - padR) * i / (h.length - 1);
    const Y = (v) => padT + (H - padT - padB) * (1 - v / max);
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "#242424"; ctx.lineWidth = 1;
    for (let g = 0; g <= 4; g++) {
      const v = max * g / 4, y = Y(v);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillStyle = "#6E6E6E"; ctx.font = "11px sans-serif"; ctx.textAlign = "right";
      ctx.fillText(Math.round(v / 1000) + "k", padL - 6, y + 4);
    }
    // 颜色之外再加线型区分（可访问性）：终结族/光能者用虚线变体
    const dashOf = { Humans: [], Terminids: [7, 3], Automaton: [2, 3], Illuminate: [10, 4, 2, 4] };
    keys.forEach(([k, color]) => {
      ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash(dashOf[k] || []);
      h.forEach((s, i) => { const v = (s.factions || {})[k] || 0; if (i === 0) ctx.moveTo(X(i), Y(v)); else ctx.lineTo(X(i), Y(v)); });
      ctx.stroke(); ctx.setLineDash([]);
    });
    ctx.beginPath(); ctx.strokeStyle = "#EDEDED"; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
    h.forEach((s, i) => { const v = s.totalPlayers || 0; if (i === 0) ctx.moveTo(X(i), Y(v)); else ctx.lineTo(X(i), Y(v)); });
    ctx.stroke(); ctx.setLineDash([]);
    const t0 = h[0].timestamp ? new Date(h[0].timestamp) : null, t1 = h[h.length - 1].timestamp ? new Date(h[h.length - 1].timestamp) : null;
    if (t0 && t1) {
      ctx.fillStyle = "#6E6E6E"; ctx.font = "11px sans-serif";
      ctx.textAlign = "left"; ctx.fillText(t0.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit" }), padL, H - 6);
      ctx.textAlign = "right"; ctx.fillText(t1.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit" }), W - padR, H - 6);
    }
  }

  /* ---- D. 星球统计：KPI 卡片组（长口径折叠） ---- */
  function statsHtml() {
    if (!STATS) return `<p class="empty">该星球暂无累计统计（官方 <code>war_stats.planets_stats</code> 里没有这一条；通常是从未被打过的星球）。</p>`;
    const s = STATS;
    const won = s.missionsWon || 0, lost = s.missionsLost || 0, tot = won + lost;
    const rate = tot > 0 ? won / tot * 100 : (s.missionSuccessRate || 0);
    const shots = s.bulletsFired || 0, hits = s.bulletsHit || 0;
    const accident = s.friendlies || 0, deaths = s.deaths || 0;
    // ⚠ 击杀是**该星球自本场战争开战以来的累计值**，不是"当前控制方造成的"：
    //   星球三年里反复易主，所以机器人星球上也会留下当年打终结族的旧账
    //   （实测 300 颗星球里 210 颗三个阵营都有击杀；三类击杀之和恰好等于全服总数）。
    //   companion 的做法是**只显示与控制方对应的那一类**（MARFARK 只显示 Dead Automatons），
    //   本页照此办理：主打一张卡 + 其余历史累计折叠 —— 既对齐 companion，
    //   也不会让人误以为"机器人星球上在打虫子"。
    const kills = [
      { key: "terminids", cn: "终结族", v: s.bugKills || 0 },
      { key: "automaton", cn: "机器人", v: s.automatonKills || 0 },
      { key: "illuminate", cn: "光能者", v: s.illuminateKills || 0 },
    ];
    const ownerKey = String(P.currentOwner || "").toLowerCase();
    const ownerMatch = kills.find((k) => k.key === ownerKey) || null;
    const mainKill = ownerMatch || kills.slice().sort((a, b) => b.v - a.v)[0];
    const otherKills = kills.filter((k) => k !== mainKill && k.v > 0);
    const killNote = ownerMatch ? "当前控制方" : "历史主要交战阵营（现由" + (OWN_CN[P.currentOwner] || P.currentOwner || "未知") + "控制）";
    const pc = (k, v, s2, hero) => `<div class="pc${hero ? " hero-v" : ""}"><div class="k">${k}</div><div class="v">${v}</div>${s2 ? `<div class="s">${s2}</div>` : ""}</div>`;
    return `
      <div class="pgrp">任务</div>
      <div class="pcards">
        ${pc("任务完成", fmt(won), tot ? "成功率 " + rate.toFixed(1) + "%" : "—")}
        ${pc("任务失败", fmt(lost), tot ? "占 " + (100 - rate).toFixed(1) + "%" : "—")}
        ${pc("成功率", rate.toFixed(1) + "%", tot ? fmt(tot) + " 场" : "无任务记录")}
        ${pc("累计任务时长", fmtDuration(s.missionTime), "全部玩家累计")}
      </div>
      <div class="pgrp">火力</div>
      <div class="pcards">
        ${pc("开火", fmt(shots), "累计发数")}
        ${pc("命中", fmt(hits), "累计")}
        ${pc("命中 / 开火", shots ? (hits / shots * 100).toFixed(1) + "%" : "—", shots ? fmt(hits) + " / " + fmt(shots) : "无开火记录")}
      </div>
      <div class="pgrp">战果</div>
      <div class="pcards">
        ${pc(mainKill.cn + "击杀", fmt(mainKill.v), killNote, true)}
        ${pc("其他阵营历史累计", otherKills.length ? otherKills.map((k) => k.cn + " " + fmt(k.v)).join(" · ") : "—", "跨阵营数字成因见下方口径")}
      </div>
      <div class="pgrp">伤亡</div>
      <div class="pcards">
        ${pc("阵亡绝地潜兵", fmt(deaths))}
        ${pc("误伤", fmt(accident), deaths ? "占阵亡 " + (accident / Math.max(1, deaths) * 100).toFixed(1) + "%" : "—")}
        ${pc("误伤比例", deaths ? (accident / Math.max(1, deaths) * 100).toFixed(1) + "%" : "—")}
        ${pc("复活", fmt(s.revives || 0))}
      </div>
      <details class="note-det">
        <summary>口径说明（跨阵营击杀 / 命中率 &gt;100% / 时间单位）</summary>
        <div class="note">口径：与官方 API <code>war_stats.planets_stats</code> 一致（本场战争开战以来累计），与 companion 的星球统计同源。
        <b>击杀按星球累计、不按阵营归属</b>，所以一颗星球上会同时留下多个阵营的数字
        （实测 300 颗星球里 210 颗三个阵营都有击杀，且三类之和恰好等于全服总数）。
        ⚠ 这类「跨阵营」数字的成因<b>尚未定论</b>：既可能是历史上反复易主留下的旧账，
        也有人反馈存在异常刷怪（如修改客户端刷怪）导致某一类数字被推高，全部星球都可见这种现象。
        本站照实呈现原始数据、不做归属推断，也不修正。主卡只取与控制方对应的那一类，其余折叠展示。
        「命中率 &gt; 100%」是官方原始数据的特征（多弹丸武器按发/弹计数口径不同），照实呈现不修正；时间字段单位是毫秒。</div>
      </details>`;
  }

  /* ---- E. 环境与作战参数：环境视觉卡 + 词条（短标签 + 可展开详情） ---- */
  function envHtml() {
    const file = biomeFile();
    const img = file
      ? `<div class="biome"><img src="./assets/biomes/${esc(file)}" alt="${esc(biomeName())}环境图" loading="lazy" decoding="async"
             onerror="this.parentElement.classList.add('noimg');this.remove()"><div class="cap">${esc(biomeName() || "环境")}</div></div>`
      : `<div class="biome noimg">${esc(biomeName() || "未知环境")}（无环境图）</div>`;
    // 词条权威链（2026-10-26 修正）：hd2_variables（中文名+中文描述+分组，82 id）
    //   → effect_id_cn（中文名，191 id）→ galactic_effects（英文名/英文描述）
    //   → 原始 id。多个 id 映射同一词条时取链上第一个命中并去重（如霸王虫 1307/1308）。
    const seen = {};
    const fx = [];
    (P.activeEffects || []).forEach((id) => {
      const v = EFFECT_VAR[id];
      const cn = (v && v.cn) || EFFECT_CN[String(id)] || "";
      if (cn && seen[cn]) return;
      if (cn) seen[cn] = true;
      const meta = EFFECT_DESC[String(id)] || {};
      fx.push({
        id,
        cn: cn || ("效果 #" + id),
        known: !!cn,
        desc: (v && v.desc) || "",                      // 中文描述（hd2_variables）
        en: (v && v.en) || meta.name || "",
        enDesc: meta.description || "",                 // 英文描述（galactic_effects，补充用）
        group: v ? v.group : null,
      });
    });
    const fxCard = (f) => `<details class="fx"><summary>⚡ ${esc(f.cn)}</summary>
          <div class="fxd">效果 ID <b>${f.id}</b>${f.en ? ` · EN <b>${esc(f.en)}</b>` : ""}
          ${f.desc ? `<br>${esc(f.desc)}` : f.enDesc ? `<br><span class="mini">${esc(f.enDesc)}</span>` : "<br>（站内表未收录该效果说明）"}</div></details>`;
    // 分组（2026-10-26 用户口径）：只给「变种类」与「作战限制」两组保留分组标题；
    // 其余词条（深域惧像/环境条件/设施与场所/DSS战略行动/入侵等级等）不分类，
    // 平铺在最下方，不再加组头。
    const VARIANT_GROUPS = new Set([
      "终结族变种", "终结族特殊个体", "机器人军团", "机器人特殊单位", "机器人辅助军团",
      "友军火力", "光能者宗派",
    ]);
    const keepGroup = (g) => g && (VARIANT_GROUPS.has(g.cn) || g.cn === "作战限制");
    const groups = [];
    EFFECT_VAR_ORDER.forEach((g) => {
      if (!keepGroup(g)) return;
      const rows = fx.filter((f) => f.group && f.group.cn === g.cn);
      if (rows.length) groups.push({ cn: g.cn, en: g.en, rows });
    });
    const rest = fx.filter((f) => !keepGroup(f.group));
    const groupHtml = groups.map((g) => `
          <div style="margin-bottom:10px">
            <div class="k" style="font-size:.7rem;color:var(--yellow);letter-spacing:.1em;margin-bottom:6px">${esc(g.cn)}${g.en ? ` <span style="color:var(--mute);letter-spacing:.14em">${esc(g.en)}</span>` : ""}</div>
            <div class="fxlist">${g.rows.map(fxCard).join("")}</div>
          </div>`).join("");
    const restHtml = rest.length
      ? `<div class="fxlist" style="margin-bottom:6px">${rest.map(fxCard).join("")}</div>`
      : "";
    const tags = (groups.length || rest.length)
      ? groupHtml + restHtml
      : `<p class="empty">当前没有生效中的星球效果（词条）。</p>`;
    return `<div class="env-grid">
      <div>${img}
        <p class="note" style="margin-top:8px">环境图来自 <code>assets/biomes/</code>（随仓库提交）；生态名优先取官方 API 的 <code>biome</code>，
        缺失时回退 <code>tables/planet_biomes.json</code>。</p></div>
      <div>
        <div class="k" style="font-size:.72rem;color:var(--mute);margin-bottom:8px">生效效果 / 词条（点开看 ID 与说明）</div>
        <div>${tags}</div>
        <p class="note" style="margin-top:10px">词条与中文说明优先取 <code>tables/hd2_variables.json</code>（行动变量对照表，
        自带分组：终结族特殊个体 / 深域惧像 / 作战限制 / 环境条件 / 设施与场所等）；中文名兜底 <code>tables/effect_id_cn.json</code>；
        英文名与英文说明取 <code>tables/galactic_effects.json</code>。三级都未收录的 id 照实显示原始编号，不猜测名称。</p>
      </div></div>`;
  }

  /* ---- F. 下属区域：紧凑行 + 展开（保留原有交互与速率口径） ---- */
  function regionsHtml() {
    if (!window.HD2Regions) return `<p class="empty">区域信息暂不可用</p>`;
    const st = REG_TABLE[String(P.index)];
    if (!st || !st.regions || !st.regions.length) return `<p class="empty">静态表里没有这颗星球的区域数据（<code>tables/planet_regions.json</code> 覆盖 84 颗有城市/工厂的星球）。</p>`;
    const zhMap = REG_ZH[String(P.index)] || {};
    const rows = [];
    st.regions.forEach((rg, k) => {
      const lv = HD2Regions.live(P, k);
      const typeOf = String(rg.region_type || "").toLowerCase() === "megafactory" ? "Megafactory" : (rg.size || "");
      const typeCn = typeOf === "Megafactory" ? "超大型工厂" : (REGION_TYPE_ZH[typeOf] || typeOf || "区域");
      const stars = REGION_STARS[typeOf] || 0;
      const mh = (lv && lv.maxHealth) || 0;
      // 己方星球在"无区域战役"时官方不下发 regions[] → 逐条只能是"—"；整颗星球都是我们的，
      // 故我方星球一律记 100%（有运行时数据时仍以运行时为准，例如某区域还在打）。
      const ours = String(P.currentOwner || "").toLowerCase() === "humans";
      let p = lv ? libShowOf(lv.owner, lv.health, mh) : null;
      if (p == null && ours) p = 100;
      // 归属：有运行时数据用运行时；没有则用静态表（wiki Lua 模块，字段是英文原名）——
      // 己方星球直接记「超级地球」（静态表的 owner 是抓取当时的阵营，早就过期了，
      // 之前这里会显示 "Terminids" 这种英文原名，与旁边 100% 自相矛盾）。
      const ownerCn = (lv && lv.owner) ? (OWN_CN[lv.owner] || lv.owner)
        : (ours ? "超级地球" : (OWN_CN[rg.owner] || rg.owner || "—"));
      const zh = zhMap[rg.name] || "";
      // 区域速率三件套：抵抗度 / 实际推进 / 预计解放（实测优先，见 regionRateOf）
      const rr = regionRateOf(lv);
      let rEta = "—", rEtaCls = "";
      if (rr) {
        const left = (p == null) ? null : Math.max(0, 100 - p);
        const h = (rr.net > 0.0005 && left != null) ? left / rr.net : null;
        if (h != null && h <= ETA_MAX_H) rEta = fmtHours(h);
        else if (h != null) rEta = "超过 30 天";
        else { rEta = "不会解放"; rEtaCls = "warn"; }
      }
      rows.push(`
        <button type="button" class="rgc" data-d="${k}" aria-expanded="false">
          <span class="rgn">${typeOf === "Megafactory" ? "🏭" : "🏙"} ${esc(zh || rg.name)}${zh ? `<span class="sub">${esc(rg.name)}</span>` : ""}</span>
          <span class="rgt">${esc(ownerCn)} · ${esc(typeCn)} <span class="stars">${"★".repeat(stars)}</span></span>
          <span class="num" title="在线玩家">${lv && lv.players ? fmt(lv.players) : "—"}</span>
          <span class="num hi" title="已解放（己方控制 = 100%）">${p == null ? "—" : p.toFixed(2) + "%"}</span>
          <span class="num eta ${rEtaCls}" title="${rr ? "抵抗 " + rr.res.toFixed(2) + "%/h · " + (rr.measured ? "实测" : "推演") + "净推进 " + (rr.net >= 0 ? "+" : "") + rr.net.toFixed(3) + "%/h" : "无区域战役"}">
            ${rr ? (rr.net >= 0 ? "+" : "") + rr.net.toFixed(2) + "%/h · " + rEta : "—"}</span>
        </button>
        <div class="rgd" data-d="${k}" hidden>
          ${rg.desc ? esc(rg.desc) : "<span class='mini'>（该区域没有说明文本）</span>"}
          ${HD2Regions.html(HD2Regions.info(P, k, rg, DATA))}
          <div class="mini" style="margin-top:6px">类型 ${esc(typeCn)}（上游 <code>${esc(rg.size || rg.region_type || "—")}</code>）
            · 血量 ${fmt(lv ? lv.health : null)} / ${fmt(lv ? lv.maxHealth : null)}
            · 抵抗度 ${rr ? rr.res.toFixed(2) + "%/h（等效 " + rr.resEq.toFixed(2) + "%/h，100 万血基准）" : "—"}
            · 实际推进 ${rr ? (rr.net >= 0 ? "+" : "") + rr.net.toFixed(3) + "%/h（" + (rr.measured ? "实测：社区 CDN 15 分钟帧首尾差" : "推演：区域玩家 × 影响系数 × K ÷ 区域血量 − 区域抵抗度") + "）" : "—"}
            · 预计解放 ${rEta}${lv && lv.isAvailable ? " · 可部署" : ""}</div>
        </div>`);
    });
    return `
      <div class="rghead" aria-hidden="true"><span>区域</span><span>归属 · 类型</span><span style="text-align:right">玩家</span><span style="text-align:right">已解放</span><span style="text-align:right">推进 · 预计</span></div>
      ${rows.join("")}
      <p class="note" style="margin-top:10px">点任意行展开该区域的说明、规则与血量。区域进度与星图同口径（己方控制 = 100%）；
      速率<b>实测优先</b>（社区 CDN 15 分钟帧），拿不到才用推演公式，展开后有逐项说明。</p>`;
  }

  /* 区域速率：实测优先，拿不到退回推演。已归我方的区域没有"推进"可言 → 返回 null。（与重构前一致） */
  function regionRateOf(lv) {
    if (!lv || !(lv.maxHealth > 0)) return null;
    if (String(lv.owner || "").toLowerCase() === "humans") return null;
    const R = window.HD2Recent;
    const d = R ? R.regionDiag(P.index, lv) : null;
    if (d && d.ok) {
      const m = d.value;
      return { gross: m.gross, res: m.res, resEq: m.resEq, net: m.net, measured: true, hours: m.hours, why: "" };
    }
    const meta = R ? R.regionMeta(P.index, lv) : null;
    if (!meta) return null;
    const gross = (lv.players || 0) * ((DATA && DATA.impactMultiplier) || 0) * LIB_RATE_K / lv.maxHealth * 100;
    return {
      gross, res: meta.res, resEq: meta.resEq, net: gross - meta.res, measured: false,
      why: d ? d.reason : "noframes",
    };
  }

  /* ---- G. 补给线：紧凑行 + 由现有字段推导状态 ---- */
  function linksHtml() {
    const ns = WAY[String(P.index)] || WAY[P.index] || [];
    if (!ns.length) return `<p class="empty">该星球没有登记补给线（<code>tables/waypoints.json</code> 覆盖 186 颗星球 / 341 条连接）。</p>`;
    const rows = ns.map((i) => {
      const q = (DATA.planets || []).find((x) => x.index === i) || { index: i, name: "#" + i };
      const cn = PL_CN[String(q.name || "").toUpperCase()] || q.name;
      const o = q.currentOwner || "None";
      const l = libShowOf(o, q.health, q.maxHealth);
      const hasCamp = (DATA.campaigns || []).some((c) => c.planet && c.planet.index === i);
      // 状态只从已有字段推导：超级地球控制 / 敌方控制 / 当前有战役（叠加显示，不引入社区站点的中转站语义）
      const chips = [];
      if (String(o).toLowerCase() === "humans") chips.push(`<span class="stchip"><i style="background:var(--humans)"></i>超级地球控制</span>`);
      else if (o !== "None") chips.push(`<span class="stchip"><i style="background:${OWNER_COLOR[o] || "#94a3b8"}"></i>${esc(OWN_CN[o] || o)}</span>`);
      if (hasCamp) chips.push(`<span class="stchip" style="color:var(--yellow);border-color:rgba(245,197,24,.5)"><i style="background:var(--yellow)"></i>当前有战役</span>`);
      return `<div class="lk">
        <div class="nm"><a href="./planet.html?idx=${i}">⇄ ${esc(cn)}</a><span class="sub">#${i} · ${esc(q.name || "")}</span></div>
        <div class="st"><span class="pct">${l == null ? "—" : l.toFixed(1) + "%"}</span><span style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${chips.join("")}</span></div>
      </div>`;
    }).join("");
    return rows + `<p class="note" style="margin-top:10px">补给线两端同为超级地球时可用于跨星球支援；点星球名进入它的资料页。状态仅由当前归属与战役表推导。</p>`;
  }

  /* ---- 交互：区域展开（键盘可达：button + aria-expanded） ---- */
  function bindRegions() {
    const body = $("rg-body"); if (!body) return;
    body.addEventListener("click", (ev) => {
      const row = ev.target.closest ? ev.target.closest("button.rgc") : null;
      if (!row) return;
      const k = row.getAttribute("data-d");
      const d = body.querySelector(`.rgd[data-d="${k}"]`);
      if (!d) return;
      const on = d.hidden;
      body.querySelectorAll("button.rgc").forEach((b) => b.setAttribute("aria-expanded", "false"));
      d.hidden = !on;
      row.setAttribute("aria-expanded", String(on));
    });
  }

  boot();
  </script>
</body>
</html>
