<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>银河星图 · 原型 — HD2 真理部</title>
<style>
  :root {
    --bg-deep: #0B0E14; --bg-mid: #141B33; --bg-card: rgba(255,255,255,.05);
    --border: rgba(255,255,255,.08); --border-h: rgba(255,255,255,.16);
    --text: #e2e8f0; --text-dim: #94a3b8; --text-mute: #64748b;
    --yellow: #f5c518; --blue: #3b82f6; --radius: 12px; --radius-s: 8px;
    --c-humans: #5BA3D0; --c-terminids: #F5C518; --c-automaton: #D6806D; --c-illuminate: #CF64F8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg-deep); color: var(--text);
    font-family: "SourceHanSans", "Microsoft YaHei", "PingFang SC", sans-serif; overflow: hidden; }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 20px;
    border-bottom: 1px solid var(--border); background: var(--bg-mid); }
  header h1 { font-family: "ZZZ-thick", "SourceHanSans", sans-serif; font-size: 1.1rem; color: var(--yellow); }
  header .proto-tag { background: var(--yellow); color: #1a1a00; font-weight: 700; border-radius: 999px;
    padding: 2px 10px; font-size: .7rem; }
  header .stats { margin-left: auto; color: var(--text-mute); font-size: .78rem; display: flex; gap: 14px; flex-wrap: wrap; }
  header button { background: rgba(255,255,255,.06); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: .8rem; }
  header button:hover { border-color: var(--blue); color: var(--blue); }
  header a { color: var(--blue); text-decoration: none; font-size: .8rem; }

  main { flex: 1; display: flex; min-height: 0; }
  #viewport { flex: 1; position: relative; overflow: hidden; cursor: grab; }
  #viewport.dragging { cursor: grabbing; }
  svg { width: 100%; height: 100%; display: block; }
  .supply { stroke: rgba(255,255,255,.07); stroke-width: .0035; }
  .supply.atk { stroke: rgba(239, 68, 68, .55); stroke-width: .006; stroke-dasharray: .02 .012; }
  .node { cursor: pointer; }
  .node circle.core { stroke: rgba(0,0,0,.5); stroke-width: .004; }
  .node circle.ring { fill: none; stroke-width: .008; }
  .node.tac circle.tac-ring { fill: none; stroke: var(--blue); stroke-width: .01;
    animation: tacPulse 1.6s ease-in-out infinite; }
  @keyframes tacPulse { 0%,100% { stroke-opacity: .9; } 50% { stroke-opacity: .25; } }
  #tooltip { position: absolute; pointer-events: none; display: none; z-index: 10;
    background: rgba(17,21,32,.94); border: 1px solid var(--border); border-radius: var(--radius-s);
    padding: 8px 12px; font-size: .78rem; line-height: 1.55; max-width: 260px;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  #tooltip .t-name { font-weight: 700; color: var(--yellow); }
  #tooltip .t-row { color: var(--text-dim); }

  aside { width: 330px; border-left: 1px solid var(--border); background: var(--bg-mid);
    overflow-y: auto; padding: 16px; }
  aside h2 { font-family: "ZZZ-thick", "SourceHanSans", sans-serif; font-size: 1rem; color: var(--yellow); margin-bottom: 10px; }
  aside .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 12px; }
  aside .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  aside .cell { background: rgba(255,255,255,.03); border-radius: var(--radius-s); padding: 6px 10px; }
  aside .cell .k { color: var(--text-mute); font-size: .7rem; }
  aside .cell .v { font-size: .9rem; margin-top: 2px; }
  aside .tac-tag { border: 1px solid rgba(59,130,246,.65); color: var(--blue); background: rgba(59,130,246,.1);
    border-radius: 999px; padding: 3px 12px; font-size: .75rem; display: inline-block; margin: 4px 4px 0 0; }
  aside .tac-text { font-size: .78rem; color: var(--text-dim); margin-top: 8px; line-height: 1.6; }
  aside .legend { font-size: .78rem; color: var(--text-dim); line-height: 2; }
  aside .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  aside .empty { color: var(--text-mute); font-size: .8rem; line-height: 1.8; }
  @media (max-width: 800px) { aside { width: 260px; } }
</style>
</head>
<body>
  <header>
    <h1>🌌 银河星图</h1>
    <span class="proto-tag">可行性原型</span>
    <div class="stats" id="hdr-stats"></div>
    <button id="reset-view">重置视图</button>
    <a href="./index.html">← 返回战况面板</a>
  </header>
  <main>
    <div id="viewport">
      <svg id="galaxy" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="tooltip"></div>
    </div>
    <aside id="side">
      <h2>银河概况</h2>
      <div class="legend">
        <div><i style="background:var(--c-humans)"></i>超级地球（我方）</div>
        <div><i style="background:var(--c-terminids)"></i>终结族</div>
        <div><i style="background:var(--c-automaton)"></i>机器人</div>
        <div><i style="background:var(--c-illuminate)"></i>光能族</div>
        <div><i style="background:rgba(239,68,68,.8)"></i>红色虚线 = 敌军反攻路线</div>
        <div><i style="border:2px solid var(--blue);background:none"></i>蓝环 = 战术目标星球</div>
      </div>
      <p class="empty" style="margin-top:12px">点击任意星球查看详情 · 滚轮缩放 · 拖拽平移。<br>数据：data.json + waypoints.json（15 分钟自动更新）</p>
      <div id="side-detail"></div>
    </aside>
  </main>

<script src="./js/tactical.js"></script>
<script>
  "use strict";
  const OWNER_COLOR = { Humans: "var(--c-humans)", Terminids: "var(--c-terminids)",
    Automaton: "var(--c-automaton)", Illuminate: "var(--c-illuminate)" };
  const OWN_CN = { Humans: "超级地球", Terminids: "终结族", Automaton: "机器人", Illuminate: "光能族" };
  const SVG_NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);

  // ---- 视图状态（viewBox：x y w h；y 轴取反使北在上） ----
  const HOME = { x: -1.18, y: -1.18, w: 2.36, h: 2.36 };
  let vb = { ...HOME };
  const svg = $("galaxy");
  function applyView() { svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  const fmt = (n) => (n || 0).toLocaleString("zh-CN");

  // ---- 数据加载与渲染 ----
  async function load() {
    const [data, wpRaw] = await Promise.all([
      (await fetch("./data.json?t=" + Date.now(), { cache: "no-store" })).json(),
      (await fetch("./tables/waypoints.json?t=" + Date.now(), { cache: "no-store" })).json(),
    ]);
    const wp = wpRaw.waypoints || wpRaw;
    const byIdx = {};
    (data.planets || []).forEach(p => { byIdx[p.index] = p; });
    const isOurs = i => byIdx[i] && byIdx[i].currentOwner === "Humans";
    const defPlanets = new Set((data.campaigns || []).filter(c => c.campaignType === "defense").map(c => c.planet.index));
    const attacks = data.planet_attacks || [];
    const events = data.planet_events || [];

    // 战术目标（复用 tactical.js；传入完整 waypoints 包裹对象，模块内自取内层表）
    const tacBy = {};
    try {
      if (window.Tactical) {
        const ctx = { planets: data.planets, campaigns: data.campaigns, waypoints: wpRaw,
          nameOf: (idx) => byIdx[idx] ? byIdx[idx].name : "#" + idx, sectorCnOf: (s) => s };
        Object.keys(wp).forEach(k => {
          const tags = window.Tactical.computeFor(+k, ctx);
          if (tags.length) tacBy[+k] = tags;
        });
      }
    } catch (_) { /* 词条失败不影响星图 */ }

    // ---- 补给线（有向，出向画一次）+ 反攻线高亮 ----
    const atkSet = new Set(attacks.map(a => a.source + "->" + a.target));
    let edges = "";
    Object.keys(wp).forEach(k => {
      (wp[k] || []).forEach(to => {
        const isAtk = atkSet.has(k + "->" + to);
        edges += `<line class="supply${isAtk ? " atk" : ""}" x1="${byIdx[k] ? byIdx[k].position.x : 0}" y1="${byIdx[k] ? -(byIdx[k].position.y || 0) : 0}" x2="${byIdx[to] ? byIdx[to].position.x : 0}" y2="${byIdx[to] ? -(byIdx[to].position.y || 0) : 0}"/>`;
      });
    });

    // ---- 节点 ----
    let nodes = "";
    (data.planets || []).forEach(p => {
      const pos = p.position;
      if (!pos || (pos.x === 0 && pos.y === 0)) return;   // 无坐标跳过（哨兵）
      const owner = p.currentOwner || "";
      const color = OWNER_COLOR[owner] || "var(--text-mute)";
      const libPct = p.maxHealth > 0 ? Math.max(0, Math.min(100, (1 - p.health / p.maxHealth) * 100)) : 0;
      const isDef = defPlanets.has(p.index);
      const isEv = events.some(e => e.planetIndex === p.index);
      const r = 0.012 + Math.min(0.012, (p.players || 0) / 8000);
      // 解放度弧：敌占星显示（我方不显示）
      const C = 2 * Math.PI * (r + 0.006);
      const arc = (!isOurs(p.index) && libPct > 0)
        ? `<circle class="ring" cx="${pos.x}" cy="${-pos.y}" r="${r + 0.006}" stroke="var(--yellow)"
             stroke-dasharray="${(C * libPct / 100).toFixed(4)} ${C.toFixed(4)}" transform="rotate(-90 ${pos.x} ${-pos.y})"/>` : "";
      nodes += `<g class="node${tacBy[p.index] ? " tac" : ""}" data-idx="${p.index}"
          transform="translate(${pos.x},${-pos.y})">
          <circle class="core" r="${r.toFixed(4)}" fill="${color}"></circle>
          ${isDef ? `<circle r="${(r + 0.008).toFixed(4)}" fill="none" stroke="rgba(239,68,68,.7)" stroke-width=".005"></circle>` : ""}
          ${isEv ? `<circle r="${(r + 0.012).toFixed(4)}" fill="none" stroke="var(--yellow)" stroke-width=".005" stroke-dasharray=".015 .01"></circle>` : ""}
          ${arc}
          ${tacBy[p.index] ? `<circle class="tac-ring" r="${(r + 0.016).toFixed(4)}"></circle>` : ""}
        </g>`;
    });

    svg.innerHTML = edges + nodes;
    applyView();

    // ---- 顶栏统计 ----
    const owners = {};
    (data.planets || []).forEach(p => { owners[p.currentOwner] = (owners[p.currentOwner] || 0) + 1; });
    const tacCount = Object.keys(tacBy).length;
    $("hdr-stats").innerHTML =
      `<span>星球 ${Object.keys(owners).reduce((a, k) => a + owners[k], 0)}</span>` +
      Object.keys(owners).map(k => `<span>${OWN_CN[k] || k} ${owners[k]}</span>`).join("") +
      `<span style="color:var(--blue)">战术目标 ${tacCount}</span>` +
      `<span style="color:#E74C3C">反攻 ${attacks.length}</span>`;

    // ---- 交互 ----
    bindPanZoom();
    bindHover(byIdx, data);
    bindClick(data, byIdx, tacBy);
  }

  // ---- 缩放 + 拖拽（viewBox 变换） ----
  function bindPanZoom() {
    const vp = $("viewport");
    let dragging = false, moved = 0, sx = 0, sy = 0, vbStart = null;
    vp.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = e.deltaY > 0 ? 1.15 : 1 / 1.15;
      const rect = svg.getBoundingClientRect();
      const mx = vb.x + (e.clientX - rect.left) / rect.width * vb.w;
      const my = vb.y + (e.clientY - rect.top) / rect.height * vb.h;
      let nw = Math.min(4.5, Math.max(0.12, vb.w * factor));
      const k = nw / vb.w;
      vb.x = mx - (mx - vb.x) * k;
      vb.y = my - (my - vb.y) * k;
      vb.w = nw; vb.h = vb.h * k;
      applyView();
    }, { passive: false });
    vp.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".node")) return;   // 节点点击不进入拖拽
      dragging = true; moved = 0; sx = e.clientX; sy = e.clientY; vbStart = { ...vb };
      vp.classList.add("dragging");
      vp.setPointerCapture(e.pointerId);
    });
    vp.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const rect = svg.getBoundingClientRect();
      const dx = (e.clientX - sx) / rect.width * vb.w;
      const dy = (e.clientY - sy) / rect.height * vb.h;
      moved = Math.max(moved, Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy));
      vb.x = vbStart.x - dx; vb.y = vbStart.y - dy;
      applyView();
    });
    vp.addEventListener("pointerup", () => { dragging = false; vp.classList.remove("dragging"); });
    $("reset-view").addEventListener("click", () => { vb = { ...HOME }; applyView(); });
  }

  // ---- hover tooltip ----
  function bindHover(byIdx, data) {
    const tip = $("tooltip");
    svg.addEventListener("pointermove", (e) => {
      const g = e.target.closest(".node");
      if (!g) { tip.style.display = "none"; return; }
      const p = byIdx[+g.dataset.idx];
      if (!p) return;
      const libPct = p.maxHealth > 0 ? ((1 - p.health / p.maxHealth) * 100).toFixed(1) : "—";
      const owners = { Humans: "超级地球", Terminids: "终结族", Automaton: "机器人", Illuminate: "光能族" };
      tip.innerHTML = `<div class="t-name">${esc(p.name)}</div>` +
        `<div class="t-row">归属：${esc(owners[p.currentOwner] || p.currentOwner)}</div>` +
        `<div class="t-row">解放度：${libPct}% · 玩家 ${fmt(p.players)}</div>`;
      tip.style.display = "block";
      const vpRect = $("viewport").getBoundingClientRect();
      let x = e.clientX - vpRect.left + 14, y = e.clientY - vpRect.top + 14;
      if (x + 270 > vpRect.width) x -= 290;
      if (y + 90 > vpRect.height) y -= 100;
      tip.style.left = x + "px"; tip.style.top = y + "px";
    });
    svg.addEventListener("pointerleave", () => { $("tooltip").style.display = "none"; });
  }

  // ---- click 详情侧栏 ----
  function bindClick(data, byIdx, tacBy) {
    svg.addEventListener("click", (e) => {
      const g = e.target.closest(".node");
      if (!g) return;
      const i = +g.dataset.idx;
      const p = byIdx[i];
      if (!p) return;
      const owners = { Humans: "超级地球", Terminids: "终结族", Automaton: "机器人", Illuminate: "光能族" };
      const libPct = p.maxHealth > 0 ? ((1 - p.health / p.maxHealth) * 100).toFixed(2) : "—";
      const tags = tacBy[i] || [];
      $("side-detail").innerHTML =
        `<div class="card"><h2>${esc(p.name)}</h2>` +
        `<div class="kv">
          <div class="cell"><div class="k">归属</div><div class="v">${esc(owners[p.currentOwner] || p.currentOwner)}</div></div>
          <div class="cell"><div class="k">解放度</div><div class="v">${libPct}%</div></div>
          <div class="cell"><div class="k">在线玩家</div><div class="v">${fmt(p.players)}</div></div>
          <div class="cell"><div class="k">星区</div><div class="v">${esc(p.sector || "—")}</div></div>
        </div></div>` +
        (tags.length ? `<div class="card"><h2>⚡ 战术目标</h2>` +
          tags.map(t => `<div style="margin-bottom:8px"><span class="tac-tag">${esc(t.title)}</span>` +
            `<div class="tac-text">${esc(t.text)}</div></div>`).join("") + `</div>` : "");
    });
  }

  load().catch(e => {
    $("side-detail").innerHTML = `<div class="empty">⚠️ 数据加载失败：${esc(e.message)}</div>`;
  });
</script>
</body>
</html>
