name: Fetch HD2 Data

on:
  # 触发方式（2026-09 调整）：5 分钟的主力定时改由 Cloudflare Worker 从外部 dispatch
  # （原「本机 cron 每 15 分钟 dispatch」方案已废弃 —— 那个必须一直开着电脑）。
  # GitHub 原生 schedule 在密集 cron 下实测被大量丢弃/延迟，所以这里只留一组
  # 错开分钟的兜底：:07 :22 :37 :52，与 Worker 的 :00 :05 :10 不撞车。
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:   # 支持手动触发
  repository_dispatch:
    types: [fetch-now]  # 支持外部调用触发（如翻译推送后）

permissions:
  contents: write

# 5 分钟一次时防止上一次没跑完就叠加（单次约 25 秒，正常不会撞，接口变慢时兜住）
concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run data fetcher
        run: python scripts/fetch_site_data.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Commit and push
        run: |
          git config user.name "Jerry Jiang"
          git config user.email "69064950+Jerry114514@users.noreply.github.com"
          git add HD2-Galatic_war-Map/data.json
          git add HD2-Galatic_war-Map/data/history/player_distribution.json
          if ! git diff --cached --quiet; then
            git commit -m "data: 自动更新战况数据 ($(date -u '+%Y-%m-%d %H:%M'))"
            git push
          else
            echo "数据无变化，跳过提交"
          fi
