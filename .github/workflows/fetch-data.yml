name: Fetch HD2 Data

on:
  # 触发方式：
  #   主力 = 下面的原生 schedule，每小时一次（整点后第 5 分钟，避开整点高峰）。
  #   备用 = Cloudflare Worker 外部 dispatch（helldivers2-gitpage-dispatch），
  #          它的 cron 触发器配好后会再叠一层；重复触发无害（脚本幂等，无变化不提交）。
  #   已废弃 = 本机 cron（必须一直开着电脑）。
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:   # 支持手动触发
  repository_dispatch:
    types: [fetch-now]  # 支持外部调用触发（如翻译推送后）

permissions:
  contents: write
  actions: write     # 末尾清理 Pages 部署 artifact 需要
  issues: write      # API 内容变化报告需要创建/刷新常驻 issue

# 防止上一次没跑完就叠加（单次约 25 秒，接口变慢时兜住）
concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run data fetcher
        run: python scripts/fetch_site_data.py
        env:
          PYTHONIOENCODING: utf-8

      # 实测帧缓存（2026-09-29）：站点 js/rate-source.js 读 HD2-Galatic_war-Map/data/recent/
      # 里的社区 CDN 15 分钟帧来算「实测速率」（星球四件套 / 城市四项 / MO 预期进度）。
      # 这份缓存不在仓库里时，Pages 上所有卡片都会退回推演、角标写「推演 · 无实测帧」。
      # 帧是滚动窗口，跟随每小时抓取刷新即可；对外站点的“实测”角标仍使用最新可用帧。
      # ⚠ 缓存是滚动窗口（星球/区域 1 小时、MO 48 小时），必须靠这一步持续刷新；
      #   推一份静态快照上去，页面会继续拿"过去那个小时"的差分标「实测」。
      - name: Fetch HD2 recent frames (实测帧缓存)
        run: python scripts/fetch_recent_frames.py
        env:
          PYTHONIOENCODING: utf-8

      # 参考 Galactic Wide Web 的内容侦测：官方 GalacticWarEffects 定义 +
      # 每颗星球的 planetActiveEffects 集合分别与仓库基线比较。
      # stateless CI 不能依赖上一次进程的内存，因此只持久化这两个稳定快照。
      - name: Detect API content changes
        id: api-changes
        continue-on-error: true
        run: |
          python scripts/detect_api_changes.py \
            --report "$RUNNER_TEMP/api_changes_report.md" \
            --latest-report "data/api_changes_latest.md" \
            --github-output "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/api_changes_report.md" ]; then
            cat "$RUNNER_TEMP/api_changes_report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          PYTHONIOENCODING: utf-8

      - name: Announce API content change
        if: steps.api-changes.outputs.has_changes == 'true'
        run: |
          echo "::notice title=HD2 API content changed::${{ steps.api-changes.outputs.change_count }} change(s) detected"

      # 与现有 schema watch / upstream watch 一样，使用一条常驻 issue，
      # 基线已同步，所以同一批变化不会在下一次运行重复通知。
      - name: Publish API content change issue
        if: steps.api-changes.outputs.has_changes == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n="$(gh issue list --state open --search 'HD2 API 内容变更 in:title' \
            --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file data/api_changes_latest.md
            echo "已刷新 issue #$n"
          else
            gh issue create \
              --title "🔔 HD2 API 内容变更（自动刷新）" \
              --body-file data/api_changes_latest.md
          fi

      - name: Commit and push
        run: |
          git config user.name "Jerry Jiang"
          git config user.email "69064950+Jerry114514@users.noreply.github.com"
          git add HD2-Galatic_war-Map/data.json
          git add HD2-Galatic_war-Map/data/history/player_distribution.json
          git add HD2-Galatic_war-Map/data/recent
          # API 内容侦测状态与最近一次变化报告：基线有变化才重写。
          if [ -f data/api_changes_baseline.json ]; then
            git add data/api_changes_baseline.json
          fi
          if [ -f data/api_changes_latest.md ]; then
            git add data/api_changes_latest.md
          fi
          # 新战役横幅（scripts/fetch_site_data.py 落盘的 assets/campaign/banner_*.webp）
          # 必须一起提交，否则 data.json 里的 banner_image_local 在线上会 404
          git add HD2-Galatic_war-Map/assets/campaign
          # 战役奖励类型表（scripts/fetch_reward_types.py 落盘）：新战役出现新 mixId 时会被重写。
          # 必须一起提交，否则每个小时都会重抓一次上游 bundle（白耗流量），页面也拿不到明文。
          git add HD2-Galatic_war-Map/data/reward_types.json
          if ! git diff --cached --quiet; then
            git commit -m "data: 自动更新战况数据 ($(date -u '+%Y-%m-%d %H:%M'))"
            # ⚠ 推送竞态：check out 之后、push 之前
            #   main 上完全可能有别的提交落下来（人工 API 推送 / fetch-patchnotes / sync-tables /
            #   sync-release-status / build-search-index）→ 直接 push 被拒（non-fast-forward）→
            #   job 变红但数据无问题。用户收到的「Fetch HD2 Data Run failed」邮件全是这一类。
            #   重试逻辑抽到 scripts/ci_push_retry.sh，5 个工作流共用一份。
            bash scripts/ci_push_retry.sh
          else
            echo "数据无变化，跳过提交"
          fi

      # 为什么清在这里、而不是另开一个 cleanup-artifacts.yml：
      # 另一个工作流用的是 GitHub 原生 schedule，实测新增的定时工作流可能长时间不被触发
      # （部署后 20+ 分钟 0 次运行），而本工作流的 schedule 稳定按点跑 —— 挂这里最可靠。
      # 背景：每次推送都会触发 Pages 重建并产出 1 个 github-pages artifact（≈整站体积 50 MB），
      # GitHub Free 的 Actions 存储上限是 500 MB，不限时清理必然会撞上限。
      # 只删 10 分钟以前的，避免删掉正在部署中的 artifact。
      - name: 清理旧的 Pages artifact
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          cutoff=$(date -u -d '10 minutes ago' +%s)
          gh api --paginate "repos/$repo/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.id)\t\(.created_at)"' |
          while IFS=$'\t' read -r id created; do
            [ -z "$id" ] && continue
            ts=$(date -u -d "$created" +%s)
            if [ "$ts" -lt "$cutoff" ]; then
              gh api -X DELETE "repos/$repo/actions/artifacts/$id" >/dev/null && echo "删除 $id ($created)"
            fi
          done
          echo "---- 清理后 ----"
          gh api "repos/$repo/actions/artifacts" \
            --jq '"剩余 \(.total_count) 个 / \(([.artifacts[].size_in_bytes] | add // 0) / 1048576 | floor) MB"'
