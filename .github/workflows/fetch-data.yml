name: Fetch HD2 Data

on:
  # GitHub Actions schedule 有 15-30 分钟延迟（实测 */5 实际 18-31 分钟一次）
  # 用 3 组错开的 cron 分散触发点，提高实际频率（期望 ~7 分钟一次）
  schedule:
    - cron: '0,20,40 * * * *'    # 每组内部错开，避免集中排队
    - cron: '7,27,47 * * * *'
    - cron: '14,34,54 * * * *'
  workflow_dispatch:   # 支持手动触发
  repository_dispatch:
    types: [fetch-now]  # 支持外部调用触发（如翻译推送后）

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run data fetcher
        run: python scripts/fetch_site_data.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Commit and push
        run: |
          git config user.name "Jerry Jiang"
          git config user.email "69064950+Jerry114514@users.noreply.github.com"
          git add HD2-Galatic_war-Map/data.json
          if ! git diff --cached --quiet; then
            git commit -m "data: 自动更新战况数据 ($(date -u '+%Y-%m-%d %H:%M'))"
            git push
          else
            echo "数据无变化，跳过提交"
          fi
