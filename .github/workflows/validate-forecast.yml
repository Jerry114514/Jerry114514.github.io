name: Validate war forecasts
on:
  # Always create the PR check, including when branch protection requires it.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'HD2-Galatic_war-Map/js/forecast.js'
      - 'HD2-Galatic_war-Map/js/rate-source.js'
      - 'HD2-Galatic_war-Map/js/regions.js'
      - 'HD2-Galatic_war-Map/js/ownership-changes.js'
      - 'HD2-Galatic_war-Map/js/dss-donations.js'
      - 'HD2-Galatic_war-Map/tables/hd2_variables.json'
      - 'HD2-Galatic_war-Map/data/history/ownership_seed.json'
      - 'scripts/fetch_site_data.py'
      - 'scripts/fetch_reward_types.py'
      - 'HD2-Galatic_war-Map/data/reward_types.json'
      - 'scripts/tests/**'
      - '.github/workflows/validate-forecast.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/tests/forecast-check.mjs
      - run: node scripts/tests/regions-check.mjs
      - run: node scripts/tests/planet-cards-check.mjs
      - run: node scripts/tests/ownership-changes-check.mjs
      - run: node scripts/tests/reinforcement-share-check.mjs
      - run: node scripts/tests/dss-donations-check.mjs
      - run: node scripts/tests/mo-equipment-check.mjs
      # 弹道模拟器（HD2_Ballistics）：核心物理无需游戏数据；导入/DOM 用例在缺数据时自动 skip
      - run: node --test HD2_Ballistics/tests/velocity-inheritance.test.cjs
      - run: node --test HD2_Ballistics/tests/import-and-charts.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
