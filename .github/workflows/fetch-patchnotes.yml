name: Fetch Patch Notes

# 更新公告（patch notes）自动接入
# ---------------------------------------------------------------------------
# 做什么：每 2 小时检查 helldivers.wiki.gg 的 Category:Patch Notes；
#   ① 发现新版本 → 抓成英文主干写进 HD2_Wiki/data/wiki/zh/patchnotes.json
#   ② 同步 sitemap 里的详情页（gen_sitemap.py 幂等，已有 URL 的 lastmod 不动）
#   ③ **先过校验器再提交**（§11.1-13「先校验后写盘」在 CI 里的等价物）
#   ④ 有新版本 → 向私密转译仓发 repository_dispatch，**直接触发翻译入库**（2026-10-22）
#
# 为什么是**独立工作流**而不是挂进 fetch-data.yml：
#   挂进 fetch-data 能复用主数据触发，但 fetch-data 是**整站数据的主命脉**，
#   而且现在每小时才运行一次，不能满足公告检查的时效，故保持独立工作流。
#   公告的内容类型（一个月变几次）不需要分钟级新鲜度，所以选独立工作流，爆炸半径仅限自己。
#   ⚠ 已知代价（§11.4 记过）：**GitHub 会节流新增的定时工作流**，实测可能几小时才跑一次。
#   若发现长期不触发，按交接文档 §11.4 的做法把它挂进 fetch-data.yml（那条 schedule 稳定）。
#   手动兜底：本工作流支持 workflow_dispatch，也可在本机直接跑 scripts/fetch_patchnotes.py。
#
# 翻译不再「人在环」：HD2Web-Trans 的 Translate Patch Notes 会拉站点权威主干、机翻 +
# 结构自检，然后把 patchnotes_zh.json 推回本站（本站校验器 PATCH.PAIRING 兜底）。
# 本工作流只负责「英文主干入库 + 触发翻译」；dispatch 失败会让 job 变红，不再静默等 6h 定时。
# ⚠ 跨仓触发需要 secrets.HD2_TRANS_TOKEN（对 HD2Web-Trans 有 Actions: write 的 PAT）。

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:      # 支持手动触发（新版本上线后可立即拉一次）

permissions:
  contents: write         # 提交 patchnotes.json 与 sitemap.xml

concurrency:
  group: fetch-patchnotes
  cancel-in-progress: false

jobs:
  patch-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 抓取更新公告（上游无新版本则文件不动）
        id: fetch
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          out="$(python scripts/fetch_patchnotes.py --limit 10)"
          echo "$out"
          # 脚本末尾会打一行机器可读的 NEW_VERSIONS:（见 fetch_patchnotes.py）
          new="$(printf '%s\n' "$out" | sed -n 's/^NEW_VERSIONS: //p' | tail -1)"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: 同步 sitemap 详情页
        run: python scripts/gen_sitemap.py

      # 站内搜索索引（scripts/gen_search_index.py，2026-09-23 加入）：
      # 公告一变，首页全文搜索就该能立刻搜到新条目 —— 索引是**确定性产物**，
      # 数据没变时脚本不写盘，所以这一步不会制造空提交。
      - name: 重建站内搜索索引
        run: python scripts/gen_search_index.py

      - name: 数据校验（不通过就整体失败，因此不会提交）
        run: python scripts/validate_wiki_data.py

      - name: Commit and push
        run: |
          git config user.name "Jerry Jiang"
          git config user.email "69064950+Jerry114514@users.noreply.github.com"
          git add HD2_Wiki/data/wiki/zh/patchnotes.json sitemap.xml \
                  HD2_Wiki/data/wiki/zh/search_index.json HD2_Wiki/data/wiki/zh/search_entries.json
          if git diff --cached --quiet; then
            echo "公告无变化，跳过提交"
          else
            git commit -m "data(公告): 自动接入更新公告 ($(date -u '+%Y-%m-%d %H:%M'))"
            bash scripts/ci_push_retry.sh
          fi

      - name: 有新版本 → 触发翻译入库（HD2Web-Trans）
        if: steps.fetch.outputs.new != ''
        env:
          TRANS_TOKEN: ${{ secrets.HD2_TRANS_TOKEN }}
        run: |
          set -euo pipefail
          vers="${{ steps.fetch.outputs.new }}"
          if [ -z "${TRANS_TOKEN:-}" ]; then
            echo "::error::缺少 secrets.HD2_TRANS_TOKEN（跨仓触发翻译需要 PAT）"
            exit 1
          fi
          http="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TRANS_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            https://api.github.com/repos/Jerry114514/HD2Web-Trans/dispatches \
            -d "{\"event_type\":\"translate-patchnotes\",\"client_payload\":{\"versions\":\"$vers\"}}")"
          if [ "$http" != "204" ]; then
            echo "::error::触发翻译失败: HTTP $http — $(cat /tmp/dispatch.json)"
            exit 1
          fi
          echo "已触发 Translate Patch Notes 入库：$vers"
