# Issue 模板选择器的配置
# 文档：https://docs.github.com/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository

# 允许开空白 Issue：上面的表单是给「说不清该选哪个」的人兜底的，
# 不要因为表单存在就堵死自由格式的反馈。
blank_issues_enabled: true

contact_links:
  - name: 📖 贡献指南（数据怎么改、CI 红了怎么办）
    url: https://github.com/Jerry114514/Jerry114514.github.io/blob/main/CONTRIBUTING.md
    about: 想自己动手改数据？先看这里——「§2 怎么改 · 方式 A」是细到「点哪个按钮」的提 PR 完整教程（5 步速查卡、commit 与分支名怎么起、PR 描述模板、Checks 显示 0 是正常的、CI 红了怎么改），网页上点铅笔就能提，不用装任何工具；数据格式只有 6 条规则，见其中的「📝 极简 JSON 科普」与 4 个可复制的填空模板。

  - name: 📐 数据 Schema（字段规范，技术向）
    url: https://github.com/Jerry114514/Jerry114514.github.io/blob/main/HD2_Wiki/data/wiki/zh/SCHEMA.md
    about: 各数据集有哪些字段、_zh 覆盖怎么配对、术语表规则，都在这里。

  - name: 💬 B 站私信反馈
    url: https://space.bilibili.com/57439297
    about: 不想用 GitHub？也可以通过 B 站私信反馈问题。
