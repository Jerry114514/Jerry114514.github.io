name: 数值修正
description: 某个条目的数值 / 属性写错了（伤害、血量、冷却、价格、难度……）。也欢迎直接提 PR，见站内投稿指南 https://jerry114514.github.io/HD2_Wiki/contributing.html。
title: "[数值] "
labels:
  - 数据修正
body:
  - type: markdown
    attributes:
      value: |
        数值错误会直接影响玩家的配装与战术判断，所以**证据很重要**——
        请尽量附上游戏内截图或权威出处。

        > 💡 **想自己动手改？** 找到对应的数据集文件（武器 / 战略配备 / 敌人 / 任务 /
        > 强化资源 / 战争债券），在网页上点铅笔即可编辑，流程见
        > [投稿指南（站内页）](https://jerry114514.github.io/HD2_Wiki/contributing.html)。
        > **不想碰 JSON 就继续填下面的表单。**
        > 想自己动手的话，数据格式只有 6 条规则并附了可复制的填空模板，
        > 见
        > [投稿指南 · §3 📝 极简 JSON 科普](https://jerry114514.github.io/HD2_Wiki/contributing.html#3-📝-极简-json-科普没有编程经验也能看懂)。

  - type: input
    id: entry
    attributes:
      label: 条目
      description: 是哪个条目？建议写成「英文原名（中文名）」。
      placeholder: 例如：MG-206 Heavy Machine Gun（重型机枪）
    validations:
      required: true

  - type: input
    id: field
    attributes:
      label: 字段
      description: 哪个数值错了？写字段名或直接描述（不确定字段名就描述，维护者会找）。
      placeholder: 例如：伤害 / damage，或「每匣弹药数」
    validations:
      required: true

  - type: input
    id: current_value
    attributes:
      label: 当前值
      description: 站点上现在写的是什么。
      placeholder: 例如：80
    validations:
      required: true

  - type: input
    id: correct_value
    attributes:
      label: 正确值
      description: 应该是多少。请只填你**确认过**的值。
      placeholder: 例如：100
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 你是怎么确认的？游戏内截图、wiki 链接、官方补丁说明都行。
      placeholder: |
        例如：
        - 游戏内武器面板截图（见附件）
        - https://helldivers.wiki.gg/wiki/MG-206_Heavy_Machine_Gun
        - 版本：2026-09 更新后实测
    validations:
      required: true

  - type: dropdown
    id: game_version
    attributes:
      label: 你确认该数值时的游戏版本
      description: 《绝地潜兵 2》会随版本调整数值，版本信息能帮我们判断是不是上游也过期了。
      options:
        - 当前最新版本
        - 较旧版本（请在证据里说明）
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      description: 勾选后才能提交，避免重复劳动。
      options:
        - label: 我提供的「正确值」来自实测或权威出处，不是凭印象推测的。
          required: true
